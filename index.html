// ================= FILAS DE METRICAS: FUENTE UNICA =================
// Un solo informe para "Lineas de conversion" y para el bloque en vivo de "Ads & Guiones".
// Antes habia dos arrays casi identicos (ROWS y LIVE_ROWS) que se fueron desincronizando:
// uno leia los registros de l.metrics y el otro de GHL, y el de Ads no mostraba
// campana / adset / anuncio / filtro / destino / landings / cambio realizado.
//
// Las lineas en vivo (c.liveLines) no guardan esos campos descriptivos, asi que se heredan
// de la linea de conversion que estaba corriendo en ese mismo rango de fechas.

function _lineDescFor(c, l){
  if(!l) return {};
  if(!l.live) return l;
  const s=l.dateStart?new Date(l.dateStart):null;
  if(!s) return {};
  const e=l.dateEnd?new Date(l.dateEnd):new Date();
  const hit=(c.conversionLines||[])
    .filter(function(x){
      if(!x.dateStart) return false;
      const xs=new Date(x.dateStart);
      const xe=x.dateEnd?new Date(x.dateEnd):new Date();
      return xs<=e && xe>=s;
    })
    .sort(function(a,b){return new Date(b.dateStart)-new Date(a.dateStart);})[0];
  return hit||{};
}

// Marca visualmente los valores que no son propios de la fila sino heredados de la linea.
function _mrHered(html, heredado){
  if(!heredado) return html;
  return '<span title="Heredado de la linea de conversion que corria en ese rango" style="border-bottom:1px dotted var(--border2)">'+html+'</span>';
}

// ================= BITACORA DE LA SEMANA =================
// El histórico semanal se genera solo desde Meta y GHL, pero no sabe QUE hicimos nosotros.
// Esto cruza el rango de cada bloque con las tareas y las lineas de conversion del cliente
// para responder "esta semana, que se toco".
function semanaBitacora(c, l){
  if(!l||!l.dateStart) return [];
  var ini=new Date(l.dateStart); ini.setHours(0,0,0,0);
  var fin=l.dateEnd?new Date(l.dateEnd):new Date(); fin.setHours(23,59,59,999);
  var dentro=function(v){
    if(!v) return false;
    var d=new Date(v);
    return !isNaN(d.getTime()) && d>=ini && d<=fin;
  };
  var out=[];

  // Cambios de campana anotados a mano: son el dato que ninguna API puede dar.
  (c.conversionLines||[]).forEach(function(cl){
    if(!dentro(cl.dateStart)) return;
    var txt=cl.notes||('Arranco '+(cl.version||'un bloque nuevo'));
    out.push({ts:new Date(cl.dateStart).getTime(), tipo:'cambio', texto:txt});
  });

  (c.tasks||[]).forEach(function(t){
    if(t.deleted) return;
    if(dentro(t.doneAt)) out.push({ts:new Date(t.doneAt).getTime(), tipo:'hecha', texto:(t.text||'sin titulo'), ref:t.ticket||''});
    else if(dentro(t.delegatedAt)) out.push({ts:new Date(t.delegatedAt).getTime(), tipo:'pedida', texto:(t.text||'sin titulo'), ref:t.ticket||''});
  });

  (c.fathomCalls||[]).forEach(function(cl){
    var d=(typeof parseDDMMYYYY==='function')?parseDDMMYYYY(cl.date):null;
    if(!d||d<ini||d>fin) return;
    out.push({ts:d.getTime(), tipo:'llamada', texto:(cl.title||'Llamada grabada')});
  });

  // Movimientos detectados en Meta: pausas, presupuestos, segmentacion, rechazos.
  // Se guardan aqui para que queden como registro historico y no solo como aviso del momento.
  (c.metaChanges||[]).forEach(function(ch){
    if(!dentro(ch.ts)) return;
    var txt=(typeof metaEtiqueta==='function')?metaEtiqueta(ch):'Cambio en Meta';
    out.push({ts:new Date(ch.ts).getTime(), tipo:'meta',
      texto:txt+': '+(ch.ad||''), ref:ch.detalle||''});
  });

  out.sort(function(a,b){return a.ts-b.ts;});
  return out;
}

// Nombres de campana / adset / anuncio que vinieron de Meta para ese rango.
// Si hay uno solo se muestra; si hay varios, el de mayor gasto y cuantos mas hubo.
function _metaNombres(l, clave){
  var arr=(l&&l.meta&&l.meta[clave])||[];
  if(!arr.length) return null;
  var det=arr.map(function(x){return x.nombre+' \u2014 $'+x.gasto;}).join('\n');
  if(arr.length===1) return '<span title="'+esc(det)+'">'+esc(arr[0].nombre)+'</span>';
  return '<span title="'+esc(det)+'" style="border-bottom:1px dotted var(--border2);cursor:help">'
    +esc(arr[0].nombre)+' <span style="color:var(--text3)">+'+(arr.length-1)+'</span></span>';
}

// Landings por las que entraron los registros de un rango. La URL sale de
// source.landingUrl (attributionSource.url del contacto) y se agrupa por pagina,
// sin los parametros de tracking: si no, cada lead seria una fila distinta.
function landingsDelRango(c, dateStart, dateEnd){
  var ini=dateStart?new Date(dateStart):null;
  var fin=dateEnd?new Date(dateEnd):new Date();
  if(ini) ini.setHours(0,0,0,0);
  fin.setHours(23,59,59,999);
  var mapa={};
  ((c.ghl&&c.ghl.opportunities)||[]).forEach(function(o){
    var t=o.createdAt?new Date(o.createdAt):null;
    if(!t||isNaN(t.getTime())) return;
    if(ini && t<ini) return;
    if(t>fin) return;
    var s=o.source||{};
    // landingUrl viene del enriquecido por contacto; url viene ya en la sincronizacion
    // cuando la busqueda de oportunidades trae la atribucion completa.
    var u=s.landingUrl||s.url||'';
    if(!u || !/^https?:/i.test(String(u))) return;
    var limpia=String(u).split('?')[0].split('#')[0].replace(/\/$/,'');
    if(!limpia) return;
    if(!mapa[limpia]) mapa[limpia]={url:limpia,n:0};
    mapa[limpia].n++;
  });
  return Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.n-a.n;});
}

function landingsRowHtml(c, l){
  var arr=landingsDelRango(c, l.dateStart, l.dateEnd);
  if(!arr.length) return null;
  var total=arr.reduce(function(s,x){return s+x.n;},0);
  // Registros del rango segun GHL: es el universo real contra el que hay que leer los %.
  var universo=total;
  try{ var f=ghlFunnelForRange(c,l.dateStart,l.dateEnd); if(f&&f.registros>0) universo=f.registros; }catch(e){}
  var cobertura=(universo>total)
    ? '<span style="font-size:10.5px;color:var(--text3);margin-left:2px" title="GHL solo guarda la pagina de origen de algunos contactos. Los porcentajes son sobre los atribuidos, no sobre el total de registros.">'
      +'\u00b7 '+total+' de '+universo+' leads atribuidos</span>'
    : '';
  return arr.slice(0,4).map(function(x){
    var corta=x.url.replace(/^https?:\/\//,'');
    if(corta.length>44) corta=corta.slice(0,44)+'\u2026';
    var pct=total?Math.round(x.n/total*100):0;
    return '<span style="display:inline-flex;align-items:center;gap:6px;margin:0 12px 3px 0">'
      +'<a href="'+esc(x.url)+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none" '
      +'onclick="event.stopPropagation()" title="'+esc(x.url)+'">'+esc(corta)+' \u2197</a>'
      +'<span style="font-size:11px;color:var(--text3)">'+x.n+' ('+pct+'%)</span></span>';
  }).join('')+(arr.length>4?'<span style="font-size:11px;color:var(--text3)">+'+(arr.length-4)+' mas</span>':'')+cobertura;
}

function buildMetricRows(c, opts){
  opts=opts||{};
  const live=!!opts.live;
  const dash='<span style="color:var(--text3)">-</span>';
  const F=function(l){ return ghlFunnelForRange(c,l.dateStart,l.dateEnd); };
  const D=function(l){ return _lineDescFor(c,l); };
  const her=function(l){ return live && !!l && !!l.live; };

  const rows=[
    {label:'Rango fechas',get:l=>fmtDateRange(l.dateStart,l.dateEnd)},
    {label:'Dias transcurridos',get:l=>{const d=days(l.dateStart,l.dateEnd);return d!==null?'<strong>'+d+'</strong> dias':dash;}},
    {label:'Campana',get:l=>{const n=_metaNombres(l,'campaigns');if(n)return n;const d=D(l);return d.campaign?_mrHered(esc(d.campaign),her(l)):dash;}},
    {label:'Adset',get:l=>{const n=_metaNombres(l,'adsets');if(n)return n;const d=D(l);return d.adset?_mrHered(esc(d.adset),her(l)):dash;}},
    {label:'Anuncio',get:l=>{const n=_metaNombres(l,'ads');if(n)return n;const d=D(l);return d.ad?_mrHered(esc(d.ad),her(l)):dash;}},
    {label:'Filtro',soloSiHay:l=>!!D(l).filtro,get:l=>{const d=D(l);if(!d.filtro)return dash;const cls=d.filtro==='ALTO'?'pill-red':d.filtro==='MEDIO'?'pill-amber':'pill-green';return _mrHered('<span class="pill '+cls+'" style="font-size:10px">'+d.filtro+'</span>',her(l));}},

      const f=F(l);

    }},
    {label:'Costo por Lead',get:l=>fmtVal((l.metrics||{}).cpl,'$')},
    {label:'Registros',get:l=>{const f=F(l);return f?'<span title="Contactos creados en GHL dentro del rango">'+f.registros+'</span>':fmtVal((l.metrics||{}).registros);}},
    {label:'Landings de origen',soloSiHay:l=>!!landingsRowHtml(c,l),get:l=>landingsRowHtml(c,l)||dash},
    {label:'Llamada calificada en vivo',get:l=>{const f=F(l);return (f&&f.sql!=null)?String(f.sql):fmtVal((l.metrics||{}).sql);}},
    {label:'Costo calificado',get:l=>{
      const f=F(l);const m=l.metrics||{};
      const spent=Number(m.adSpent)||0;
      const q=(f&&f.sql!=null)?f.sql:(Number(m.sql)||0);
      return (q>0&&spent)?'USD '+(spent/q).toFixed(2):dash;
    }},
    // Compara contra la linea de conversion anterior: en un bloque semanal no existe.
    {label:'Dias pausada antes de este bloque',soloSiHay:l=>!l.live,get:l=>{const s=computeLineStats(c,l);return s.diasPausadaAntes?s.diasPausadaAntes+' dias':dash;}},
    {label:'Agendas totales',get:l=>{const f=F(l);return (f&&f.agendas!=null)?String(f.agendas):'<span style="color:var(--text3)" title="Configura los stages de agenda en Conversion de ventas > Reglas">-</span>';}},
    {label:'Costo por agenda',get:l=>{const f=F(l);const spent=Number((l.metrics||{}).adSpent)||0;return (f&&f.agendas>0&&spent)?'USD '+(spent/f.agendas).toFixed(2):dash;}},
    {label:'Llamadas en vivo',get:l=>{const f=F(l);if(f&&f.enVivo!=null)return String(f.enVivo);const s=computeLineStats(c,l);return String(s.llamadasEnVivo);}},
    {label:'Costo por llamada en vivo',get:l=>{
      const f=F(l);const spent=Number((l.metrics||{}).adSpent)||0;
      if(f&&f.enVivo!=null) return (f.enVivo>0&&spent)?'USD '+(spent/f.enVivo).toFixed(2):dash;
      const s=computeLineStats(c,l);
      return s.costoPorLlamada!==null?'USD '+s.costoPorLlamada.toFixed(2):dash;
    }},
    {label:'Llamadas calificadas en vivo',get:l=>{const f=F(l);if(f&&f.calif!=null)return String(f.calif);const s=computeLineStats(c,l);return String(s.llamadasCalificadas);}},
    {label:'Costo por llamada calificada en vivo',get:l=>{
      const f=F(l);const spent=Number((l.metrics||{}).adSpent)||0;
      if(f&&f.calif!=null) return (f.calif>0&&spent)?'USD '+(spent/f.calif).toFixed(2):dash;
      const s=computeLineStats(c,l);
      return s.costoPorLlamadaCalificada!==null?'USD '+s.costoPorLlamadaCalificada.toFixed(2):dash;
    }},
    // El registro de cambios de un bloque semanal vive abajo, en la bitacora.
    {label:'Cambio realizado',soloSiHay:l=>!!D(l).notes,get:l=>{
      const d=D(l);
      if(!d.notes) return dash;
      const full=esc(d.notes);
      const short=esc(d.notes.length>48?d.notes.slice(0,48)+'\u2026':d.notes);
      return _mrHered('<span style="white-space:nowrap;display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--text2);cursor:zoom-in;vertical-align:bottom" onmouseenter="showCambioZoom(this)" onmouseleave="hideCambioZoom()" data-full="'+full+'">'+short+'</span>',her(l));
    }}
  ];

  if(live){
    rows.push({label:'Ultima actualizacion',get:l=>l._lastRefresh?new Date(l._lastRefresh).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):dash});
  }
  // Una fila con soloSiHay se dibuja unicamente si esa linea puede darle un valor:
  // evita filas que en un bloque semanal siempre mostrarian un guion.
  if(opts.linea){
    return rows.filter(function(r){
      if(!r.soloSiHay) return true;
      try{ return !!r.soloSiHay(opts.linea); }catch(e){ return false; }
    });
  }
  return rows;
}

// Estados manuales/automaticos de un ticket (ademas de hecha/vencida)
// Escanea respuestas de Ashy via el Apps Script de tickets y marca estados sugeridos
function scanTicketReplies(){
  if(typeof TICKETS_PROXY==='undefined'||!TICKETS_PROXY){ if(typeof toast==='function') toast('Falta el script de tickets'); return; }
  if(typeof toast==='function') toast('Revisando respuestas de Ashy...');
  fetch(TICKETS_PROXY+'?secret=evolve-tracker&action=scan_replies')
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok){ if(typeof toast==='function') toast('No se pudo revisar ('+((d&&d.error)||'actualiza el addon del script')+')','red'); return; }
      const byTicket={};
      (d.replies||[]).forEach(function(rp){ if(rp.ticket&&rp.estado) byTicket[String(rp.ticket).replace(/[^0-9]/g,'')]={estado:rp.estado,at:rp.at}; });
      let n=0;
      DB.clients.forEach(function(c){
        (c.tasks||[]).forEach(function(t){
          if(!t.ticket||t.done) return;
          const num=String(t.ticket).replace(/[^0-9]/g,'');
          const hit=byTicket[num];
          if(hit&&hit.estado!==t.estado){
            t.estadoSugerido=hit.estado; t.estadoSugeridoAt=hit.at||new Date().toISOString(); n++;
          }
        });
      });
      save();
      if(S.view==='tickets') showTickets();
      if(typeof toast==='function') toast(n?n+' ticket'+(n>1?'s':'')+' con estado sugerido':'Sin respuestas nuevas de Ashy');
    })
    .catch(function(e){ if(typeof toast==='function') toast('Error de red revisando respuestas','red'); });
}

var _TK_ESTADOS={
  'proceso':{label:'En proceso',pill:'pill-blue'},
  'delegada':{label:'Delegada',pill:'pill-gray'},
  'revision':{label:'En revision',pill:'pill-amber'},
  'bloqueada':{label:'Bloqueada',pill:'pill-red'},
  'finalizada':{label:'Finalizada',pill:'pill-green'}
};
// Registra cuando una tarea entra por primera vez en "en proceso" (para medir tiempo de trabajo).
// Fin del dia de vencimiento en hora LOCAL (evita el bug de zona horaria con fechas "YYYY-MM-DD",
// que JS parsea como UTC y en zonas negativas corre el dia hacia atras).
function _dueEnd(due){
  if(!due) return null;
  var s=String(due);
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){ return new Date(+m[1], +m[2]-1, +m[3], 23,59,59,999); }
  var d=new Date(s); if(isNaN(d.getTime())) return null; d.setHours(23,59,59,999); return d;
}
function _tkMarcarProceso(t){ if(t && t.estado==='proceso' && !t.procesoAt) t.procesoAt=new Date().toISOString(); }
// Texto del tiempo en proceso de una tarea: en horas si es corto, en dias si es largo.
function _tkProcTexto(t){
  if(!t||!t.procesoAt) return '';
  var fin=(t.done&&t.doneAt)?new Date(t.doneAt):(t.estado==='proceso'?new Date():null);
  if(!fin) return '';
  var hrs=Math.max(0,(fin-new Date(t.procesoAt))/3600000);
  return hrs<48?(hrs.toFixed(1)+' hs'):((hrs/24).toFixed(1)+' d');
}
function applyTicketEstado(clientId,taskId){
  const c=DB.clients.find(function(x){return x.id===clientId;});
  const t=c&&(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t||!t.estadoSugerido) return;
  t.estado=t.estadoSugerido; _tkMarcarProceso(t);
  if(t.estado==='finalizada'){ t.done=true; t.doneAt=t.estadoSugeridoAt||new Date().toISOString(); }
  delete t.estadoSugerido; delete t.estadoSugeridoAt;
  save();
  if(S.view==='tickets') showTickets(); else if(typeof renderTab==='function') renderTab();
}
function dismissTicketEstado(clientId,taskId){
  const c=DB.clients.find(function(x){return x.id===clientId;});
  const t=c&&(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t) return;
  delete t.estadoSugerido; delete t.estadoSugeridoAt;
  save();
  if(S.view==='tickets') showTickets();
}
function cycleTicketEstado(clientId,taskId){
  const orden=['','proceso','revision','bloqueada','finalizada'];
  const c=DB.clients.find(function(x){return x.id===clientId;});
  const t=c&&(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t) return;
  const i=orden.indexOf(t.estado||'');
  setTicketEstado(clientId,taskId,orden[(i+1)%orden.length]);
}
function setTicketEstado(clientId,taskId,estado){
  const c=DB.clients.find(function(x){return x.id===clientId;});
  const t=c&&(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t) return;
  t.estado=estado||''; _tkMarcarProceso(t);
  if(estado==='finalizada'){ t.done=true; t.doneAt=new Date().toISOString(); }
  save();
  if(S.view==='tickets') showTickets(); else if(typeof renderTab==='function') renderTab();
}

    +'<textarea id="entrega-txt" placeholder="Ej: Hola Angie, te paso los videos de dblandit A y B https://we.tl/... y la landing https://..." style="width:100%;min-height:140px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12.5px;resize:vertical;font-family:inherit"></textarea>'
    +'<div id="entrega-err" style="font-size:11px;color:var(--redx);margin:8px 0 0;min-height:14px"></div>'
    +'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">'
    +'<button class="btn btn-sm" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-sm btn-primary" id="entrega-btn" onclick="procesarEntrega()">Detectar y registrar</button>'
    +'</div></div></div>';
  setTimeout(function(){var el=document.getElementById('entrega-txt');if(el)el.focus();},50);
}
async function procesarEntrega(){
  var txt=(document.getElementById('entrega-txt')||{}).value||'';
  var err=document.getElementById('entrega-err');
  var btn=document.getElementById('entrega-btn');
  if(!txt.trim()){ if(err) err.textContent='Pega el mensaje primero'; return; }
  var apiKey=localStorage.getItem('evold-anthropic-key');
  if(!apiKey){ if(err) err.textContent='Falta tu API key de Anthropic (link "? API key IA" en la ficha de un cliente)'; return; }
  var cand=[];
  DB.clients.forEach(function(c){
    (c.tasks||[]).forEach(function(t){
      if(t.done||t.deleted) return;
      cand.push({id:t.id, ticket:t.ticket||'', cliente:c.name, tarea:t.text||'', responsable:t.responsible||''});
    });
  });
  if(!cand.length){ if(err) err.textContent='No hay tareas abiertas para asociar'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Detectando...'; }
  if(err) err.textContent='';
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1200,messages:[{role:'user',content:
        'Este es un mensaje de WhatsApp donde una colaboradora (Ash) entrega material de trabajo:\n\n"""'+txt+'"""\n\n'
        +'Estas son las tareas abiertas del tablero (JSON):\n'+JSON.stringify(cand)+'\n\n'
        +'Identifica a que tarea(s) corresponde la entrega. Extrae los links/URLs del material (WeTransfer, Drive, landing, etc.) y asignalos a la tarea correcta. '
        +'Elegi estado: "revision" si entrega algo para revisar o aprobar (lo normal), o "finalizada" solo si dice explicitamente que quedo terminado/aprobado. '
        +'Devolve SOLO un JSON array, sin markdown, con esta forma exacta: '
        +'[{"id": <id de la tarea tal cual>, "estado": "revision" o "finalizada", "links": [{"url":"...","label":"texto corto"}], "nota":"resumen breve en castellano"}]. '
        +'Si no hay match claro con ninguna tarea, devolve [].'}]})
    });
    var d=await r.json();
    if(d.error){ if(err) err.textContent='Error IA: '+(d.error.message||'revisa la API key'); if(btn){btn.disabled=false;btn.textContent='Detectar y registrar';} return; }
    var out=(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var ini=out.indexOf('['), fin=out.lastIndexOf(']');
    var arr=(ini>=0&&fin>ini)?JSON.parse(out.slice(ini,fin+1)):[];
    if(!arr.length){ if(err) err.textContent='No pude asociarlo a ninguna tarea. Revisa que el nombre del cliente o la tarea aparezca en el mensaje.'; if(btn){btn.disabled=false;btn.textContent='Detectar y registrar';} return; }
    var aplicadas=0;
    arr.forEach(function(m){
      var found=null;
      DB.clients.forEach(function(c){ (c.tasks||[]).forEach(function(t){ if(String(t.id)===String(m.id)){ found=t; } }); });
      if(!found) return;
      found.estado=(m.estado==='finalizada')?'finalizada':'revision';
      if(found.estado==='finalizada'){ found.done=true; found.doneAt=new Date().toISOString(); }
      found.attachments=found.attachments||[];
      (m.links||[]).forEach(function(l){
        var url=(l&&l.url)?l.url:String(l||'');
        if(url && !found.attachments.some(function(a){return a.url===url;})) found.attachments.push({url:url,label:(l&&l.label)?l.label:url});
      });
      if(m.nota) found.entregaNota=m.nota;
      found.entregaAt=new Date().toISOString();
      aplicadas++;
    });
    save();
    closeModal();
    if(S.view==='tickets') showTickets(); else if(typeof renderTab==='function') renderTab();
    toast(aplicadas?(aplicadas+' tarea'+(aplicadas>1?'s':'')+' a revision con material'):'Sin cambios');
  }catch(e){ if(err) err.textContent='Error de red o respuesta invalida de la IA'; if(btn){btn.disabled=false;btn.textContent='Detectar y registrar';} }
}

function _ticketRows(){
  const rows=[];
  const now=new Date();
  DB.clients.forEach(function(c){
    (c.tasks||[]).forEach(function(t){
      // Las eliminadas no se muestran en la lista, pero siguen contando (ver registro abajo)
      if(t.deleted) return;
      // Las tareas del cliente solo aparecen en TU tablero cuando se demoraron.
      // Mientras el follow-up no vencio, viven solo en la pestana Tareas del cliente.
      if(t.ownerCliente && !t.done){
        const venc=t.followUpDue && new Date(t.followUpDue)<now;
        if(!venc) return; // todavia no toca seguir: no ensucia el tablero
      }
      rows.push({t:t,c:c});
    });
  });
  return rows;
}
function _tkOrigen(t){
  return (!t.source||t.source==='Manual')?'Manual':'Llamada';
}
function _tkDias(a,b){ return Math.max(0,Math.round((b-a)/86400000)); }
function ticketDragStart(i){ window._tkDrag=i; }
function ticketDragOver(ev){ ev.preventDefault(); }
function ticketDrop(ev,i){
  ev.preventDefault();
  const from=window._tkDrag;
  window._tkDrag=null;
  const arr=window._tkList||[];
  if(from==null||from===i||!arr[from]||!arr[i]) return;
  if(arr[from].done||arr[i].done) return; // las hechas no se reordenan
  const moved=arr.splice(from,1)[0];
  arr.splice(i,0,moved);
  // persistir: prio = posicion nueva entre las no-hechas visibles
  let p=1;
  arr.forEach(function(k){
    if(k.done) return;

// ---- Lista de prioridades por WhatsApp ----
// El orden respeta la prioridad manual del tablero (drag & drop), asi lo que
// ve Ashy es exactamente lo que vos ordenaste. Si no, el mensaje contradice
// al tablero y deja de ser confiable.
function _tkOrdenados(resp){
  const now=new Date();
  const endOfDue=function(t){ return _dueEnd(t.due); };
  const out=[];
  DB.clients.forEach(function(c){
    (c.tasks||[]).forEach(function(t){
      if(!t.delegated||t.done) return;
      if(resp&&_n(t.responsible||'Ashy')!==_n(resp)) return;
      out.push({t:t,c:c,venc:endOfDue(t)&&endOfDue(t)<now});
    });
  });
  out.sort(function(a,b){
    const pa=(a.t.prio!=null)?a.t.prio:1e9, pb=(b.t.prio!=null)?b.t.prio:1e9;
    if(pa!==pb) return pa-pb;
    if(a.venc!==b.venc) return a.venc?-1:1;
    return String(a.t.delegatedAt||'').localeCompare(String(b.t.delegatedAt||''));
  });
  return out;
}
function _tkKey(r){ return r.c.id+':'+r.t.id; }
function _tkLinea(r,now){
  const t=r.t;
  let extra='';
  if(r.venc){
    const d=new Date(t.due); d.setHours(23,59,59,999);
    extra=' (VENCIDA hace '+_tkDias(d,now)+' d)';
  } else if(t.due){
    const dd=new Date(t.due); dd.setHours(23,59,59,999);
    const dias=_tkDias(now,dd);
    extra=dias===0?' (vence hoy)':' (vence en '+dias+' d)';
  }
  return (t.ticket||'#?')+' - '+r.c.name+' - '+t.text+extra;
}

function _tkTextoLista(resp){
  const now=new Date();
  const arr=_tkOrdenados(resp).filter(function(r){ return window._elSel[_tkKey(r)]; });
  if(!arr.length) return '';
  const lineas=arr.map(function(r,i){ return (i+1)+'. '+_tkLinea(r,now); });
  return 'Hola! Estas son las prioridades, en orden:\n\n'+lineas.join('\n')+'\n\nCualquier duda me avisas.';
}

// Aplica un set de ENTREGAS: si matchea un ticket lo pasa a revision + adjunta el material;
// si no matchea, crea un ticket "Revisar: ..." para el cliente detectado. Devuelve los conteos.
function _convAplicarEntregas(entregas){
  var aplicadas=0, creadas=0;
  var _adjuntar=function(t,links){
    t.attachments=t.attachments||[];
    (links||[]).forEach(function(l){
      var url=(l&&l.url)?l.url:String(l||'');
      if(url && !t.attachments.some(function(a){return a.url===url;})) t.attachments.push({url:url,label:(l&&l.label)?l.label:url});
    });
  };
  (entregas||[]).forEach(function(e){
    if(!e) return;
    if(!(e.ticket||(e.links&&e.links.length)||e.descripcion)) return;
    var num=String(e.ticket||'').replace(/[^0-9]/g,'');
    var found=null;
    if(num){ DB.clients.forEach(function(c){ (c.tasks||[]).forEach(function(t){ if(!t.done&&!t.deleted&&String(t.ticket||'').replace(/[^0-9]/g,'')===num) found=t; }); }); }
    if(found){
      found.estado=(e.estado==='finalizada')?'finalizada':'revision';
      if(found.estado==='finalizada'){ found.done=true; found.doneAt=new Date().toISOString(); }
      _adjuntar(found,e.links); found.entregaAt=new Date().toISOString(); aplicadas++;
    } else {
      var cli=e.cliente?DB.clients.find(function(c){return _n(c.name)===_n(e.cliente)||_n(c.name).indexOf(_n(e.cliente))>=0||_n(e.cliente).indexOf(_n(c.name))>=0;}):null;
      if(!cli) cli=DB.clients[0];
      if(!cli) return;
      cli.tasks=cli.tasks||[];
      var nt={ id:Date.now()+Math.floor(Math.random()*1000), text:'Revisar: '+(e.descripcion||'material entregado'),
        responsible:'', done:false, source:'Conversacion', delegated:true, delegatedAt:new Date().toISOString(),
        estado:(e.estado==='finalizada')?'finalizada':'revision', ticket:'#'+nextTicketFromApp(), entregaAt:new Date().toISOString() };
      if(nt.estado==='finalizada'){ nt.done=true; nt.doneAt=new Date().toISOString(); }
      _adjuntar(nt,e.links); cli.tasks.unshift(nt); creadas++;
    }
  });
  if(aplicadas||creadas){ save(); if(S.view==='tickets') showTickets(); }
  return {aplicadas:aplicadas, creadas:creadas};
}

function convCrearTicket(i){
  const k=(window._convCand.tareas||[])[i]; if(!k) return;
  const cid=+((document.getElementById('cvc-cli-'+i)||{}).value||0);
  const resp=((document.getElementById('cvc-resp-'+i)||{}).value||'Ashy').trim()||'Ashy';
  const c=DB.clients.find(function(x){return x.id===cid;});
  if(!c){ toast('Elegi un cliente','red'); return; }
  c.tasks=c.tasks||[];
  // Es una tarea DEL CLIENTE si el responsable no es del equipo interno.
  // Equipo interno = solo Angie (vos) y Ashy. El resto (Fernando, Mona, etc.)
  // es gente del lado del cliente. El recap trae nombre completo, asi que
  // matcheamos por el primer nombre.
  const equipo=['angie','ashy'];
  const primerNombre=_n(resp).split(/\s+/)[0];
  const esInterno=equipo.indexOf(primerNombre)>=0;
  const esDelCliente=k.origen==='Llamada' && resp && !esInterno;
  if(esDelCliente){
    // Follow-up automatico: 5 dias habiles desde la llamada
    const base=new Date();
    let d=new Date(base), habiles=0;
    while(habiles<5){ d.setDate(d.getDate()+1); const dw=d.getDay(); if(dw>=1&&dw<=5) habiles++; }
    c.tasks.unshift({
      id:Date.now(), text:k.texto, responsible:resp, done:false,
      source:'Llamada', ownerCliente:true, followUpDue:d.toISOString(),
      delegated:false, delegatedAt:new Date().toISOString(),
      ticket:'#'+nextTicketFromApp()
    });
    toast('Tarea de '+resp+' cargada en '+c.name+' (seguimiento en 5 dias habiles)');
  } else {
    c.tasks.unshift({
      id:Date.now(), text:k.texto, responsible:resp, due:'', done:false,
      source:k.origen||'WhatsApp', delegated:true, delegatedAt:new Date().toISOString(),
      ticket:'#'+nextTicketFromApp()
    });
    toast('Ticket creado en '+c.name);
  }
  save();
  window._convCand.tareas.splice(i,1);
  convRenderCandidatos();
}
function convAplicarEstado(i){

function convCerrarTicket(i){
  const k=(window._convCand.cierres||[])[i]; if(!k) return;
  const num=String(k.ticket||'').replace(/[^0-9]/g,'');

// ---- Action items de las llamadas (Fathom via Gmail) ----
// Trae los recaps de Fathom del mail y los convierte en candidatos a ticket,
// la misma cola de revision que usan los mensajes de WhatsApp. No auto-crea:
// Fathom a veces lista como "action item" cosas que no son tarea (contexto,
// decisiones), asi que vos confirmas cual entra.
// ---- Sincronizacion automatica de LLAMADAS (no solo tareas) ----
// Usa los mismos recaps de Fathom que ya llegan a Gmail, pero en vez de sacar
// solo action items, arma la llamada completa (titulo, fecha, resumen, riesgos),
// la asigna al cliente por las palabras clave del mapeo y llena fathomCalls + hitos.
// 100% automatico: sin pegar JSON, sin boton por cliente.
function _fathomMatchClient(meeting){
  var mn=_n(meeting);
  if(!mn) return null;
  var byKw=DB.clients.find(function(c){
    return (c.fathomKeywords||[]).some(function(k){ return k && mn.indexOf(_n(k))>=0; });
  });
  if(byKw) return byKw;
  return DB.clients.find(function(c){ return _n(c.name) && mn.indexOf(_n(c.name))>=0; })||null;
}
function _fathomUpsertMilestone(c, cl){
  if(!c.milestones) c.milestones=[];
  var body=(cl.summary||'')+(cl.actionItems&&cl.actionItems.length?'\n\nAction items: '+cl.actionItems.join(', '):'')+(cl.riskFlags&&cl.riskFlags.length?'\n\nRiesgos: '+cl.riskFlags.join(', '):'');
  var tipo=cl.sentiment==='satisfecho'?'hito':'alerta';
  var tags=[cl.sentiment==='satisfecho'?'Llamada':'Llamada - atencion',cl.duration].filter(Boolean);
  var ex=c.milestones.find(function(m){return m.fathomId===cl.id;});
  if(ex){ ex.type=tipo; ex.title=cl.title; ex.date=cl.date; ex.body=body; ex.tags=tags; }
  else { c.milestones.push({type:tipo,title:cl.title,date:cl.date,body:body,tags:tags,fathomId:cl.id}); }
}
function _fathomSortMilestones(c){
  if(!c.milestones) return;
  c.milestones.sort(function(a,b){return String(b.date||'').split('/').reverse().join('').localeCompare(String(a.date||'').split('/').reverse().join(''));});
}
// Heuristica: la llamada parece estar en ingles (para no gastar API en las que ya estan en castellano)
function _fathomPareceIngles(cl){
  var s=(cl.title||'')+' '+(cl.summary||'')+' '+((cl.actionItems||[]).join(' '))+' '+((cl.riskFlags||[]).join(' '));
  return /[a-z]/i.test(s) && !/[áéíóúñ¿¡]/i.test(s) && /\b(the|to|and|for|with|send|book|edit|call|meeting|review|schedule|next|week|new|ready|feedback|shoot|coordinate|refresh)\b/i.test(s);
}
// Traduce al castellano titulo, resumen, action items y riesgos de un set de llamadas, en una sola llamada a la API.
async function _fathomTraducirLlamadas(calls){
  var apiKey=localStorage.getItem('evold-anthropic-key');
  if(!apiKey || !calls || !calls.length) return false;
  var payload=calls.map(function(cl,i){ return {i:i, title:cl.title||'', summary:cl.summary||'', actionItems:cl.actionItems||[], riskFlags:cl.riskFlags||[]}; });
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:2500,messages:[{role:'user',content:
        'Traduci al castellano rioplatense TODOS los textos de estas llamadas de trabajo (title, summary, actionItems y riskFlags). '
        +'Manten nombres propios, nombres de clientes, siglas y numeros tal cual. Los action items van cortos y en imperativo. '
        +'Devolve SOLO un JSON array con la MISMA estructura y los mismos indices "i", sin markdown ni explicaciones:\n\n'+JSON.stringify(payload)}]})
    });
    var d=await r.json();
    if(d.error) return false;
    var txt=(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var ini=txt.indexOf('['), fin=txt.lastIndexOf(']');
    if(ini<0||fin<=ini) return false;
    var arr=JSON.parse(txt.slice(ini,fin+1));
    arr.forEach(function(tr){
      var cl=calls[tr.i]; if(!cl) return;
      if(tr.title) cl.title=tr.title;
      if(tr.summary) cl.summary=tr.summary;
      if(Array.isArray(tr.actionItems)) cl.actionItems=tr.actionItems;
      if(Array.isArray(tr.riskFlags)) cl.riskFlags=tr.riskFlags;
    });
    return true;
  }catch(e){ return false; }
}
async function syncFathomFromGmail(silent){
  var url=fathomProxyUrl();
  if(!url){ if(!silent) toast('Configura el script de Fathom','red'); return {added:0}; }
  if(!silent) toast('Sincronizando llamadas de Fathom...');
  var d;
  try{
    var r=await fetch(url+(url.indexOf('?')>=0?'&':'?')+'secret=evolve-tracker&action=fathom_recaps&days=60');
    d=await r.json();
  }catch(e){ if(!silent) toast('Error de red leyendo el mail','red'); return {added:0}; }
  if(!d||!d.ok){ if(!silent) toast('No se pudo leer el mail ('+((d&&d.error)||'revisa el script')+')','red'); return {added:0}; }
  var recaps=d.recaps||[];
  var added=0, nuevas=[], clientesTocados={};
  recaps.forEach(function(rc){
    var c=_fathomMatchClient(rc.meeting||rc.title||'');
    if(!c) return;
    var id=rc.id||('fathom-'+_n(rc.meeting||rc.title||'')+'-'+String(rc.date||'').replace(/\D/g,''));
    c.fathomCalls=c.fathomCalls||[];
    if(c.fathomCalls.some(function(x){return x.id===id;})) return;
    var items=(rc.actionItems||[]).map(function(it){return (it&&it.texto)?it.texto:String(it||'');}).filter(Boolean);
    var risks=rc.riskFlags||rc.riesgos||[];
    var sentiment=rc.sentiment||(risks.length?'atencion':'satisfecho');
    var call={ id:id, title:rc.meeting||rc.title||'Llamada', date:rc.date||new Date().toLocaleDateString('es-AR'),
      duration:rc.duration||'', sentiment:sentiment, summary:rc.summary||rc.body||rc.recap||'',
      actionItems:items, riskFlags:risks, initials:rc.initials||'', _cid:c.id };
    c.fathomCalls.unshift(call);
    nuevas.push(call); clientesTocados[c.id]=true; added++;
  });

  // Ademas de las nuevas, recuperar las ya guardadas que quedaron en ingles (p. ej. importadas antes de la traduccion)
  var viejasIngles=[];
  DB.clients.forEach(function(c){
    (c.fathomCalls||[]).forEach(function(cl){
      if(nuevas.indexOf(cl)<0 && _fathomPareceIngles(cl)){ cl._cid=c.id; viejasIngles.push(cl); clientesTocados[c.id]=true; }
    });
  });

  var paraTraducir=nuevas.concat(viejasIngles);
  var hayApiKey=!!localStorage.getItem('evold-anthropic-key');
  if(paraTraducir.length && hayApiKey){
    if(!silent) toast('Traduciendo '+paraTraducir.length+' llamada'+(paraTraducir.length>1?'s':'')+' al castellano...');
    await _fathomTraducirLlamadas(paraTraducir);
  }

  // (Re)construir los hitos con el texto ya traducido
  Object.keys(clientesTocados).forEach(function(cid){
    var c=DB.clients.find(function(x){return String(x.id)===String(cid);});
    if(!c) return;
    (c.fathomCalls||[]).forEach(function(cl){ if(cl._cid===c.id) _fathomUpsertMilestone(c,cl); });
    _fathomSortMilestones(c);
  });

  localStorage.setItem('evold-fathom-sync-at',String(Date.now()));
  save();
  if(S.view==='client') renderClient(); else if(S.view==='overview') showOverview();
  if(!silent){
    var nClients=Object.keys(clientesTocados).length;
    if(added) toast(added+' llamada'+(added>1?'s':'')+' nueva'+(added>1?'s':'')+(paraTraducir.length&&!hayApiKey?' (configura tu API key para traducir)':''));
    else if(viejasIngles.length && hayApiKey) toast(viejasIngles.length+' llamada'+(viejasIngles.length>1?'s':'')+' traducida'+(viejasIngles.length>1?'s':''));
    else if(viejasIngles.length && !hayApiKey) toast('Configura tu API key de Anthropic para traducir','red');
    else toast('Sin llamadas nuevas');
  }
  return {added:added, clients:Object.keys(clientesTocados).length};
}

  if(!fathomProxyUrl()) return;

  syncFathomFromGmail(true);

async function traducirCandidatos(){
  var apiKey=localStorage.getItem('evold-anthropic-key');

  if(!apiKey||!tareas.length) return;
  // Solo traducir las que estan en ingles (evita gastar en las que ya vienen en espanol)
  var enIngles=tareas.filter(function(t){ return /[a-z]/i.test(t.texto) && !/[áéíóúñ¿¡]/i.test(t.texto) && /\b(the|to|then|and|in|as|for|call|send|add|paste|schedule|record)\b/i.test(t.texto); });
  if(!enIngles.length) return;
  try{
    var lista=tareas.map(function(t,i){ return i+'. '+t.texto; }).join('\n');
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1500,messages:[{role:'user',content:
        'Traduci al castellano rioplatense estas tareas de trabajo, cortas y en imperativo. '
        +'Manten nombres propios, siglas (CRM, AD2, R1) y numeros tal cual. Devolve SOLO un JSON '
        +'{"0":"...","1":"..."} con el mismo indice de cada una, sin markdown:\n\n'+lista}]})
    });
    var d=await r.json();
    if(d.error) return;
    var txt=(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var ini=txt.indexOf('{'), fin=txt.lastIndexOf('}');
    if(ini<0||fin<=ini) return;
    var map=JSON.parse(txt.slice(ini,fin+1));
    tareas.forEach(function(t,i){ if(map[i]) t.texto=map[i]; });
    convRenderCandidatos();
    toast('Tareas traducidas al castellano');
  }catch(e){ /* si falla, quedan en ingles: no es critico */ }
}

function _tkUltimaAct(tickets){
  var ult=0;
  (tickets||[]).forEach(function(r){
    ['delegatedAt','doneAt','deletedAt'].forEach(function(k){
      if(r.t[k]){ var ms=new Date(r.t[k]).getTime(); if(ms>ult) ult=ms; }
    });
  });
  if(!ult) return '';
  var diff=Date.now()-ult;
  var min=Math.floor(diff/60000);
  if(min<1) return 'actualizado recien';
  if(min<60) return 'actualizado hace '+min+' min';
  var hs=Math.floor(min/60);
  if(hs<24) return 'actualizado hace '+hs+' h';
  var d=new Date(ult);
  return 'actualizado '+d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}
// Menu de acciones del tablero (los 7 botones, ahora escondidos).
// Campanita: chequea (sin IA) cuantas conversaciones tuyas hay nuevas desde el
// ultimo escaneo. Un solo llamado a GHL. Corre al entrar a Tickets.
async function convChequearNuevas(){
  const bell=document.getElementById('tk-bell');
  if(!bell) return;
  const url=localStorage.getItem('evold-conv-url')||'';
  const sec=localStorage.getItem('evold-conv-secret')||'evolve-tracker';
  const tok=localStorage.getItem('evold-conv-token')||'';
  const loc=localStorage.getItem('evold-conv-loc')||'';
  const user=(localStorage.getItem('evold-conv-mi-numero')||'').trim();
  // Sin config no molesta: la campanita queda apagada
  if(!url||!tok||!loc||!user) return;
  const since=localStorage.getItem('evold-conv-lastscan')||'0';
  try{
    const u=url+(url.indexOf('?')>=0?'&':'?')
      +'secret='+encodeURIComponent(sec)+'&token='+encodeURIComponent(tok)
      +'&location='+encodeURIComponent(loc)+'&action=conv_count'
      +'&user='+encodeURIComponent(user)+'&since='+encodeURIComponent(since);
    const r=await fetch(u); const d=await r.json();
    if(!d.ok) return;
    convPintarBell(d.nuevas||0);
  }catch(e){ /* silencioso: la campanita no debe romper el tablero */ }
}
function convPintarBell(n){
  const bell=document.getElementById('tk-bell');
  if(!bell) return;
  window._convNuevas=n;
  // Sacar badge viejo
  const old=bell.querySelector('.tk-bell-badge'); if(old) old.remove();
  if(n>0){
    bell.style.color='var(--accent)';
    const b=document.createElement('span');
    b.className='tk-bell-badge';
    b.style.cssText='position:absolute;top:0;right:0;min-width:15px;height:15px;padding:0 3px;border-radius:20px;background:var(--redx);color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1';
    b.textContent=n>9?'9+':String(n);
    bell.appendChild(b);
    bell.title=n+' conversacion'+(n>1?'es':'')+' nueva'+(n>1?'s':'')+' sin escanear';
  } else {
    bell.style.color='var(--text3)';
    bell.title='Sin conversaciones nuevas';
  }
}

function ticketGuardarEdicion(){
  var d=window._ted; if(!d) return;
  var c=DB.clients.find(function(x){return x.id===d.cid;});
  var t=c&&c.tasks.find(function(x){return x.id===d.tid;}); if(!t){ closeModal(); return; }
  var text=(document.getElementById('ted-text')||{}).value||'';
  var resp=(document.getElementById('ted-resp')||{}).value||'';
  var estado=(document.getElementById('ted-estado')||{}).value||'';
  var nuevoCid=parseInt((document.getElementById('ted-cliente')||{}).value||d.cid,10);
  if(text.trim()) t.text=text.trim();
  t.responsible=resp.trim()||t.responsible;
  t.estado=estado; _tkMarcarProceso(t);
  if(estado==='finalizada'){ if(!t.done){ t.done=true; t.doneAt=new Date().toISOString(); } }
  else if(t.done && estado){ t.done=false; delete t.doneAt; }
  t.attachments=(d.attachments||[]).slice();
  // Mover de cliente si cambio
  if(nuevoCid && nuevoCid!==d.cid){
    var nc=DB.clients.find(function(x){return x.id===nuevoCid;});
    if(nc){
      c.tasks=c.tasks.filter(function(x){return x.id!==t.id;});
      nc.tasks=nc.tasks||[]; nc.tasks.unshift(t);
    }
  }
  save(); closeModal(); showTickets();
  toast('Tarea actualizada');
}

function applyTicketsCustomRange(){

// ================= ACTIVIDAD: feed global de movimientos de clientes =================
// Junta en una sola linea de tiempo lo que ya vive disperso en la app:
//   - novedades de GHL (c.ghl._changes): leads nuevos, agendas, cambios de stage, ganados/perdidos
//   - llamadas grabadas (c.fathomCalls)
//   - tareas delegadas y finalizadas (c.tasks)
// Los dos ultimos NO se guardan como eventos: se derivan de los datos que ya estan,
// asi no hay estado duplicado que se pueda desincronizar.

var ACT_TIPOS=[
  {k:'lead',   l:'Leads',    icon:'+',      color:'var(--strong)'},
  {k:'agenda', l:'Agendas',  icon:'\u25CB', color:'var(--bluex,#378add)'},
  {k:'venta',  l:'Ventas',   icon:'$',      color:'var(--accent)'},
  {k:'llamada',l:'Llamadas', icon:'\u25B6', color:'var(--amberx)'},
  {k:'stage',  l:'Stages',   icon:'\u2192', color:'var(--text3)'},
  {k:'tarea',  l:'Tareas',   icon:'\u2713', color:'var(--text2)'}
];
function _actColor(k){ var t=ACT_TIPOS.find(function(x){return x.k===k;}); return t?t.color:'var(--text3)'; }
function _actIcon(k){ var t=ACT_TIPOS.find(function(x){return x.k===k;}); return t?t.icon:'\u00B7'; }

// Acepta ISO, timestamp o el formato dd/mm/aaaa que usan las llamadas de Fathom.
function _actTs(v){
  if(!v) return null;
  var s=String(v);
  var d;
  if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(s) && typeof parseDDMMYYYY==='function') d=parseDDMMYYYY(s);
  else d=new Date(v);
  return (d && !isNaN(d.getTime())) ? d : null;
}

function buildActivityFeed(opts){
  opts=opts||{};
  var kinds=opts.kinds&&opts.kinds.length?opts.kinds:null;
  var desde=opts.desde?new Date(opts.desde):null;
  var items=[];
  var push=function(c,kind,ts,text,extra){
    if(!ts) return;
    if(desde && ts<desde) return;
    if(kinds && kinds.indexOf(kind)<0) return;
    items.push({ts:ts.getTime(), kind:kind, clientId:c.id, cliente:c.name||'Cliente', text:text, extra:extra||''});
  };

  (DB.clients||[]).forEach(function(c){
    if(c.archived) return;

    ((c.ghl&&c.ghl._changes)||[]).forEach(function(ch){
      var ts=_actTs(ch.at||ch.ts);
      var kind=ch.kind==='nuevo'?'lead'
             :ch.kind==='agenda'?'agenda'
             :(ch.kind==='ganado'||ch.kind==='perdido')?'venta'
             :'stage';
      push(c,kind,ts,ch.text);
    });

    (c.fathomCalls||[]).forEach(function(cl){
      var ts=_actTs(cl.date);
      var det=[];
      if(cl.duration) det.push(cl.duration);
      if((cl.actionItems||[]).length) det.push((cl.actionItems||[]).length+' pendientes');
      if((cl.riskFlags||[]).length) det.push((cl.riskFlags||[]).length+' riesgos');
      push(c,'llamada',ts,'Grabacion cargada: '+(cl.title||'Llamada'),det.join(' \u00b7 '));
    });

    (c.tasks||[]).forEach(function(t){
      if(t.deleted) return;
      if(t.done&&t.doneAt) push(c,'tarea',_actTs(t.doneAt),'Tarea finalizada: '+(t.text||'sin titulo'),t.ticket?String(t.ticket):'');
      else if(t.delegated&&t.delegatedAt) push(c,'tarea',_actTs(t.delegatedAt),'Tarea delegada: '+(t.text||'sin titulo'),t.ticket?String(t.ticket):'');
    });
  });

  items.sort(function(a,b){return b.ts-a.ts;});
  return items.slice(0, opts.limit||300);
}

function actUnseenCount(){
  var seen=+(localStorage.getItem('evold-act-seen')||0);
  if(!seen) return 0;
  return buildActivityFeed({limit:300}).filter(function(i){return i.ts>seen;}).length;
}

function toggleActFiltro(k){
  S.actFiltros=S.actFiltros||[];
  var i=S.actFiltros.indexOf(k);
  if(i>=0) S.actFiltros.splice(i,1); else S.actFiltros.push(k);
  showTickets();
}
function limpiarActFiltros(){ S.actFiltros=[]; showTickets(); }

function _actividadHtml(){
  var filtros=S.actFiltros||[];
  var items=buildActivityFeed({kinds:filtros, limit:300});
  if(S._actSeenSession===undefined||S._actSeenSession===null){
    S._actSeenSession=+(localStorage.getItem('evold-act-seen')||0);

  }

  var chips='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">'
    +'<button class="btn btn-sm" onclick="limpiarActFiltros()" style="'+(filtros.length?'color:var(--text3)':'border-color:var(--accent);color:var(--accent)')+'">Todo</button>'
    +ACT_TIPOS.map(function(t){
        var on=filtros.indexOf(t.k)>=0;
        return '<button class="btn btn-sm" onclick="toggleActFiltro(\''+t.k+'\')" style="'+(on?'border-color:'+t.color+';color:'+t.color:'color:var(--text3)')+'">'+t.l+'</button>';
      }).join('')
    +'<span style="margin-left:auto;font-size:11px;color:var(--text3)">'+items.length+' movimiento'+(items.length===1?'':'s')+' \u00b7 '+_actPollEstado()+'</span>'
    +'</div>';

  if(!items.length){
    return chips+'<div style="padding:40px 0;text-align:center;font-size:12.5px;color:var(--text3);line-height:1.7">'
      +'Todavia no hay movimientos registrados.<br>'
      +'Las novedades de GHL se detectan comparando cada sincronizacion con la anterior,<br>asi que vas a ver la primera tanda despues del segundo sync.</div>';
  }

  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var ayer=new Date(hoy); ayer.setDate(ayer.getDate()-1);
  var grupoDe=function(ts){
    var d=new Date(ts); d.setHours(0,0,0,0);
    if(d.getTime()===hoy.getTime()) return 'Hoy';
    if(d.getTime()===ayer.getTime()) return 'Ayer';
    return new Date(ts).toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
  };

  var out='', grupo=null;
  items.forEach(function(i){
    var g=grupoDe(i.ts);
    if(g!==grupo){
      grupo=g;
      out+='<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:20px 0 8px">'+esc(g)+'</div>';
    }
    var nuevo=seen&&i.ts>seen;
    var col=_actColor(i.kind);
    out+='<div onclick="selectClient('+i.clientId+')" style="display:flex;align-items:baseline;gap:11px;padding:9px 10px;margin:0 -10px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px">'
      +'<span class="mono" style="font-size:11px;width:13px;text-align:center;flex-shrink:0;color:'+col+'">'+_actIcon(i.kind)+'</span>'
      +'<span style="flex-shrink:0;font-size:12.5px;font-weight:500;color:var(--text2);min-width:96px">'+esc(i.cliente)+'</span>'
      +'<span style="flex:1;font-size:12.5px;color:var(--text);min-width:0">'+esc(i.text)
        +(i.extra?' <span style="color:var(--text3)">\u00b7 '+esc(i.extra)+'</span>':'')
        +(nuevo?' <span class="pill pill-green" style="font-size:9px;padding:1px 6px;margin-left:4px">nuevo</span>':'')
      +'</span>'
      +'<span class="mono" style="font-size:10.5px;color:var(--text3);white-space:nowrap;flex-shrink:0">'
        +new Date(i.ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'</span>'
      +'</div>';
  });

  return chips+out;
}

// ================= REFRESCO ROTATIVO =================
// La app es estatica: no hay backend que sincronice sola. Para no quemar la cuota del
// Apps Script con 14 clientes a la vez, se sincroniza UNO cada 45 s, rotando. Una vuelta
// completa toma ~10 min y el pico de red nunca supera un pedido.
// Solo corre con la torre abierta y la pestana visible.
var _ACT_POLL={timer:null, idx:0, lastAt:0, lastClient:''};

function _actPollEstado(){
  if(!_ACT_POLL.lastAt) return 'sin refrescar todavia';
  var min=Math.floor((Date.now()-_ACT_POLL.lastAt)/60000);
  var quien=_ACT_POLL.lastClient?' ('+_ACT_POLL.lastClient+')':'';
  return min<1?('ultimo refresco: recien'+quien):('ultimo refresco: hace '+min+' min'+quien);
}

function _actPollables(){
  return (DB.clients||[]).filter(function(c){
    return !c.archived && c.ghl && c.ghl.token && c.ghl.locationId && !c.ghl._syncing;
  });
}

async function actPollTick(){
  if(S.view!=='tickets') return;
  if(document.visibilityState==='hidden') return;
  var px=(typeof getGhlProxy==='function')?getGhlProxy():null;
  if(!px||!px.url||!px.secret) return;
  var lista=_actPollables();
  if(!lista.length) return;
  if(_ACT_POLL.idx>=lista.length) _ACT_POLL.idx=0;
  var c=lista[_ACT_POLL.idx];
  _ACT_POLL.idx=(_ACT_POLL.idx+1)%lista.length;
  try{
    await syncGhl(c.id, true, true);
    _ACT_POLL.lastAt=Date.now();
    _ACT_POLL.lastClient=c.name||'';
    if(S.view==='tickets' && (S.tkTab||'tareas')==='actividad') showTickets();
  }catch(e){}
}

function startActPoll(){
  if(_ACT_POLL.timer) return;
  _ACT_POLL.timer=setInterval(actPollTick, 45000);
  setTimeout(actPollTick, 2000);
}
function stopActPoll(){
  if(_ACT_POLL.timer){ clearInterval(_ACT_POLL.timer); _ACT_POLL.timer=null; }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && S.view==='tickets') startActPoll(); else stopActPoll();
});

function showTickets(){
  if(S.tkTab==='clientes') S.tkTab='tareas';
  S.view='tickets'; S.clientId=null; renderSidebar();
  if(typeof startActPoll==='function') startActPoll();
  const _since=+(localStorage.getItem('evold-tickets-since')||0);
  const all=_ticketRows();
  const tickets=all.filter(function(r){
    if(!r.t.delegated) return false;
    if(!_since) return true;
    return r.t.delegatedAt && new Date(r.t.delegatedAt).getTime()>=_since;
  });
  const sinDelegar=all.filter(function(r){return !r.t.delegated&&!r.t.done;}).length;
  const now=new Date();
  const endOfDue=function(t){ return _dueEnd(t.due); };

  const abiertos=tickets.filter(function(r){return !r.t.done;});
  const vencidos=abiertos.filter(function(r){const d=endOfDue(r.t);return d&&d<now;});
  const hechos=tickets.filter(function(r){return r.t.done;});
  const hechos30=hechos.filter(function(r){return r.t.doneAt&&(now-new Date(r.t.doneAt))<30*86400000;});
  const conTiempos=hechos.filter(function(r){return r.t.doneAt&&r.t.delegatedAt;});
  const avgDias=conTiempos.length?(conTiempos.reduce(function(s,r){return s+_tkDias(new Date(r.t.delegatedAt),new Date(r.t.doneAt));},0)/conTiempos.length):null;
  // Backfill: tareas que ya estan "en proceso" pero sin marca de inicio -> arrancan a contar desde ahora.
  var _bfProc=false;
  DB.clients.forEach(function(c){ (c.tasks||[]).forEach(function(t){
    if(!t.deleted && t.estado==='proceso' && !t.done && !t.procesoAt){ t.procesoAt=new Date().toISOString(); _bfProc=true; }
  }); });
  if(_bfProc) save();
  const conProceso=hechos.filter(function(r){return r.t.doneAt&&r.t.procesoAt;});
  var _procDias=[];
  DB.clients.forEach(function(c){ (c.tasks||[]).forEach(function(t){
    if(t.deleted||!t.procesoAt) return;
    var fin=(t.done&&t.doneAt)?new Date(t.doneAt):(t.estado==='proceso'?now:null);
    if(!fin) return;
    _procDias.push(Math.max(0,(fin-new Date(t.procesoAt))/86400000));
  }); });
  const avgProceso=_procDias.length?(_procDias.reduce(function(a,b){return a+b;},0)/_procDias.length):null;
  const conDue=hechos.filter(function(r){return r.t.doneAt&&r.t.due;});
  const aTiempo=conDue.length?Math.round(conDue.filter(function(r){return new Date(r.t.doneAt)<=endOfDue(r.t);}).length/conDue.length*100):null;

  // --- Periodo para las metricas de flujo (creadas / completadas por fecha) ---
  const _tkPeriod=S.tkPeriod||'7d';
  let _periodStart=null, _periodEnd=null;
  (function(){
    if(_tkPeriod==='todo') return;
    if(_tkPeriod==='custom'){
      const cr=S.tkCustom||{};
      if(cr.from) _periodStart=new Date(cr.from+'T00:00:00');
      if(cr.to)   _periodEnd=new Date(cr.to+'T23:59:59');
      return;
    }
    const d=new Date(); d.setHours(0,0,0,0);
    if(_tkPeriod==='hoy'){ _periodStart=d; return; }
    if(_tkPeriod==='7d'){ d.setDate(d.getDate()-6); _periodStart=d; return; }
    if(_tkPeriod==='30d'){ d.setDate(d.getDate()-29); _periodStart=d; return; }
  })();
  const _hasBound=!!(_periodStart||_periodEnd);
  const _inPeriod=function(dt){ if(!dt) return false; if(_periodStart&&dt<_periodStart) return false; if(_periodEnd&&dt>_periodEnd) return false; return true; };
  const _tkCreatedAt=function(t){ return t.delegatedAt?new Date(t.delegatedAt):(typeof t.id==='number'&&t.id>1e12?new Date(t.id):null); };
  const creadasP=tickets.filter(function(r){ if(!_hasBound) return true; return _inPeriod(_tkCreatedAt(r.t)); }).length;
  const completadasP=hechos.filter(function(r){ if(!r.t.doneAt) return false; if(!_hasBound) return true; return _inPeriod(new Date(r.t.doneAt)); }).length;
  const _periodLabel=(function(){
    if(_tkPeriod==='custom'){
      const cr=S.tkCustom||{};
      const short=function(s){ if(!s) return '?'; const p=s.split('-'); return p[2]+'/'+p[1]; };
      return short(cr.from)+' a '+short(cr.to);
    }
    return {hoy:'hoy','7d':'7 dias','30d':'30 dias',todo:'total'}[_tkPeriod]||_tkPeriod;
  })();

  // Rendimiento por responsable
  const porResp={};
  tickets.forEach(function(r){
    const k=(r.t.responsible||'Ashy').trim()||'Ashy';
    porResp[k]=porResp[k]||{abiertos:0,vencidos:0,hechos:0,dias:[],due:0,onTime:0};
    const p=porResp[k];
    if(!r.t.done){ p.abiertos++; const d=endOfDue(r.t); if(d&&d<now) p.vencidos++; }
    else {
      p.hechos++;
      if(r.t.doneAt&&r.t.delegatedAt) p.dias.push(_tkDias(new Date(r.t.delegatedAt),new Date(r.t.doneAt)));
      if(r.t.doneAt&&r.t.due){ p.due++; if(new Date(r.t.doneAt)<=endOfDue(r.t)) p.onTime++; }
    }
  });

  // Filtro
  const filter=S.ticketsFilter||'abiertos';
  let list=tickets;
  if(filter==='abiertos') list=abiertos;
  else if(filter==='vencidos') list=vencidos;
  else if(filter==='hechos') list=hechos;
  // orden: vencidos primero, luego abiertos mas viejos, luego hechos recientes
  list=[...list].sort(function(a,b){
    const doneA=a.t.done?1:0, doneB=b.t.done?1:0;
    if(doneA!==doneB) return doneA-doneB; // hechas al final
    if(!doneA){
      // prioridad manual (drag & drop) manda; sin prio va despues
      const pa=(a.t.prio!=null)?a.t.prio:1e9;
      const pb=(b.t.prio!=null)?b.t.prio:1e9;
      if(pa!==pb) return pa-pb;
      // fallback: vencidas primero, despues las mas viejas
      const av=endOfDue(a.t)&&endOfDue(a.t)<now?0:1;
      const bv=endOfDue(b.t)&&endOfDue(b.t)<now?0:1;
      if(av!==bv) return av-bv;
      return String(a.t.delegatedAt||'').localeCompare(String(b.t.delegatedAt||''));
    }
    return String(b.t.doneAt||'').localeCompare(String(a.t.doneAt||''));
  });
  // lista visible para el drag & drop de prioridades
  window._tkList=list.map(function(r){return {cid:r.c.id,tid:r.t.id,done:!!r.t.done};});

  const kpi=function(label,val,red){
    return '<div class="metric-card"'+(red?' style="background:rgba(216,90,48,0.08);border:0.5px solid rgba(216,90,48,0.25)"':'')+'>'
      +'<div class="metric-label"'+(red?' style="color:var(--redx)"':'')+'>'+label+'</div>'
      +'<div class="metric-value"'+(red?' style="color:var(--redx)"':'')+'>'+val+'</div></div>';
  };
  const fbtn=function(key,label,n){
    const act=filter===key;
    return '<button class="btn btn-sm" onclick="S.ticketsFilter=\''+key+'\';showTickets()" style="'+(act?'border-color:var(--accent);color:var(--accent)':'color:var(--text3)')+'">'+label+' <span style="opacity:0.6">'+n+'</span></button>';
  };
  const fmtF=function(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); };

  // --- Filas agrupadas por cliente (rediseno minimalista) ---
  const _check='<svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2.5 6.2l2.3 2.3 4.7-4.9\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';
  const filaTarea=function(r,_i){
    const t=r.t, c=r.c;
    const d=endOfDue(t);
    const venc=!t.done&&d&&d<now;
    const porVencer=!t.done&&d&&!venc&&(d-now)<=12*3600000;
    // texto de estado corto (va como meta gris, no como columna)
    let meta;
    const ST=_TK_ESTADOS[t.estado];
    if(t.done){ var _pt=_tkProcTexto(t); meta=(t.doneAt&&t.delegatedAt)?('hecha en '+_tkDias(new Date(t.delegatedAt),new Date(t.doneAt))+' d'):'hecha'; if(_pt) meta+=' &middot; <span style=\"color:var(--bluex,#378add)\">'+_pt+' en proceso</span>'; }
    else if(venc){ meta='<span style=\"color:var(--redx)\">vencida hace '+_tkDias(d,now)+' d</span>'; }
    else if(porVencer){ meta='<span style=\"color:var(--amberx)\">por vencer</span>'; }
    else if(t.estado==='proceso'&&t.procesoAt){ meta='en proceso &middot; <span style=\"color:var(--bluex,#378add)\">'+_tkProcTexto(t)+'</span>'; }
    else if(t.estado&&ST){ meta=ST.label.toLowerCase()+(t.delegatedAt?(' &middot; '+_tkDias(new Date(t.delegatedAt),now)+' d'):''); }
    else { meta=(t.delegatedAt?('abierta '+_tkDias(new Date(t.delegatedAt),now)+' d'):'abierta'); }
    const seguir=t.ownerCliente?'<span style=\"display:inline-block;background:rgba(216,90,48,0.14);color:var(--redx);font-size:9px;font-weight:600;padding:1px 6px;border-radius:20px;margin-right:6px;text-transform:uppercase;letter-spacing:.04em\">Seguir a '+esc(t.responsible||'cliente')+'</span>':'';
    // Chip de estado como DROPDOWN: se toca y muestra las opciones para elegir directo.
    var chip='';
    var _chipStyle, _chipLabel;
    if(t.done){ _chipStyle='background:rgba(29,158,117,0.14);color:var(--accent)'; _chipLabel='Hecha'; }
    else {
      var _map={proceso:['En proceso','var(--bluex,#378add)','rgba(55,138,221,0.14)'],
                delegada:['Delegada','#9F8FE8','rgba(100,80,200,0.16)'],
                revision:['En revision','var(--amberx)','rgba(240,168,48,0.14)'],
                bloqueada:['Bloqueada','var(--redx)','rgba(216,90,48,0.14)']};
      var _e=_map[t.estado];
      if(_e){ _chipStyle='background:'+_e[2]+';color:'+_e[1]; _chipLabel=_e[0]; }
      else { _chipStyle='background:var(--bg3);color:var(--text3)'; _chipLabel='Abierta'; }
    }
    chip='<span style=\"position:relative;display:inline-block\">'
      +'<span class=\"tk-chip\" onclick=\"event.stopPropagation();ticketEstadoMenu('+c.id+','+t.id+',this)\" style=\"'+_chipStyle+';cursor:pointer\">'+_chipLabel+' &#9662;</span>'
      +'</span>';
    return '<div class=\"tk-row'+(t.done?' done':'')+'\" '

// Consulta al Apps Script que le falta para que el informe salga solo
function weeklyReportDiag(){
  const el=document.getElementById('wr-diag');
  if(!el) return;
  const proxy=getGhlProxy();
  if(!proxy.url){ el.innerHTML='<span style="color:var(--redx)">Falta la conexion (proxy) - configurala en Integraciones &rarr; GoHighLevel.</span>'; return; }
  Promise.race([
    fetch(proxy.url+'?secret='+encodeURIComponent(proxy.secret)+'&action=report_status').then(function(r){return r.json();}),
    new Promise(function(res){setTimeout(function(){res(null);},8000);})
  ]).then(function(d){
    if(!d){ el.innerHTML='<span style="color:var(--amberx)">El Apps Script no responde - revisa la URL del proxy.</span>'; return; }
    if(!d.ok){
      const err=String(d.error||'');
      if(err.indexOf('Accion desconocida')>=0||err.indexOf('Faltan token o location')>=0){
        el.innerHTML='<span style="color:var(--redx)">La URL /exec sigue sirviendo la version VIEJA del script</span> (respondio: "'+esc(err)+'").<br>'
          +'El codigo puede estar pegado, pero falta publicarlo: <b>Implementar &rarr; Administrar implementaciones &rarr; lapiz &rarr; Version: "Nueva version" &rarr; Implementar</b> (sobre la implementacion EXISTENTE, no una nueva - guardar con Ctrl+S no alcanza).<br>'
          +'Verifica tambien que editaste el proyecto correcto: la URL de esa implementacion tiene que ser identica a la del boton Conexion (proxy).';
      } else {
        el.innerHTML='<span style="color:var(--redx)">El Apps Script respondio con error:</span> '+esc(err);
      }
      return;
    }
    const li=function(ok,okTxt,badTxt){ return '<div>'+(ok?'<span style="color:var(--accent)">&#10003;</span> '+okTxt:'<span style="color:var(--redx)">&#10007;</span> '+badTxt)+'</div>'; };
    el.innerHTML=''
      +li(!!d.email,'Email destino en el script: '+esc(d.email),'Falta el email destino - toca "Guardar y sincronizar"')
      +li((d.clients||[]).length>0,(d.clients||[]).length+' clientes con config en el script','Sin clientes en el script - toca "Guardar y sincronizar"')
      +li(!!d.trigger,'Disparador de los lunes ACTIVO','Disparador de los lunes NO creado - abri el editor del Apps Script y ejecuta setupWeeklyTrigger una vez');
  }).catch(function(e){
    el.innerHTML='<span style="color:var(--redx)">Error consultando el script: '+esc(e.message)+'</span>';
  });
}
async function pushWeeklyReportConfig(){
  const proxy=getGhlProxy();
  if(!proxy.url){ if(typeof toast==='function') toast('Configura la conexion (proxy) primero'); return; }
  const emailEl=document.getElementById('wr-email');
  const email=(emailEl?emailEl.value.trim():'');
  if(!email){ if(typeof toast==='function') toast('Ingresa un email'); return; }
  const st=document.getElementById('wr-status');
  const setSt=function(t){ if(st) st.innerHTML=t; };
  localStorage.setItem('evold-report-email',email);
  const enc=encodeURIComponent;
  try{
    setSt('Guardando email destino...');
    await fetch(proxy.url+'?secret='+enc(proxy.secret)+'&action=save_report_settings&email='+enc(email)).then(function(r){return r.json();});
    const clients=DB.clients.filter(function(c){return c.ghl&&c.ghl.token&&c.ghl.locationId;});
    let ok=0;
    for(let i=0;i<clients.length;i++){
      const c=clients[i];
      setSt('Sincronizando '+(i+1)+'/'+clients.length+': '+esc(c.name)+'...');
      const al=getActiveLine(c.conversionLines||[]);
      // conteo de tickets abiertos y vencidos de este cliente (tareas delegadas no hechas)
      const _now=new Date();
      const _tks=(c.tasks||[]).filter(function(t){return t.delegated&&t.ticket&&!t.done;});
      const _venc=_tks.filter(function(t){var d=t.due?new Date(t.due):null;return d&&d<_now;}).length;
      const payload={name:c.name,ghlToken:c.ghl.token,ghlLocation:c.ghl.locationId,
        metaToken:c.metaToken||'',metaAccountId:c.metaAccountId||'',
        excluded:(al&&al.excludedCampaigns)||[],rules:getGhlRules(c),
        ticketsAbiertos:_tks.length,ticketsVencidos:_venc};
      const r=await fetch(proxy.url+'?secret='+enc(proxy.secret)+'&action=save_report_config&clientKey='+enc(String(c.id))+'&payload='+enc(JSON.stringify(payload))).then(function(x){return x.json();}).catch(function(){return null;});
      if(r&&r.ok) ok++;
      await new Promise(function(r2){setTimeout(r2,150);});
    }
    localStorage.setItem('evold-report-pushed',String(Date.now()));
    setSt('<span style="color:var(--accent)">Listo: '+ok+'/'+clients.length+' clientes sincronizados. Recorda re-sincronizar si cambias tokens, reglas o campanas excluidas.</span>');
    weeklyReportDiag(); // refrescar el diagnostico con el estado nuevo
    if(typeof toast==='function') toast('Informe semanal configurado ('+ok+' clientes)');
    if(S.tab==='integraciones') renderTab();
  }catch(e){
    setSt('<span style="color:var(--redx)">Error: '+esc(e.message)+' - actualiza el Apps Script a la v4.</span>');
  }
}

// Guarda el primer valor y el mejor (minimo) valor historico por metrica.
function captureRecords(c,vals){
  c.records=c.records||{};
  var now=new Date().toISOString();
  var changed=false;
  Object.keys(vals).forEach(function(k){
    var v=vals[k];
    if(v==null||!isFinite(v)||v<=0) return;
    var r=c.records[k];
    if(!r){
      c.records[k]={first:v,firstAt:now,best:v,bestAt:now};
      changed=true;
    } else if(v<r.best-1e-9){
      r.prevBest=r.best; r.prevBestAt=r.bestAt;
      r.best=v; r.bestAt=now;
      r.justBeaten=Date.now(); // para el destello "nuevo record"
      changed=true;
    }
  });
  if(changed) save();
  return changed;
}

// Compara las oportunidades frescas contra la foto del sync anterior y registra:
// nuevos registros, cambios de stage, ganados y perdidos.
function computeGhlChanges(c, freshOps){
  c.ghl=c.ghl||{};
  const snap=c.ghl._snapshot;
  const now=new Date().toISOString();
  const changes=[];
  // Stages que el cliente definio como "agenda": sirven para distinguir un agendamiento
  // de un cambio de stage cualquiera.
  const rules=(typeof getGhlRules==='function')?getGhlRules(c):{};
  const AG=(rules.agendas||[]);
  const esAgenda=function(st){ return AG.length && AG.indexOf(_n(st||''))>=0; };
  // Fecha real del movimiento si el proxy la devuelve; si no, la del sync.
  const cuando=function(o,fallback){
    const v=o.updatedAt||o.dateUpdated||o.lastStatusChangeAt||o.lastStageChangeAt||fallback;
    const d=v?new Date(v):null;
    return (d&&!isNaN(d.getTime()))?d.toISOString():now;
  };
  if(snap&&snap.length){
    const prev={};
    snap.forEach(function(s){ prev[s.id]=s; });
    freshOps.forEach(function(o){
      const p=prev[String(o.id)];
      const name=o.contactName||o.name||'Lead';
      if(!p){
        changes.push({ts:cuando(o,o.createdAt),icon:'+',kind:'nuevo',text:'Nuevo registro: '+name+(o.pipelineStage?' \u2014 entro en "'+o.pipelineStage+'"':'')});
        return;
      }
      const st=(o.pipelineStage||'');
      if(p.stage!==st&&(p.stage||st)){
        if(esAgenda(st)&&!esAgenda(p.stage)){
          changes.push({ts:cuando(o),icon:'\u25CB',kind:'agenda',text:name+' agendo \u2014 "'+st+'"'});
        } else {
          changes.push({ts:cuando(o),icon:'\u2192',kind:'stage',text:name+': "'+(p.stage||'sin stage')+'" \u2192 "'+(st||'sin stage')+'"'});
        }
      }
      const status=(o.status||'');
      if(p.status!==status){
        if(status==='won') changes.push({ts:cuando(o),icon:'$',kind:'ganado',text:name+' \u2014 GANADO'+(Number(o.monetaryValue)?' \u00b7 $'+Number(o.monetaryValue).toLocaleString('en-US'):'')});
        else if(status==='lost') changes.push({ts:cuando(o),icon:'x',kind:'perdido',text:name+' \u2014 perdido'});
        else if(status==='abandoned') changes.push({ts:cuando(o),icon:'x',kind:'perdido',text:name+' \u2014 abandonado'});
      }
    });
  }
  c.ghl._snapshot=freshOps.map(function(o){return {id:String(o.id),stage:o.pipelineStage||'',status:o.status||''};});
  if(changes.length) c.ghl._changes=changes.concat(c.ghl._changes||[]).slice(0,300);
  return changes.length;
}

  return ((c.ghl&&c.ghl._changes)||[]).filter(function(ch){return new Date(ch.ts).getTime()>seen;}).length;

function fmtAlarmVal(fmt,v){
  if(v==null||!isFinite(v)) return '-';
  if(fmt==='money') return '$'+(Math.round(v*100)/100).toLocaleString('en-US');
  if(fmt==='pct') return (Math.round(v*10)/10)+'%';
  return String(Math.round(v*10)/10);

// Valores actuales de TODAS las areas: tiempo real, funnel de ventas, lineas y contrato
function computeAlarmMetrics(c){
  const out={};
  // --- Tiempo real (rolling 7 dias) ---
  const l=(c.liveLines||[]).find(function(x){return x.rolling;});
  if(l){
    const m=l.metrics||{};
    const f=ghlFunnelForRange(c,l.dateStart,l.dateEnd)||{};
    const spent=Number(m.adSpent)||0;
    const div=function(n,d){return (d&&spent)?n/d:null;};
    const reg=(f.registros!=null)?f.registros:(m.registros!=null?Number(m.registros):null);
    const sq=(f.sql!=null)?f.sql:(m.sql!=null?Number(m.sql):null);
    out.adSpent=spent||null;
    out.cpm=(m.cpm!=null)?Number(m.cpm):null;
    out.cpc=(m.cpc!=null)?Number(m.cpc):null;
    out.cpl=(m.cpl!=null)?Number(m.cpl):null;
    out.costoRegistro=div(spent,reg);
    out.costoAgenda=(f.agendas!=null)?div(spent,f.agendas):null;
    out.costoSql=div(spent,sq);
    out.registros=reg;
    out.sqls=sq;
  }
  // --- Conversion de ventas (todo el historico de GHL, reglas de stages) ---
  const ops=(c.ghl&&c.ghl.opportunities)||[];
  if(ops.length){
    const rules=getGhlRules(c);
    const SQLS=(rules.sql&&rules.sql.length)?rules.sql:['tomando decision','nda','segunda llamada'];
    const isSql=function(o){return o._sql||SQLS.indexOf(_n(o.pipelineStage))>=0;};
    const cnt=function(arr){return (arr&&arr.length)?ops.filter(function(o){return arr.indexOf(_n(o.pipelineStage))>=0;}).length:null;};
    const agendas=cnt(rules.agendas), asis=cnt(rules.asistencias), noSh=cnt(rules.noShows), vivo=cnt(rules.llamadaEnVivo);
    const sqlN=ops.filter(isSql).length;
    const ganadosArr=ops.filter(function(o){return deriveEstado(o).label==='Ganado';});
    out.vtaAgendas=agendas;
    out.vtaShowsPct=(agendas&&asis!=null)?asis/agendas*100:null;
    out.vtaNoShowsPct=(agendas&&noSh!=null)?noSh/agendas*100:null;
    out.vtaLlamadasVivo=vivo;
    out.vtaCalificadoPct=(vivo)?sqlN/vivo*100:null;
    out.vtaCloseCalifPct=(sqlN)?ganadosArr.length/sqlN*100:null;
    out.vtaCerrados=ganadosArr.length;
    out.vtaRevenue=ganadosArr.reduce(function(s,o){return s+(Number(o.monetaryValue)||0);},0);
    out.vtaPipeline=ops.reduce(function(s,o){return s+(Number(o.monetaryValue)||0);},0);
    const accSpentL=(c.conversionLines||[]).reduce(function(s,li){return s+(Number(li.metrics&&li.metrics.adSpent)||0);},0);
    out.vtaCAC=(ganadosArr.length&&accSpentL)?accSpentL/ganadosArr.length:null;
  }
  // --- Lineas (acumulado del sheet) ---
  const lines=c.conversionLines||[];
  // Frecuencia y opt-in salen de la LINEA ACTIVA, que es lo que esta corriendo hoy.
  // La frecuencia se calcula igual que en Ads & Guiones: impresiones / alcance,
  // sumando solo las campanas incluidas (las que no estan destildadas).
  const _al=getActiveLine(lines);
  if(_al){
    const inc=(_al.metaCampaigns||[]).filter(function(camp){
      return (_al.excludedCampaigns||[]).indexOf(camp.id)===-1;
    });
    let _imp=0,_reach=0;
    inc.forEach(function(camp){ _imp+=Number(camp.impressions)||0; _reach+=Number(camp.reach)||0; });
    out.frecuencia=_reach>0?_imp/_reach:null;
    const _oi=(_al.metrics||{}).optIn;
    out.optInLinea=(_oi!==null&&_oi!==undefined&&_oi!=='')?Number(_oi):null;
  }
  if(lines.length){
    const num=function(v){var n=Number(v);return isNaN(n)?0:n;};
    const accS=lines.reduce(function(s,li){return s+num(li.metrics&&li.metrics.adSpent);},0);
    const accR=lines.reduce(function(s,li){return s+num(li.metrics&&li.metrics.registros);},0);
    const accQ=lines.reduce(function(s,li){return s+num(li.metrics&&li.metrics.sql);},0);
    out.histSpent=accS||null;
    out.histCostoReg=(accR&&accS)?accS/accR:null;
    out.histCostoSql=(accQ&&accS)?accS/accQ:null;
    const al=getActiveLine(lines);
    out.diasBloque=al&&al.dateStart?days(al.dateStart,null):null;
  }
  // --- Contrato ---
  if(c.contract&&c.contract.endDate){
    out.contratoDias=Math.ceil((new Date(c.contract.endDate)-Date.now())/86400000);
  }
  return Object.keys(out).length?out:null;
}

function effectiveAlarmRules(c){
  if(c.archived) return [];
  const a=c.alarms||{};
  const off=a.offDefaults||{};
  const def=getDefaultAlarms().rules
    .filter(function(r){ return r.enabled && !off[r.id]; })
    .map(function(r){
      const x={}; for(var k in r) x[k]=r[k]; x._default=true; return x;
    });
  let all=def.concat(a.rules||[]);
  const d=(typeof adsDot==='function')?adsDot(c):{live:true};
  if(!d.live){
    all=all.filter(function(r){ return _alarmMetricGroup(r.metric)!=='Tiempo real (7 dias)'; });
  }
  return all;
}

function alarmStatus(c){
  const rules=effectiveAlarmRules(c).filter(function(r){return r.enabled;});
  if(!rules.length) return {active:0,breached:0,detalle:[]};
  const M=computeAlarmMetrics(c);
  let breached=0; const detalle=[];
  if(M) rules.forEach(function(r){
    const v=M[r.metric];
    if(v==null) return;
    if(r.op==='gt'? v>Number(r.value) : v<Number(r.value)){
      breached++;
      const met=ALARM_METRICS.find(function(x){return x.id===r.metric;})||{label:r.metric,fmt:'num'};
      detalle.push({
        label:met.label,
        valor:fmtAlarmVal(met.fmt,v),
        limite:fmtAlarmVal(met.fmt,Number(r.value)),
        op:r.op
      });
    }
  });
  return {active:rules.length,breached:breached,detalle:detalle};
}
// Evalua y manda UN mail por cliente con todas las reglas disparadas (cooldown 24h por regla)
function checkAlarms(c){
  c.alarms=c.alarms||{email:'',rules:[],lastSent:{}};
  const a=c.alarms;
  const _email=alarmEmailFor(c);
  const _rules=effectiveAlarmRules(c);
  if(!_email||!_rules.length) return;
  const M=computeAlarmMetrics(c);
  if(!M) return;
  const proxy=getGhlProxy();
  if(!proxy.url) return;
  a.lastSent=a.lastSent||{};
  const triggered=[];
  _rules.forEach(function(r){
    if(!r.enabled) return;
    const v=M[r.metric];
    if(v==null) return;
    const hit=r.op==='gt'? v>Number(r.value) : v<Number(r.value);
    if(hit && (Date.now()-(a.lastSent[r.id]||0))>24*3600000) triggered.push({r:r,v:v});
  });
  if(!triggered.length) return;
  const lines=triggered.map(function(t){
    const met=ALARM_METRICS.find(function(x){return x.id===t.r.metric;})||{label:t.r.metric,fmt:'num'};
    return '- '+met.label+': '+fmtAlarmVal(met.fmt,t.v)+' ('+(t.r.op==='gt'?'supera el maximo de ':'debajo del minimo de ')+fmtAlarmVal(met.fmt,Number(t.r.value))+')';
  });
  const subject='[EVOLVE] '+c.name+': '+triggered.length+' metrica'+(triggered.length>1?'s':'')+' fuera de benchmark';
  const body='Cliente: '+c.name+'\nVentana: ultimos 7 dias\nGenerado: '+new Date().toLocaleString('es-AR')+'\n\n'+lines.join('\n')+'\n\nAbri el tracker (Ads & Guiones / Conversion de ventas) para el detalle.';
  const url=proxy.url+'?action=alert&secret='+encodeURIComponent(proxy.secret)
    +'&to='+encodeURIComponent(_email)
    +'&subject='+encodeURIComponent(subject)
    +'&body='+encodeURIComponent(body);
  fetch(url).then(function(r){return r.json();}).then(function(res){
    if(res&&res.ok){
      triggered.forEach(function(t){ a.lastSent[t.r.id]=Date.now(); });
      save();
      if(typeof toast==='function') toast('Alarma enviada a '+_email);
    }
  }).catch(function(){});
}

        gr.forEach(function(r){
          const met=ALARM_METRICS.find(function(x){return x.id===r.metric;});
          const cur=M[r.metric];
          const hit=r.enabled&&cur!=null&&(r.op==='gt'?cur>Number(r.value):cur<Number(r.value));
          const estado=!r.enabled?'<span class="pill pill-gray" style="font-size:10px">Pausada</span>'
            :cur==null?'<span class="pill pill-gray" style="font-size:10px">Sin dato</span>'
            :hit?'<span class="pill pill-red" style="font-size:10px">Fuera</span>'
            :'<span class="pill pill-green" style="font-size:10px">OK</span>';
          const cooldown=(a.lastSent&&a.lastSent[r.id]&&(Date.now()-a.lastSent[r.id])<24*3600000)?' &middot; avisado hoy':'';
          html+='<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border)">'
            +'<div><div style="font-size:12.5px;color:var(--text)">'+met.label+'</div>'
            +'<div class="mono" style="font-size:10.5px;color:var(--text3)">'+(r.op==='gt'?'avisar si supera ':'avisar si baja de ')+fmtAlarmVal(met.fmt,Number(r.value))+cooldown+'</div></div>'
            +'<div style="display:flex;align-items:center;gap:12px"><span class="mono" style="font-size:12.5px;color:'+(cur==null?'var(--text3)':hit?'var(--redx)':'var(--strong)')+'">'+fmtAlarmVal(met.fmt,cur)+'</span>'+estado+'</div>'
            +'</div>';
        });
      });
      html+='</div>';
      html+='<div style="font-size:11px;color:var(--text3);margin-top:12px">Las reglas se evaluan al refrescar los datos en vivo (al abrir Ads & Guiones). Cada regla avisa por mail como maximo una vez cada 24 h.</div>';
    } else if(!getDefaultAlarms().rules.length){
      html+='<div style="padding:40px 20px;text-align:center;border:1px dashed var(--border2);border-radius:var(--radius-lg)">'
        +'<div style="font-size:13px;color:var(--text2);margin-bottom:4px">Sin reglas configuradas</div>'
        +'<div style="font-size:11.5px;color:var(--text3);max-width:420px;margin:0 auto">Crea benchmarks sobre cualquier metrica de la app - tiempo real, funnel de ventas, lineas historicas o contrato - y recibi un mail cuando algo se salga.</div>'
        +'</div>';
    }
    el.innerHTML=html;
  }

  else if(S.tab==='tareas'){
    var tasks=(c.tasks||[]).filter(function(t){return !t.deleted;});
    var overdue=tasks.filter(function(t){var de=_dueEnd(t.due);return !t.done&&de&&de<new Date();});
    var pending=tasks.filter(function(t){var de=_dueEnd(t.due);return !t.done&&!(de&&de<new Date());});
    var done=tasks.filter(function(t){return t.done;});
    var lastCall=(c.fathomCalls||[])[0];
    el.innerHTML=
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'
      +'<div>'
      +'<div style="font-size:14px;font-weight:500;color:var(--text)">Tareas'
      +(overdue.length?' <span style="background:rgba(216,90,48,0.12);color:var(--redx);padding:2px 8px;border-radius:20px;font-size:11px;margin-left:6px">'+overdue.length+' vencidas</span>':'')
      +'</div>'
      +'<div style="font-size:12px;color:var(--text3);margin-top:3px">'+esc(c.name)+(lastCall?' &middot; ultima llamada: '+esc(lastCall.date):'')+'</div>'
      +'</div>'
      +'<div style="display:flex;gap:8px">'
      +'<button class="btn btn-sm" onclick="addTaskManual('+c.id+')">+ Nueva</button>'
      +'<button class="btn btn-sm btn-primary" id="extract-tasks-btn" onclick="extractTasksFromCalls('+c.id+')">'
      +(lastCall?'Extraer de: '+esc(lastCall.date):'Sin llamadas')+'</button>'
      +'</div></div>'
      +(overdue.length
        ?'<div style="font-size:11px;font-weight:500;color:var(--redx);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Vencidas</div>'
          +overdue.map(function(t){return renderTaskRow(t,c.id);}).join('')
        :'')
      +(pending.length
        ?'<div style="font-size:11px;font-weight:500;color:var(--text3);margin:'+(overdue.length?'16':'0')+'px 0 6px;text-transform:uppercase;letter-spacing:.5px">Pendientes</div>'
          +pending.map(function(t){return renderTaskRow(t,c.id);}).join('')
        :'<div style="padding:40px;text-align:center;color:var(--text3);font-size:12px">Sin tareas pendientes. Hace clic en Extraer para leer la ultima llamada.</div>')
      +(done.length
        ?'<div style="font-size:11px;font-weight:500;color:var(--text3);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px">Completadas</div>'
          +done.slice(0,5).map(function(t){return renderTaskRow(t,c.id);}).join('')
        :'');
  }

  else if(S.tab==='ventas'){
    renderVentasTab(c, el);
  }
}
