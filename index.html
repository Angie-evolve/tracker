function gv(id,type){
  const v=document.getElementById(id)?.value;
  if(v===''||v===null||v===undefined)return null;
  if(type==='float')return parseFloat(v)||null;
  if(type==='int')return parseInt(v)||null;
  return v;
}

function saveLine(clientId, lineId){
  const c=DB.clients.find(x=>x.id===clientId);
  const isEdit=!!lineId;
  // FIX: normalize dates to YYYY-MM-DD on save
  const rawStart=gv('nl-start');
  const rawEnd=gv('nl-end');
  const data={
    id:lineId||('l'+Date.now()),
    version:gv('nl-ver')||('v'+(c.conversionLines.length+(isEdit?0:1))),
    dateStart:rawStart?toInputDate(rawStart):null,
    dateEnd:rawEnd?toInputDate(rawEnd):null,
    campaign:gv('nl-campaign')||'',adset:gv('nl-adset')||'',ad:gv('nl-ad')||'',
    filtro:gv('nl-filtro'),destino:gv('nl-dest'),
    metrics:{
      adSpent:gv('nl-spent','float'),pageViews:gv('nl-pv','int'),
      cpm:gv('nl-cpm','float'),cpc:gv('nl-cpc','float'),
      optIn:gv('nl-optin','float'),cpl:gv('nl-cpl','float'),
      registros:gv('nl-reg','int'),sql:gv('nl-sql','int')
    },
    notes:gv('nl-note')||'',
    adsets:getModalAdsets(),
    status:isEdit?(c.conversionLines.find(x=>x.id===lineId)?.status||'historico'):'activa'
  };
  if(!isEdit){
    c.conversionLines.forEach(l=>l.status='historico');
    c.conversionLines.push(data);
    const reg=data.metrics.registros||0,cpl=data.metrics.cpl||0;
    if(reg>0&&cpl>0){c.monthlyLeads=reg;c.avgCPL=cpl;c.monthlyBudget=Math.round(cpl*reg);}
  } else {
    const idx=c.conversionLines.findIndex(x=>x.id===lineId);
    if(idx>=0)c.conversionLines[idx]={...c.conversionLines[idx],...data};
  }
  save();closeModal();renderClient();toast(isEdit?'Linea actualizada OK':'Linea guardada OK');
}

async function extractContractWithAI(clientId, file, driveUrl){
  const c=DB.clients.find(x=>x.id===clientId);
  if(!c) return;
  // Check API key FIRST before anything
  const anthropicKey = localStorage.getItem('evold-anthropic-key')||'';
  if(!anthropicKey){
    openAnthropicKeyModal();
    // After modal closes, user must re-upload - clear the analyzing state
    if(c.contract) { c.contract._analyzing=false; }
    save(); renderTab();
    return;
  }
  // Mark as analyzing in UI
  if(c.contract) c.contract._analyzing=true;
  save(); renderTab();
  toast('Analizando contrato con IA...');
  try {
    let messages;
    if(file){
      messages=[{role:'user',content:[
        {type:'document',source:{type:'base64',media_type:file.type||'application/pdf',data:file.base64}},
        {type:'text',text:'Extrae del contrato los siguientes campos y responde SOLO con un JSON valido sin markdown ni texto extra: { "minDailyBudget": numero en USD por dia de inversion minima en pauta, "minOCsMonth": numero de OCs/registros calificados garantizados por mes, "totalOCs": numero total de OCs garantizadas en el contrato, "durationDays": duracion del contrato en dias, "startDate": fecha de inicio en formato YYYY-MM-DD o null, "endDate": fecha de vencimiento en formato YYYY-MM-DD o null, "signDate": fecha de firma en formato DD/MM/YYYY o null, "contractValue": monto total que paga el cliente por el servicio principal en USD como numero (sin simbolo), "monthlyFee": monto del fee mensual opcional o de renovacion en USD como numero o null si no existe, "serviceType": "garantia" si es un contrato de servicios con garantia de resultados, "recurrente" si paga mensualmente sin contrato de garantia, o "one-time" si es un pago unico sin renovacion }'}
      ]}];
    } else {
      // Drive URL - can't access directly, skip AI and let user fill manually
      const c2=DB.clients.find(x=>x.id===clientId);
      if(c2){const el=document.getElementById('st-analyzing-'+clientId);if(el)el.closest('div').remove();}
      toast('Contrato vinculado. Completa las condiciones manualmente.');
      return;
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': anthropicKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-opus-4-8',max_tokens:600,messages})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(`API ${res.status}: ${err?.error?.message||res.statusText}`);
    }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean=text.replace(/```json|```/g,'').trim();
    let extracted;
    try{ extracted=JSON.parse(clean); }
    catch(pe){ throw new Error('Respuesta invalida del modelo: '+text.slice(0,100)); }
    var clientFields=['contractValue','monthlyFee','serviceType'];
    Object.entries(extracted).forEach(([k,v])=>{
      if(v!==null&&v!==undefined){
        if(clientFields.indexOf(k)>=0) c[k]=v;
        else c.contract[k]=v;
      }
    });
    if(extracted.serviceType==='recurrente') c.recurrente=true;
    c.contract._analyzing=false;
    save();renderTab();
    toast('Contrato analizado - campos completados automaticamente');
  } catch(e){
    if(c.contract) c.contract._analyzing=false;
    save();renderTab();
    toast('Error: '+e.message,'red');
    console.error('Contract AI error:',e);
  }
}

  const c=DB.clients.find(x=>x.id===clientId);

  let calls=[];
  try{

    if(!Array.isArray(calls)) throw new Error();
  }catch(e){
    toast('JSON invalido, revisa el formato','red');
    return;
  }
  if(!calls.length){toast('No hay llamadas en el JSON','red');return;}
  c.fathomCalls=calls;
  const existingIds=new Set((c.milestones||[]).map(m=>m.fathomId).filter(Boolean));
  const newMilestones=calls
    .filter(cl=>!existingIds.has(cl.id))
    .map(cl=>({
      type:cl.sentiment==='satisfecho'?'hito':'alerta',
      title:cl.title,
      date:cl.date,
      body:cl.summary+(cl.actionItems&&cl.actionItems.length?'\n\nAction items: '+cl.actionItems.join(', '):'')+(cl.riskFlags&&cl.riskFlags.length?'\n\nRiesgos: '+cl.riskFlags.join(', '):''),
      tags:[cl.sentiment==='satisfecho'?'Llamada':'Llamada - atencion',cl.duration].filter(Boolean),
      fathomId:cl.id
    }));
  if(!c.milestones) c.milestones=[];
  c.milestones=[...c.milestones,...newMilestones];
  c.milestones.sort((a,b)=>b.date.split('/').reverse().join('').localeCompare(a.date.split('/').reverse().join('')));
  save();closeModal();renderTab();
  toast(calls.length+' llamadas importadas');
}

// ---------- Reporte de llamada con IA ----------
function buildReportContext(c){
  const contract = c.contract||{};
  const lines = (c.conversionLines||[]).map(function(l){
    var m = l.metrics||{};
    return {
      bloque: l.version||l.blockKey||'-',
      estado: l.status||'-',
      rango: (l.dateStart||'?')+' a '+(l.dateEnd||'actual'),
      campana: l.campaign||'-',
      filtro: l.filtro||'-',
      destino: l.destino||'-',
      adSpent: m.adSpent, cpl: m.cpl, cpm: m.cpm, cpc: m.cpc,
      optIn: m.optIn, registros: m.registros, sql: m.sql, pageViews: m.pageViews,
      nota: l.notes||''
    };
  });
  const hitos = (c.milestones||[]).map(function(h){
    return { tipo:h.type, titulo:h.title, fecha:h.date, detalle:h.body||'' };
  });
  const llamadas = (c.fathomCalls||[]).map(function(cl){
    return {
      titulo: cl.title, fecha: cl.date, sentiment: cl.sentiment,
      resumen: cl.summary||'',
      actionItems: cl.actionItems||[],
      riesgos: cl.riskFlags||[]
    };
  });
  // ---- Matematica del contrato (pre-calculada para que la IA no haga cuentas) ----
  const r2=function(n){return (n===null||n===undefined||isNaN(n))?null:Math.round(n*100)/100;};
  const minDaily=contract.minDailyBudget||null;
  const durationDays=contract.durationDays||null;
  const totalOCs=contract.totalOCs||null;
  const minOCsMonth=contract.minOCsMonth||null;
  const inversionTotalContrato=(minDaily&&durationDays)?minDaily*durationDays:null;
  const costoSqlIdoneo=(inversionTotalContrato&&totalOCs)?inversionTotalContrato/totalOCs:null;
  const ocsAcumuladas=(c.conversionLines||[]).reduce(function(s,l){var v=l.metrics&&l.metrics.sql;return s+((v!==null&&v!==undefined)?Number(v):0);},0);
  const inversionAcumulada=(c.conversionLines||[]).reduce(function(s,l){return s+((l.metrics&&l.metrics.adSpent)||0);},0);
  const diasTranscurridos=days(contract.startDate, null)|| (c.conversionLines[0]?days(c.conversionLines[0].dateStart,null):null);
  const dailySpendReal=(inversionAcumulada&&diasTranscurridos)?inversionAcumulada/diasTranscurridos:null;
  const costoSqlReal=(inversionAcumulada&&ocsAcumuladas>0)?inversionAcumulada/ocsAcumuladas:null;
  const ocsEsperadasAHoy=(totalOCs&&durationDays&&diasTranscurridos)?Math.round(totalOCs/durationDays*diasTranscurridos):null;
  // Remediacion si el costo real supera el idoneo
  let inversionExtra=null, diasExtension=null;
  if(costoSqlReal!==null&&costoSqlIdoneo!==null&&costoSqlReal>costoSqlIdoneo&&totalOCs&&minDaily){
    inversionExtra=totalOCs*costoSqlReal-inversionTotalContrato;
    diasExtension=Math.round(inversionExtra/minDaily);
  }
  let estadoCosto='sin_datos';
  if(costoSqlReal!==null&&costoSqlIdoneo!==null) estadoCosto=(costoSqlReal<=costoSqlIdoneo)?'en_o_bajo_idoneo':'sobre_idoneo';

  const presupuestoSubejecutado=(dailySpendReal!==null&&minDaily!==null)?(dailySpendReal < minDaily*0.8):null;

  return {
    cliente: c.name,
    tipo: c.subtitle||'',
    objetivos: {
      inversionDiariaMin: minDaily,
      ocsMensualesGarantizadas: minOCsMonth,
      ocsTotalesGarantizadas: totalOCs,

      cplObjetivo: c.targetCPL||null,
      fechaFirma: contract.signDate||null,
      vencimiento: contract.endDate||null
    },
    metricasCalculadas: {
      inversionTotalContrato: r2(inversionTotalContrato),
      costoSqlIdoneo: r2(costoSqlIdoneo),
      ocsAcumuladas: ocsAcumuladas,
      inversionAcumulada: r2(inversionAcumulada),
      diasTranscurridos: diasTranscurridos,
      dailySpendReal: r2(dailySpendReal),
      costoSqlReal: r2(costoSqlReal),
      ocsEsperadasAHoy: ocsEsperadasAHoy,
      estadoCosto: estadoCosto,
      estadoRitmo: estadoRitmo,
      presupuestoSubejecutado: presupuestoSubejecutado,
      inversionExtraParaCumplir: r2(inversionExtra),
      diasExtensionParaCumplir: diasExtension
    },
    lineasDeConversion: lines,
    hitosYCambios: hitos,
    llamadas: llamadas
  };
}

  (r.secciones||[]).forEach(function(s){

    (s.items||[]).forEach(function(it){ out += '  - '+it+'\n'; });
    out += '\n';
  });
  return out.trim();
}

function loadScriptOnce(src){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=function(){resolve();};
    s.onerror=function(){ if(s.parentNode) s.parentNode.removeChild(s); reject(new Error('fail '+src)); };
    document.head.appendChild(s);
  });
}

// ================= Conversion de ventas (GHL) =================
// Cuenta el funnel de GHL para un rango: cada lead cae en el rango segun su fecha de creacion,
// y se clasifica con las reglas de stages de Conversion de ventas (estado actual del lead).
function ghlFunnelForRange(c,dateStart,dateEnd){
  const opps=(c.ghl&&c.ghl.opportunities)||[];
  if(!opps.length||!dateStart) return null;
  const rules=getGhlRules(c);
  const s=new Date(dateStart);
  const e=dateEnd?new Date(dateEnd):new Date();
  e.setHours(23,59,59,999);
  const ops=opps.filter(function(o){
    if(!o.createdAt) return false;
    const d=new Date(o.createdAt);
    return d>=s && d<=e;
  });
  const cnt=function(arr){ return (arr&&arr.length)? ops.filter(function(o){return arr.indexOf(_n(o.pipelineStage))>=0;}).length : null; };
  const SQLS=(rules.sql&&rules.sql.length)?rules.sql:['tomando decision','nda','segunda llamada'];
  const isSql=function(o){ return o._sql || SQLS.indexOf(_n(o.pipelineStage))>=0; };
  return {
    registros: ops.length,
    sql: ops.filter(isSql).length,
    agendas: cnt(rules.agendas),
    enVivo: cnt(rules.llamadaEnVivo),
    calif: (rules.llamadaEnVivo&&rules.llamadaEnVivo.length)? ops.filter(function(o){return rules.llamadaEnVivo.indexOf(_n(o.pipelineStage))>=0 && isSql(o);}).length : null
  };
}

function getGhlRules(c){
  const r=(c&&c.ghlRules)||{};
  return {
    ganado:r.ganado||[],
    abandonado:r.abandonado||[],
    abandonadoDias:r.abandonadoDias!=null?r.abandonadoDias:7,
    sql:r.sql||[],
    llamadaEnVivo:r.llamadaEnVivo||[],
    agendas:r.agendas||[],
    asistencias:r.asistencias||[],
    noShows:r.noShows||[],
    presentaciones:r.presentaciones||[]
  };
}
function deriveEstado(o){
  const c=DB.clients.find(function(x){return x.id===S.clientId;});
  const rules=getGhlRules(c);
  const stageN=_n(o.pipelineStage);
  const hasCustomGanado=rules.ganado.length>0;
  const hasCustomAbandonado=rules.abandonado.length>0;
  if(hasCustomGanado){
    if(rules.ganado.indexOf(stageN)>=0) return {label:'Ganado',color:'var(--accent)',bg:'rgba(29,158,117,0.15)'};
  } else if(stageN.indexOf('compr')>=0 && !/(^|\s)no\s+compr/.test(stageN)){
    return {label:'Ganado',color:'var(--accent)',bg:'rgba(29,158,117,0.15)'};
  }
  if(hasCustomAbandonado){
    if(rules.abandonado.indexOf(stageN)>=0 && o.createdAt){
      var dias1=Math.floor((Date.now()-new Date(o.createdAt).getTime())/86400000);
      if(dias1>=rules.abandonadoDias) return {label:'Abandonado',color:'var(--redx)',bg:'rgba(216,90,48,0.15)'};
    }
  } else if(stageN.indexOf('no respondi')>=0 && o.createdAt){
    var dias2=Math.floor((Date.now()-new Date(o.createdAt).getTime())/86400000);
    if(dias2>=7) return {label:'Abandonado',color:'var(--redx)',bg:'rgba(216,90,48,0.15)'};
  }
  const raw=(o.status||'').toLowerCase();
  if(raw==='won') return {label:'Ganado',color:'var(--accent)',bg:'rgba(29,158,117,0.15)'};
  if(raw==='lost') return {label:'Perdido',color:'var(--redx)',bg:'rgba(216,90,48,0.15)'};
  return {label:o.status||'En proceso',color:'var(--amberx)',bg:'rgba(240,168,48,0.15)'};
}

/**
 * Fusiona lo que vuelve de GHL con lo que ya teniamos guardado, en vez de pisarlo.
 * GHL manda el dato "crudo" (stage, status, valor); todo lo que enriquecimos contacto
 * por contacto (utmAd, campaign, pais, tags) y lo que marcaste a mano (_sql) vive solo
 * en local: si reemplazamos el array entero, se pierde y hay que reconstruirlo de cero.
 * truncated = la paginacion corto por el tope de seguridad, asi que "no vino" != "se borro".
 */
function mergeGhlOpps(prevOps, freshOps, truncated){
  const prev={};
  (prevOps||[]).forEach(function(o){ prev[String(o.id)]=o; });
  const keep=function(fresh, old, path, field){
    const fSrc=fresh[path]||(fresh[path]={});
    const oSrc=old[path]||{};
    if(!fSrc[field] && oSrc[field]) fSrc[field]=oSrc[field];
  };
  const merged=(freshOps||[]).map(function(o){
    const old=prev[String(o.id)];
    if(!old) return o;
    keep(o, old, 'source', 'utmAd');
    keep(o, old, 'source', 'utmCampaign');
    keep(o, old, 'source', 'utmSource');
    keep(o, old, 'source', 'landingUrl');
    keep(o, old, 'geo', 'location');
    if((!o.tags || !o.tags.length) && old.tags && old.tags.length) o.tags=old.tags;
    if(old._sql) o._sql=true;              // calificacion manual: no se pierde nunca
    if(old._enrichOk) o._enrichOk=true;    // ya lo enriquecimos: no volver a pedirlo
    if(old._enrichTry) o._enrichTry=old._enrichTry;
    delete prev[String(o.id)];
    return o;
  });
  // Lo que quedo en prev son opps que GHL no devolvio: se eliminaron alla (las soltamos)
  // salvo que la paginacion se haya cortado, en cuyo caso las conservamos por las dudas.
  if(truncated){ Object.keys(prev).forEach(function(k){ merged.push(prev[k]); }); }
  return merged;
}

async function syncGhl(clientId, silent, skipEnrich){
  const c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  const proxy=getGhlProxy();
  c.ghl=c.ghl||{};
  if(!proxy.url||!proxy.secret){ if(!silent) toast('Configura primero la conexion con GHL','red'); return; }
  if(!c.ghl.token||!c.ghl.locationId){ if(!silent) toast('Falta el token o el location del cliente','red'); return; }
  if(c.ghl._syncing) return;
  c.ghl._syncing=true; if(!silent) toast('Sincronizando con GHL...'); renderTab();
  const pageLimit=100; // fetch 100 per page
  const controller=new AbortController();
  const timer=setTimeout(function(){ controller.abort(); }, 180000);
  try{
    // Paginate through all opportunities
    var allOpps=[];
    var startAfter=null;
    var page=1;
    var truncated=false;
    while(true){
      var u=proxy.url+(proxy.url.indexOf('?')>=0?'&':'?')
        +'secret='+encodeURIComponent(proxy.secret)
        +'&token='+encodeURIComponent(c.ghl.token)
        +'&location='+encodeURIComponent(c.ghl.locationId)
        +'&action=opportunities&limit='+pageLimit;
      if(startAfter) u+='&startAfter='+encodeURIComponent(startAfter);
      if(!silent) toast('Sincronizando pagina '+page+'... ('+allOpps.length+' hasta ahora)');
      const res=await fetch(u, {method:'GET', signal:controller.signal});
      const text=await res.text();
      let data;
      try{ data=JSON.parse(text); }
      catch(pe){ throw new Error('El proxy no devolvio JSON. Empieza con: '+text.slice(0,80)); }
      if(!data || data.ok===false) throw new Error((data&&data.error)||'Respuesta invalida del proxy');
      const batch=data.opportunities||[];
      allOpps=allOpps.concat(batch);
      // Stop conditions
      const metaTotal=data.meta&&data.meta.total ? parseInt(data.meta.total) : null;
      if(metaTotal && allOpps.length >= metaTotal){ break; } // got all
      if(batch.length < pageLimit){ break; } // last page - got fewer than requested
      // Only paginate if startAfter is a NEW value we haven't used
      const nextSA=data.meta&&data.meta.startAfter;
      if(!nextSA || nextSA===startAfter){ break; } // no new cursor
      startAfter=nextSA;
      page++;
      if(page>5){ truncated=true; break; } // safety: max 500
    }
    clearTimeout(timer);
    const nChanges=computeGhlChanges(c, allOpps);
    c.ghl.opportunities=mergeGhlOpps(c.ghl.opportunities, allOpps, truncated);
    c.ghl.lastSync=new Date().toISOString();
    c.ghl._syncing=false; save();
    if(!silent||nChanges) toast(allOpps.length+' oportunidades sincronizadas'+(nChanges?' \u00b7 '+nChanges+' novedades':''));
    renderTab();
    if(!skipEnrich) enrichContactsBackground(c, proxy);
  }catch(e){
    clearTimeout(timer);
    c.ghl._syncing=false;
    c.ghl._syncError=e.name==='AbortError'?'Tardo demasiado. Reintenta.':(e.message||'fallo la sincronizacion');
    save();
    const msg='Error GHL: '+c.ghl._syncError;
    toast(msg,'red');
    console.error('GHL sync error',e);
    // Don't call renderTab here to avoid infinite loop
    const el=document.getElementById('tab-content');
    if(el) el.innerHTML='<div style="padding:20px;color:var(--redx);font-size:13px">Error: '+c.ghl._syncError+'<br><button class="btn btn-sm" style="margin-top:10px" onclick="syncGhl('+clientId+',false)">Reintentar</button></div>';
  }
}

async function enrichContactsBackground(c, proxy){
  // Opps a las que les falta utmAd, utmCampaign, ubicacion o tags (y no se intentaron en las ultimas 24h)
  const _now=Date.now();
  const toEnrich=(c.ghl.opportunities||[]).filter(function(o){
    if(!o.contactId) return false;
    // Si el intento anterior fallo (proxy caido, secreto mal, etc) reintentamos a los 15 min,
    // no a las 24h: si no, un problema temporal de conexion deja los UTM vacios todo el dia.
    var wait=(o._enrichOk && o.source.utmAdset)?24*3600000:15*60000;
    if(o._enrichTry && (_now-o._enrichTry)<wait) return false;
    return (!o.source.utmAd || !o.source.utmCampaign || !o.source.utmAdset || !o.geo.location || !o.tags
      || (!o.source.landingUrl && !o._urlTry));
  });
  if(!toEnrich.length) return;
  const base=proxy.url+(proxy.url.indexOf('?')>=0?'&':'?')
    +'secret='+encodeURIComponent(proxy.secret)
    +'&token='+encodeURIComponent(c.ghl.token)
    +'&location='+encodeURIComponent(c.ghl.locationId);
  var enriched=0;
  const CONC=3; // 3 en paralelo: baja el tiempo ~3x sin castigar la cuota del Apps Script
  const one=async function(opp){
    try{
      var url=base+'&action=contact&contactId='+encodeURIComponent(opp.contactId);
      var res=await fetch(url);
      var data=await res.json();
      if(data.ok){
        opp.source=opp.source||{}; opp.geo=opp.geo||{};
        if(data.utmAd) opp.source.utmAd=data.utmAd;
        // Pagina de origen: viene de attributionSource.url del contacto (Apps Script v8).
        // Se marca el intento aunque venga vacia: hay contactos sin atribucion guardada
        // y no tiene sentido volver a pedirlos en cada ciclo.
        if(data.url) opp.source.landingUrl=String(data.url);
        opp._urlTry=Date.now();
        if(data.location) opp.geo.location=data.location;
        if(data.utmCampaign && !opp.source.utmCampaign) opp.source.utmCampaign=data.utmCampaign;
        if(data.utmSource && !opp.source.utmSource) opp.source.utmSource=data.utmSource;
        // Conjunto de anuncios: del campo utmAdset, o parseado de la URL de atribucion si viene.
        var _adsetD=data.utmAdset||data.utm_adset||data.adSet||data.adset||'';
        if(!_adsetD){ var _u=data.url||data.attributionUrl||data.documentUrl||data.pageUrl||''; if(_u){ var _m=/[?&]utm_adset=([^&]+)/i.exec(String(_u)); if(_m) _adsetD=decodeURIComponent(_m[1].replace(/\+/g,' ')); } }
        if(_adsetD && !opp.source.utmAdset) opp.source.utmAdset=_adsetD;
        var dTags=data.tags||data.contactTags||null;
        if(dTags && Array.isArray(dTags) && dTags.length) opp.tags=dTags;
        // Respuestas del formulario completas (la busqueda de oportunidades trae un contacto liviano).
        if(data.formAnswers && typeof data.formAnswers==='object'){
          opp.formAnswers=opp.formAnswers||{};
          Object.keys(data.formAnswers).forEach(function(fk){ if(String(data.formAnswers[fk]||'').trim()!=='') opp.formAnswers[fk]=data.formAnswers[fk]; });
        }
        opp._enrichOk=true;
        enriched++;
      }
    }catch(e){}
    opp._enrichTry=Date.now();
  };
  for(var i=0;i<toEnrich.length;i+=CONC){
    await Promise.all(toEnrich.slice(i,i+CONC).map(one));
    save(); // persistimos cada tanda: si cerras la pestaña, no se pierde lo ya enriquecido
    if(i && i%30===0){ renderTab(); } // refresco parcial para ver los anuncios poblarse
    await new Promise(function(r){setTimeout(r,120);});
  }
  if(enriched>0){ save(); renderTab(); toast(enriched+' contactos enriquecidos'); }
}

function _ghlAgo(iso){
  if(!iso) return 'nunca';
  const mins=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1) return 'recien'; if(mins<60) return 'hace '+mins+' min';
  const h=Math.floor(mins/60); if(h<24) return 'hace '+h+' h'; return 'hace '+Math.floor(h/24)+' d';
}

// El funnel de ventas dentro de Embudo se dibuja recien cuando el scroll llega:
// renderVentasTab cruza oportunidades por anuncio, campana y pais, y hacerlo junto
// con la sincronizacion de Meta al abrir la pestana la vuelve muy pesada.
function embudoVentasSlot(){
  return '<div id="embudo-ventas-slot" style="margin-top:28px;border-top:1px solid var(--border);padding-top:22px">'
    +'<div style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Conversion de ventas</div>'
    +'<div id="embudo-ventas-body" style="min-height:120px;display:flex;align-items:center;justify-content:center">'
    +'<span style="font-size:12px;color:var(--text3)">Se carga al llegar aca...</span>'
    +'</div></div>';
}

function montarEmbudoVentas(c){
  // requestAnimationFrame: el slot recien existe despues de que el navegador pinte el innerHTML
  requestAnimationFrame(function(){
    var slot=document.getElementById('embudo-ventas-slot');
    var body=document.getElementById('embudo-ventas-body');
    if(!slot||!body) return;
    var montado=false;
    var montar=function(){
      if(montado) return;
      montado=true;
      body.style.display='block';
      body.style.alignItems='';
      body.style.justifyContent='';
      body.style.minHeight='';
      try{ renderVentasTab(c, body); }
      catch(e){
        console.warn('embudo ventas:',e);
        body.innerHTML='<span style="font-size:12px;color:var(--redx)">No se pudo cargar el funnel de ventas.</span>';
      }
    };
    if(!('IntersectionObserver' in window)){ montar(); return; }
    var obs=new IntersectionObserver(function(entradas){
      entradas.forEach(function(e){
        if(e.isIntersecting){ obs.disconnect(); montar(); }
      });
    }, {rootMargin:'200px'}); // arranca 200px antes de entrar en pantalla
    obs.observe(slot);
  });
}

function renderVentasTab(c, el){
  const esc=function(s){return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  const proxy=getGhlProxy();
  c.ghl=c.ghl||{};
  const header=function(right){
    return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px">'

      +'<div style="display:flex;gap:8px;align-items:center">'+(right||'')+'</div></div>';
  };

  // 1) Falta proxy
  if(!proxy.url||!proxy.secret){
    el.innerHTML=header('<button class="btn btn-primary" onclick="openGhlProxyModal()">Configurar conexion GHL</button>')
      +'<div class="empty"><div class="empty-icon"></div><div>Primero conecta GHL.</div>'

    return;
  }
  // 2) Falta config del cliente
  if(!c.ghl.token||!c.ghl.locationId){
    el.innerHTML=header('<button class="btn btn-sm" onclick="openGhlProxyModal()">Conexion</button>')
      +'<div style="max-width:560px">'
      +'<div style="font-size:12px;color:var(--text3);margin-bottom:10px">Carga el token (pit-) y el Location ID de la subcuenta de <b style="color:var(--strong)">'+esc(c.name)+'</b> en GHL.</div>'
      +'<label style="font-size:11px;color:var(--text3)">API token de la subcuenta (pit-...)</label>'
      +'<input id="cli-ghl-token" type="text" value="'+esc(c.ghl.token||'')+'" placeholder="pit-xxxxxxxx" style="width:100%;margin:4px 0 12px;padding:9px 11px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--strong);font-family:var(--font);outline:none">'
      +'<label style="font-size:11px;color:var(--text3)">Location ID</label>'
      +'<input id="cli-ghl-location" type="text" value="'+esc(c.ghl.locationId||'')+'" placeholder="Settings - Business Info - Location ID" style="width:100%;margin:4px 0 14px;padding:9px 11px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--strong);font-family:var(--font);outline:none">'
      +'<button class="btn btn-primary" onclick="saveClientGhl('+c.id+')">Guardar y sincronizar</button>'
      +'</div>';
    return;
  }

  // 3) Configurado: auto-sync una vez por sesion (con seguro anti-loop, igual que Meta)
  window._ghlAutoSynced=window._ghlAutoSynced||{};
  const _staleMs=30*60*1000; // 30 min
  const _lastSyncMs=c.ghl.lastSync?new Date(c.ghl.lastSync).getTime():0;
  const _isStale=(Date.now()-_lastSyncMs)>_staleMs;
  if(!c.ghl._syncing && !window._ghlAutoSynced[c.id] && _isStale){
    window._ghlAutoSynced[c.id]=true;
    syncGhl(c.id, true);
  }

  const ops=c.ghl.opportunities||[];

  // --- Reglas de negocio derivadas del Stage (configurables desde "Reglas") ---
  const _rules=getGhlRules(c);
  const SQL_STAGES=_rules.sql.length?_rules.sql:['tomando decision','nda','segunda llamada'];
  let _autoSqlChanged=false;
  ops.forEach(function(o){
    const stageN=_n(o.pipelineStage);
    if(SQL_STAGES.indexOf(stageN)>=0 && !o._sql){ o._sql=true; _autoSqlChanged=true; }
  });
  if(_autoSqlChanged) save();

  const _unseen=vtaUnseenCount(c);
  const right=(c.ghl._syncing?'<span style="font-size:11px;color:var(--text3)">sincronizando...</span>':'<span style="font-size:11px;color:var(--text3)">'+_ghlAgo(c.ghl.lastSync)+'</span>')
    +'<button class="btn btn-sm" onclick="openVtaChangesModal('+c.id+')" title="Novedades desde tu ultima visita" style="position:relative'+(_unseen?';border-color:rgba(29,158,117,0.5)':'')+'">\u{1F514}'
    +(_unseen?'<span style="position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--on-accent);font-size:9.5px;font-weight:600;border-radius:9px;padding:1px 5px;line-height:1.3">'+(_unseen>99?'99+':_unseen)+'</span>':'')
    +'</button>'
    +'<button class="btn btn-sm" onclick="syncGhl('+c.id+',false)">Sincronizar</button>'
    +'<button class="btn btn-sm" onclick="saveClientGhl('+c.id+')" style="display:none"></button>'
    +'<button class="btn btn-sm" onclick="openColSelector()">Columnas</button>'
    +'<button class="btn btn-sm" onclick="openGhlRulesModal()">Reglas</button>';

  if(!ops.length){
    el.innerHTML=header(right)+'<div class="empty"><div class="empty-icon"></div><div>'+(c.ghl._syncing?'Sincronizando...':'Sin oportunidades sincronizadas todavia.')+'</div></div>';
    return;
  }

  // ================= Metricas (hairline · TOF/MOF/BOF) =================
  const money=function(n){return '$'+(Math.round((n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});};

  // --- Helpers de atribucion (anuncio / embudo / pais) ---
  const faGet=function(fa,names){
    if(!fa) return ''; var keys=Object.keys(fa); var i,j;
    for(i=0;i<names.length;i++){ for(j=0;j<keys.length;j++){ if(keys[j].toLowerCase().trim()===names[i]) return fa[keys[j]]; } }
    for(j=0;j<keys.length;j++){ var kl=keys[j].toLowerCase(); for(i=0;i<names.length;i++){ if(kl.indexOf(names[i])>=0) return fa[keys[j]]; } }
    return '';
  };
  const _tzCountry=function(tz){
    tz=String(tz||'');
    if(/Argentina/i.test(tz)) return 'Argentina';
    if(/Mexico|Hermosillo|Monterrey|Cancun|Tijuana|Merida|Chihuahua|Mazatlan|Matamoros|Ojinaga|Bahia_Banderas/i.test(tz)) return 'Mexico';
    if(/Bogota/i.test(tz)) return 'Colombia';
    if(/Lima/i.test(tz)) return 'Peru';
    if(/Santiago/i.test(tz)) return 'Chile';
    if(/Montevideo/i.test(tz)) return 'Uruguay';
    if(/Sao_Paulo|Bahia|Fortaleza|Recife|Manaus/i.test(tz)) return 'Brasil';
    if(/Guayaquil/i.test(tz)) return 'Ecuador';
    if(/Caracas/i.test(tz)) return 'Venezuela';
    if(/La_Paz/i.test(tz)) return 'Bolivia';
    if(/Asuncion/i.test(tz)) return 'Paraguay';
    if(/Madrid/i.test(tz)) return 'Espana';
    if(/Guatemala/i.test(tz)) return 'Guatemala';
    if(/Costa_Rica/i.test(tz)) return 'Costa Rica';
    return '';
  };
  const _adIdx=metaAdIndex(c);
  const adOf=function(o){
    var s=o.source||{};
    var raw=faGet(o.formAnswers,['utm_ad','utm ad']) || s.utmAd || s.utmContent || s.utmCampaign || s.utmSource || '';
    return resolveAdLabel(c, raw, _adIdx);
  };
  const geoOf=function(o){
    var tz=faGet(o.formAnswers,['timezone','time zone','zona horaria']);
    if(tz){ var parts=String(tz).split('/'); var city=parts[parts.length-1].replace(/_/g,' '); var loc=[city,_tzCountry(tz)].filter(Boolean).join(', '); if(loc) return loc; }
    var g=o.geo||{};
    if(g.location) return g.location;
    if(g.timezone){ var tzParts=String(g.timezone).split('/'); return tzParts[tzParts.length-1].replace(/_/g,' '); }
    return [g.city,g.state,g.country].filter(function(x){return x && x!=='US';}).join(', ') || g.country || '';
  };
  const paisOf=function(o){
    var tz=faGet(o.formAnswers,['timezone','time zone','zona horaria']) || (o.geo&&o.geo.timezone) || '';
    var ctry=_tzCountry(tz);
    if(ctry) return ctry;
    var g=o.geo||{};
    if(g.country && g.country!=='US') return g.country;
    if(g.location){ var parts=String(g.location).split(','); var last=parts[parts.length-1].trim(); if(last) return last; }
    return '';
  };
  const fuenteOf=function(o){
    if(!o.source) return '';
    var ref=(o.source.referrer||'').toLowerCase();
    var src=(o.source.utmSource||'').toLowerCase();
    var isMeta=src==='meta'||src==='facebook'||src==='instagram';
    var isFbRef=ref.indexOf('facebook.com')>=0||ref.indexOf('instagram.com')>=0||ref.indexOf('l.facebook')>=0;
    var isLanding=ref.length>0&&!isFbRef&&(ref.indexOf('http')===0);
    if(isLanding&&isMeta) return 'Landing (Meta)';
    if(isLanding) return 'Landing';
    if(isMeta||isFbRef) return 'Meta';
    if(src) return o.source.utmSource;
    if(o.formAnswers&&(o.formAnswers['Lead Source']||o.formAnswers['source'])) return o.formAnswers['Lead Source']||o.formAnswers['source'];
    return '';
  };

  // Campana de Meta del lead: utm_campaign directo, o deducida matcheando el anuncio del lead
  // (adId / utm_ad / utm_adset) contra el arbol campanas->adsets->ads sincronizado en Ads & Guiones.
  const _campNames={};     // campaignId -> nombre
  const _adToCamp={};      // adId / adsetId / nombre normalizado -> nombre de campana
  const _adNamePairs=[];   // para match aproximado por nombre
  (function(){
    var al=getActiveLine(c.conversionLines||[]);
    ((al&&al.metaCampaigns)||[]).forEach(function(cp){
      var cname=cp.name||String(cp.id);
      _campNames[String(cp.id)]=cname;
      _adToCamp['n:'+_n(cname)]=cname;
      ((cp.adsets)||[]).forEach(function(as){
        if(as.id) _adToCamp[String(as.id)]=cname;
        if(as.name){ _adToCamp['n:'+_n(as.name)]=cname; _adNamePairs.push({n:_n(as.name),camp:cname}); }
        ((as.ads)||[]).forEach(function(ad){
          if(ad.id) _adToCamp[String(ad.id)]=cname;
          if(ad.name){ _adToCamp['n:'+_n(ad.name)]=cname; _adNamePairs.push({n:_n(ad.name),camp:cname}); }
        });
      });
    });
  })();
  const campaignOf=function(o){
    var s=o.source||{};
    var raw=String(faGet(o.formAnswers,['utm_campaign','campaign'])||s.utmCampaign||'').trim();
    if(raw) return _campNames[raw]||raw;
    var cands=[s.adId, s.utmAd, s.utmContent, s.utmAdset,
      faGet(o.formAnswers,['utm_ad','utm ad']), faGet(o.formAnswers,['utm_adset'])];
    for(var i=0;i<cands.length;i++){
      var v=String(cands[i]||'').trim();
      if(!v) continue;
      if(_adToCamp[v]) return _adToCamp[v];               // match por ID exacto
      var vn=_n(v);
      if(_adToCamp['n:'+vn]) return _adToCamp['n:'+vn];   // match por nombre exacto
      if(vn.length>=4){                                    // match aproximado (contiene)
        for(var j=0;j<_adNamePairs.length;j++){
          var p=_adNamePairs[j];
          if(p.n.indexOf(vn)>=0||vn.indexOf(p.n)>=0) return p.camp;
        }
      }
    }
    return '';
  };

  // --- Periodo ---
  const period=S.ventasPeriod||'todo';
  const _now=new Date();
  const inPeriod=function(o){
    if(period==='todo') return true;
    if(!o.createdAt) return false;
    var d=new Date(o.createdAt);
    if(period==='mes') return d.getFullYear()===_now.getFullYear()&&d.getMonth()===_now.getMonth();
    if(period==='30d') return (_now-d)<=30*86400000;
    if(period==='custom'){ const cr=_customRange(); return cr?(d>=cr.from&&d<=cr.to):true; }
    return true;
  };
  const opsP=ops.filter(inPeriod);

  // --- Vista (anuncio / embudo / pais) y segmento activo ---
  const view=S.ventasView||'anuncios';
  const adsetOf=function(o){ return _deriveAdset(c,o); };
  const placementOf=function(o){ return _derivePlacement(c,o); };
  const keyOf=view==='embudo'?campaignOf:(view==='pais'?paisOf:(view==='adset'?adsetOf:(view==='placement'?placementOf:adOf)));
  const segMap={};
  opsP.forEach(function(o){var k=keyOf(o)||'(sin dato)';segMap[k]=(segMap[k]||0)+1;});
  const segKeys=Object.keys(segMap).sort(function(a,b){return segMap[b]-segMap[a];}).slice(0,10);
  let seg=S.ventasSeg;
  if(seg && segKeys.indexOf(seg)<0){ seg=null; S.ventasSeg=null; }
  let opsSeg=seg? opsP.filter(function(o){return (keyOf(o)||'(sin dato)')===seg;}) : opsP;
  // cruce campana x pais: ademas del segmento de campana, filtrar por pais del contacto
  if(view==='embudo'&&seg&&S.ventasPais){
    opsSeg=opsSeg.filter(function(o){
      var pc=paisOf(o);
      return _n(pc)===_n(S.ventasPais);
    });
  }

  // --- Metricas del subset segun reglas de stages ---
  const cntStages=function(sub,arr){ if(!arr.length) return null; return sub.filter(function(o){return arr.indexOf(_n(o.pipelineStage))>=0;}).length; };
  const m_agendas=cntStages(opsSeg,_rules.agendas);
  const m_asis=cntStages(opsSeg,_rules.asistencias);
  const m_noshow=cntStages(opsSeg,_rules.noShows);
  const m_pres=cntStages(opsSeg,_rules.presentaciones);
  const m_viva=cntStages(opsSeg,_rules.llamadaEnVivo);
  const m_sql=opsSeg.filter(function(o){return o._sql;}).length;
  const m_ganadosArr=opsSeg.filter(function(o){return deriveEstado(o).label==='Ganado';});
  const m_ganados=m_ganadosArr.length;
  const m_perdidos=opsSeg.filter(function(o){return deriveEstado(o).label==='Perdido';}).length;
  const m_revenue=m_ganadosArr.reduce(function(s,o){return s+(Number(o.monetaryValue)||0);},0);
  const m_pipeline=opsSeg.reduce(function(s,o){return s+(Number(o.monetaryValue)||0);},0);
  const m_pend=(m_agendas!=null&&m_asis!=null)?Math.max(0,m_agendas-m_asis-(m_noshow||0)):null;
  const pctS=function(a,b){return (a==null||!b)?null:(Math.round(a/b*1000)/10)+'%';};

  // Time to cierre (requiere updatedAt del Apps Script)
  const wonWithDates=m_ganadosArr.filter(function(o){return o.createdAt&&o.updatedAt;});
  const avgTimeToClose=wonWithDates.length?Math.round(wonWithDates.reduce(function(s,o){return s+((new Date(o.updatedAt)-new Date(o.createdAt))/86400000);},0)/wonWithDates.length*10)/10:null;
  const timeToCierreNeedsSetup=m_ganados>0&&wonWithDates.length===0;

  // --- Costos: la inversion no es segmentable, se calcula sobre todo el periodo ---
  if(!S.ventasSpendSource){
    try{ S.ventasSpendSource=localStorage.getItem('evold-ventas-spend')||'live'; }catch(e){ S.ventasSpendSource='live'; }
  }
  const spendSource=S.ventasSpendSource;
  // Ventana del periodo seleccionado (null = sin limite)
  let _pFrom=null;
  let _pTo=null;
  if(period==='mes') _pFrom=new Date(_now.getFullYear(),_now.getMonth(),1);
  else if(period==='30d') _pFrom=new Date(_now-30*86400000);
  else if(period==='custom'){ const cr=_customRange(); if(cr){ _pFrom=cr.from; _pTo=cr.to; } }
  const _lineOverlaps=function(l){
    if(!_pFrom&&!_pTo) return true;
    var s=l.dateStart?new Date(l.dateStart):null;
    var e=l.dateEnd?new Date(l.dateEnd):null;
    if(_pFrom&&e&&e<_pFrom) return false;
    if(_pTo&&s&&s>_pTo) return false;
    return true;
  };
  // Fuente Lineas: suma de lineas que tocan el periodo
  const accSpentLineas=(c.conversionLines||[]).filter(_lineOverlaps).reduce(function(s,l){return s+(Number(l.metrics&&l.metrics.adSpent)||0);},0);
  // Fuente Tiempo real: inversion pedida a Meta para el MISMO rango del periodo,
  // sumando SOLO las campanas incluidas (checkboxes de Ads & Guiones)
  const metaConfigured=!!(c.metaToken&&c.metaAccountId);

function applyMetaRange(clientId){
  const c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  const al=getActiveLine(c.conversionLines||[]); if(!al) return;
  const from=(document.getElementById('mr-from')||{}).value||'';
  const to=(document.getElementById('mr-to')||{}).value||'';
  const err=document.getElementById('mr-err');
  if(!from||!to){ if(err) err.textContent='Elegi ambas fechas'; return; }
  if(new Date(from)>new Date(to)){ if(err) err.textContent='La fecha "desde" no puede ser posterior a "hasta"'; return; }
  al.metaDays='custom'; al.metaSince=from; al.metaUntil=to;
  save(); closeModal(); syncMetaAds(clientId);
}

function changeMetaDays(clientId, days){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  var activeLine=c.conversionLines&&getActiveLine(c.conversionLines);
  if(!activeLine) return;
  if(days==='custom'){
    if(!activeLine.metaSince){
      var now=new Date();
      activeLine.metaUntil=now.toISOString().slice(0,10);
      activeLine.metaSince=new Date(now-30*24*60*60*1000).toISOString().slice(0,10);
    }
    openMetaRangeModal(clientId);
    return;
  }
  activeLine.metaDays=(days==='max')?'max':parseInt(days);
  save();
  syncMetaAds(clientId);
}

// Indice de todo el arbol de Meta: id -> nombre, para anuncios, adsets y campanas.
// Sirve para los clientes donde el utm_ad se cargo con el ID numerico del anuncio
// en vez de su nombre (o quedo apuntando al adset / campana).
// Recorre TODAS las lineas, no solo la activa: las oportunidades viejas referencian
// anuncios de lineas anteriores.
function metaAdIndex(c){
  var idx={ads:{},adsets:{},camps:{}};
  (c.conversionLines||[]).forEach(function(l){
    ((l.metaCampaigns)||[]).forEach(function(cp){
      if(cp&&cp.id&&cp.name) idx.camps[String(cp.id)]=cp.name;
      ((cp.adsets)||[]).forEach(function(as){
        if(as&&as.id&&as.name) idx.adsets[String(as.id)]=as.name;
        ((as.ads)||[]).forEach(function(ad){
          if(ad&&ad.id&&ad.name) idx.ads[String(ad.id)]=ad.name;
        });
      });
    });
  });
  return idx;
}
// Traduce un valor de utm_ad al nombre real. Si no es un ID conocido, lo devuelve tal cual.
function resolveAdLabel(c, raw, idx){
  var s=String(raw===null||raw===undefined?'':raw).trim();
  if(!s) return '';
  idx=idx||metaAdIndex(c);
  return idx.ads[s]||idx.adsets[s]||idx.camps[s]||s;
}

// Mapa de "wins" por anuncio: cuenta calificados y cierres cruzando las oportunidades de GHL
// (por nombre de anuncio normalizado) y marca al ganador (el de mas cierres, o mas calificados).
function adWinsMap(c){
  var map={};
  var ops=(c.ghl&&c.ghl.opportunities)||[];
  if(!ops.length) return map;
  // Misma logica que usa la vista de ventas: calificados por reglas del cliente, ganados por deriveEstado
  var rules=(typeof getGhlRules==='function')?getGhlRules(c):{};
  var SQLS=(rules.sql&&rules.sql.length)?rules.sql:['tomando decision','nda','segunda llamada'];
  var isSql=function(o){ return o._sql||SQLS.indexOf(_n(o.pipelineStage))>=0; };
  var isWon=function(o){
    if(typeof deriveEstado==='function'){ try{ return deriveEstado(o).label==='Ganado'; }catch(e){} }
    return o.status==='won';
  };
  var idx=metaAdIndex(c);
  ops.forEach(function(o){
    var s=o.source||{};
    var fa=o.formAnswers||{};
    var adName=fa['utm_ad']||fa['utm ad']||s.utmAd||s.utmContent||'';
    var k=_n(resolveAdLabel(c, adName, idx));
    if(!k) return;
    if(!map[k]) map[k]={calif:0,cierres:0,winner:false};
    if(isSql(o)) map[k].calif++;
    if(isWon(o)) map[k].cierres++;
  });
  // Ganadores: todos los que tienen al menos 1 cierre. Si ninguno cerro, el de mas calificados.
  var hayCierres=false;
  for(var k1 in map){ if(map[k1].cierres>0){ map[k1].winner=true; hayCierres=true; } }
  if(!hayCierres){
    var bestKey=null, bestQ=0;
    for(var k2 in map){ if(map[k2].calif>bestQ){ bestQ=map[k2].calif; bestKey=k2; } }
    if(bestKey) map[bestKey].winner=true;
  }
  // Alias por ID: asi el lookup funciona tanto por nombre como por id del anuncio.
  Object.keys(idx.ads).forEach(function(id){
    var kn=_n(idx.ads[id]);
    if(map[kn]&&!map[id]) map[id]=map[kn];
  });
  return map;
}

// ---------- Datos del laboratorio ----------
function getLab(c){
  c.guionLab=c.guionLab||{baseAdId:'',analisis:null,angulos:[],drafts:[]};
  return c.guionLab;
}
function labAdsDisponibles(c){
  var out=[], wins=(typeof adWinsMap==='function')?adWinsMap(c):{};
  // La linea ACTIVA va primero. Un mismo anuncio puede existir en varias lineas,
  // y nos quedamos con la primera aparicion: si arrancaramos por una linea vieja,
  // ganaria una version sincronizada antes y sin los campos nuevos (retencion de
  // video, por ejemplo). Ese era el motivo de que el analisis no viera la curva.
  var lineas=(c.conversionLines||[]).slice();
  var activa=(typeof getActiveLine==='function')?getActiveLine(lineas):null;
  if(activa){
    lineas.sort(function(a,b){ return (a===activa?-1:0)-(b===activa?-1:0); });
  }
  lineas.forEach(function(l){
    (l.metaCampaigns||[]).forEach(function(camp){
      (camp.adsets||[]).forEach(function(as){
        (as.ads||[]).forEach(function(ad){
          if(!ad||!ad.id) return;
          for(var i=0;i<out.length;i++){ if(out[i].id===ad.id) return; }
          var w=wins[_n(ad.name||'')]||{calif:0,cierres:0,winner:false};
          out.push({id:ad.id,name:ad.name||ad.id,camp:camp.name||'',adset:as.name||'',m:ad,win:w});
        });
      });
    });
  });
  out.sort(function(a,b){
    return (b.win.cierres-a.win.cierres)||(b.win.calif-a.win.calif)||((b.m.leads||0)-(a.m.leads||0));
  });
  return out;
}
function labFreq(m){
  var f=Number(m.frequency)||0;
  if(!f && Number(m.reach)>0) f=Number(m.impressions||0)/Number(m.reach);
  return f;
}
function labAdBase(c){
  var lab=getLab(c), ads=labAdsDisponibles(c);
  if(!ads.length) return null;
  if(lab.baseAdId){
    for(var i=0;i<ads.length;i++){ if(ads[i].id===lab.baseAdId) return ads[i]; }
  }
  for(var j=0;j<ads.length;j++){ if(ads[j].win.winner) return ads[j]; }
  return ads[0];
}
function labContextoAnuncio(c,a){
  var m=a.m||{}, f=labFreq(m);
  var g=(c.adScriptsByAd&&c.adScriptsByAd[a.id])||{};
  var L=[];
  L.push('Anuncio: '+a.name);
  L.push('Campana: '+(a.camp||'-')+' | Adset: '+(a.adset||'-'));
  L.push('Gasto: $'+(Number(m.spend)||0).toFixed(2));
  L.push('Impresiones: '+(m.impressions||0)+' | Alcance: '+(m.reach||0));
  L.push('Frecuencia: '+(f?f.toFixed(2):'sin dato'));
  L.push('CTR: '+(m.ctr||'-')+'% | CPC: $'+(m.cpc||'-')+' | CPM: $'+(m.cpm||'-'));
  L.push('Leads: '+(m.leads||0)+' | Costo por lead: $'+(m.cpl||'-'));
  L.push('ThruPlays: '+(m.thruPlays||0)+(m.costPerThruPlay?(' | costo por thruplay: $'+m.costPerThruPlay):''));
  // Curva de retencion: es lo unico que dice DONDE del guion se pierde la gente.
  // El CPL dice que algo esta mal; esto dice en que segundo.
  if(m.videoPlays){
    L.push('--- Retencion del video ---');
    L.push('Reproducciones: '+m.videoPlays+(m.avgWatch?(' | tiempo promedio de visualizacion: '+m.avgWatch+' s'):''));
    L.push('Llegaron al 25%: '+(m.ret25||'?')+'% | al 50%: '+(m.ret50||'?')+'% | al 75%: '+(m.ret75||'?')+'% | al final: '+(m.ret100||'?')+'%');
    var r25=Number(m.ret25||0), r50=Number(m.ret50||0), r100=Number(m.ret100||0);
    if(r25 && r25<40) L.push('LECTURA: se cae mas del 60% antes del primer cuarto: el problema esta en el hook o en los primeros segundos.');
    else if(r25 && r50 && (r25-r50)>25) L.push('LECTURA: el hook retiene pero se desploma en el desarrollo: el medio del guion es el problema, no la apertura.');
    else if(r100 && r100<5) L.push('LECTURA: casi nadie llega al final: revisar largo y ubicacion del CTA.');
  }
  L.push('Vistas de landing: '+(m.landingViews||0));
  L.push('--- Resultado real en el CRM, no en Meta ---');
  L.push('Leads calificados: '+(a.win.calif||0)+' | Cierres: '+(a.win.cierres||0));
  L.push(a.win.winner?'Marcado como GANADOR por resultado de negocio.':'No es el ganador actual.');
  if(g.guion){ L.push('--- Guion actual de este anuncio ---'); L.push(g.guion); }
  else { L.push('(No hay guion cargado para este anuncio: el analisis va a ser solo sobre metricas.)'); }
  if(g.notas) L.push('Notas del guion: '+g.notas);
  return L.join('\n');
}
// Anuncios que tienen guion cargado, con sus metricas y su curva de retencion.
// Sin esto el analisis ve cada anuncio como una pieza suelta y no puede saber
// que dos creativos comparten hook y solo difieren en el cierre.
function labContextoVariantes(c, base){
  var ads=labAdsDisponibles(c).filter(function(a){
    var g=(c.adScriptsByAd&&c.adScriptsByAd[a.id])||{};
    return !!g.guion;
  });
  if(ads.length<2) return '';
  // Los mas relevantes primero: por cierres, calificados y volumen
  ads.sort(function(x,y){
    return (y.win.cierres-x.win.cierres)||(y.win.calif-x.win.calif)||((y.m.leads||0)-(x.m.leads||0));
  });
  return ads.slice(0,10).map(function(a){
    var m=a.m||{}, g=c.adScriptsByAd[a.id];
    var L=[];
    L.push('### '+a.name+(a.id===base.id?'  <-- ES EL ANUNCIO BASE':''));
    L.push('CTR '+(m.ctr||'-')+'% | CPL $'+(m.cpl||'-')+' | leads '+(m.leads||0)
      +' | calificados '+(a.win.calif||0)+' | cierres '+(a.win.cierres||0));
    if(m.videoPlays){
      L.push('Retencion: 25% -> '+(m.ret25||'?')+'% | 50% -> '+(m.ret50||'?')+'% | final -> '+(m.ret100||'?')
        +'% | tiempo promedio '+(m.avgWatch||'?')+'s');
    }
    L.push('GUION:');
    L.push(String(g.guion).replace(/\s+/g,' ').slice(0,700));
    return L.join('\n');
  }).join('\n\n');
}

function labContextoCompetencia(c,base){
  var ads=labAdsDisponibles(c).filter(function(a){return a.id!==base.id;}).slice(0,6);
  if(!ads.length) return '(No hay otros anuncios para comparar.)';
  return ads.map(function(a){
    var m=a.m||{};
    return '- '+a.name+': CPL $'+(m.cpl||'-')+' | CTR '+(m.ctr||'-')+'% | leads '+(m.leads||0)
      +' | calificados '+(a.win.calif||0)+' | cierres '+(a.win.cierres||0)+' | frecuencia '+(labFreq(m)?labFreq(m).toFixed(2):'-');
  }).join('\n');
}

// ---------- Llamada a la IA ----------
async function labIA(prompt, maxTokens){
  var apiKey=localStorage.getItem('evold-anthropic-key');
  if(!apiKey) throw new Error('Falta la API key de Anthropic. Cargala en Integraciones.');
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:maxTokens||1600,messages:[{role:'user',content:prompt}]})
  });
  var d=await r.json();
  if(d.error) throw new Error(d.error.message||'Error de la API');
  window._labStop=d.stop_reason||'';
  return (d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').trim();
}
function labBusy(id,on,label){
  var b=document.getElementById(id); if(!b) return;
  b.disabled=!!on; if(label) b.textContent=label;
}

// ---------- Paso 1: analisis ----------
async function labAnalizar(clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var lab=getLab(c), base=labAdBase(c);
  if(!base){ toast('No hay anuncios sincronizados de Meta','red'); return; }
  labBusy('lab-btn-analisis',true,'Analizando...');
  var sop=sopCombinado(c);
  var prompt=(sop?sop+'\n\n':'')
    +'Sos analista de performance creativa en una agencia. Analiza este anuncio para decidir como reemplazarlo o competirle.\n\n'
    +'=== ANUNCIO BASE ===\n'+labContextoAnuncio(c,base)+'\n\n'
    +'=== OTROS ANUNCIOS DE LA CUENTA ===\n'+labContextoCompetencia(c,base)+'\n\n'
    +(function(){
      var v=labContextoVariantes(c,base);
      return v?('=== GUIONES CARGADOS (para comparar componentes) ===\n'+v+'\n\n'):'';
    })()
    +'Devolve un analisis breve y filoso en texto plano (sin markdown, sin titulos con #), con estas cuatro partes separadas por una linea en blanco:\n'
    +'1. QUE ESTA FUNCIONANDO: que hace bien este anuncio y por que, apoyandote en los numeros.\n'
    +'2. SENALES DE FATIGA: leer la frecuencia, el CTR y el CPL. Si la frecuencia supera 2.5 decilo explicito. Si no hay senales de desgaste, decilo igual de claro en vez de inventarlas.\n'
    +'3. LA BRECHA META vs CRM: comparar volumen de leads contra calificados y cierres. Si trae muchos leads que no califican, ese es el problema principal y hay que decirlo.\n'
    +'4. QUE ATACAR EN EL PROXIMO CREATIVO: la recomendacion concreta.\n\n'
    +'Si hay datos de retencion de video, usalos para decir EN QUE PARTE del guion se pierde la gente '
    +'(apertura, desarrollo o cierre) en vez de hablar del creativo en general. Es el dato mas accionable que tenes.\n\n'
    +'Si te pasaron guiones cargados, agrega una quinta parte:\n'
    +'5. QUE COMPONENTE EXPLICA LA DIFERENCIA: mira los guiones y agrupa los anuncios que comparten hook, '
    +'cuerpo o cierre (la nomenclatura de los nombres suele delatarlo, y el texto lo confirma). Despues deci '
    +'que componente mueve la aguja: si todos los que comparten un hook retienen parecido sin importar el '
    +'cierre, el hook manda; si con el mismo hook cambia mucho la calificacion, manda el cuerpo o el CTA. '
    +'Se explicito sobre que variantes se probaron y cuales NO: si nunca se testeo un hook alternativo, decilo, '
    +'porque es la variable sin explorar. Si no alcanzan los datos para separar el efecto de cada componente, '
    +'decilo en vez de inventar una conclusion.\n\n'
    +'Se concreto y usa los numeros reales. No repitas el brief. Maximo 300 palabras.';
  try{
    var txt=await labIA(prompt,3500);
    // Si el modelo corto a mitad de frase, es mejor decirlo que dejar el texto colgado.
    if(txt && !/[.!?\]]\s*$/.test(txt.trim())){
      txt+='\n\n[El analisis se corto por limite de longitud. Volve a analizar o acorta el SOP.]';
    }
    lab.analisis={texto:txt,ts:new Date().toISOString(),adId:base.id,adName:base.name};
    lab.angulos=[];
    save(); renderTab(); toast('Analisis listo');
  }catch(e){ toast('Error: '+e.message,'red'); labBusy('lab-btn-analisis',false,'Analizar anuncio base'); }
}

// ---------- Paso 2: angulos ----------
async function labAngulos(clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var lab=getLab(c), base=labAdBase(c);
  if(!base){ toast('No hay anuncio base','red'); return; }
  labBusy('lab-btn-angulos',true,'Generando...');
  var sop=sopCombinado(c);
  var prompt=(sop?sop+'\n\n':'')
    +'Sos estratega creativo. Necesito angulos nuevos para competirle al anuncio ganador (o reemplazarlo si se quemo la frecuencia).\n\n'
    +'=== ANUNCIO BASE ===\n'+labContextoAnuncio(c,base)+'\n\n'
    +(lab.analisis&&lab.analisis.texto?('=== ANALISIS PREVIO ===\n'+lab.analisis.texto+'\n\n'):'')
    +'Propone 4 angulos DISTINTOS entre si. No variaciones del mismo hook: angulos con tesis diferentes '
    +'(distinto dolor, distinto momento del buyer, distinto enemigo, distinta prueba). Al menos uno tiene que ser '
    +'deliberadamente arriesgado o contraintuitivo.\n\n'
    +'Cada campo, maximo 25 palabras. Se breve: la respuesta tiene que entrar completa.\n'
    +'Responde SOLO con un array JSON valido, sin markdown ni texto alrededor:\n'
    +'[{"titulo":"nombre corto del angulo","tesis":"la idea central en una frase","hook":"el gancho literal de los primeros 3 segundos","porQue":"por que deberia funcionar segun los datos","riesgo":"que puede salir mal"}]';
  try{
    var txt=await labIA(prompt,3000);
    // Mismo recorte robusto que el analisis: del primer [ al ultimo ]. Si no hay

    var ini=txt.indexOf('['), fin=txt.lastIndexOf(']');
    if(ini<0||fin<=ini){

    }
    var arr=JSON.parse(txt.slice(ini,fin+1));
    lab.angulos=arr.map(function(a,i){ return {id:'ang'+Date.now()+'_'+i,titulo:a.titulo||'Angulo '+(i+1),tesis:a.tesis||'',hook:a.hook||'',porQue:a.porQue||'',riesgo:a.riesgo||''}; });

      const _o=document.getElementById('cvt-out');
      if(_o) _o.innerHTML='<button class="btn btn-sm" onclick="convVerRaw()">Ver respuesta cruda</button>';
    }
    labBusy('lab-btn-angulos',false,'Generar angulos');
  }
}

  try{

    lab.drafts.unshift({
      id:'d'+Date.now(), ts:new Date().toISOString(),
      angulo:ang.titulo, hook:ang.hook, guion:txt,
      baseAdId:base.id, baseAdName:base.name,
      estado:'borrador', adIdProd:'', notas:''
    });
    save(); renderTab(); toast('Guion generado y guardado como borrador');
  }catch(e){ toast('Error: '+e.message,'red'); labBusy('lab-w-'+angId,false,'Escribir guion'); }
}

// ---------- Borradores ----------
function labDraftEstado(clientId,draftId,estado){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var lab=getLab(c);
  (lab.drafts||[]).forEach(function(d){ if(d.id===draftId){ d.estado=estado; if(estado!=='produccion') d.adIdProd=''; } });
  save(); renderTab();
}
function labDraftBorrar(clientId,draftId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var lab=getLab(c);
  lab.drafts=(lab.drafts||[]).filter(function(d){return d.id!==draftId;});
  save(); renderTab(); toast('Borrador eliminado');
}
function labDraftVincular(clientId,draftId){

    +'<select id="lab-link-ad" style="width:100%;padding:9px 11px;font-size:12.5px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:var(--font);outline:none">'+opts+'</select>'
    +'<div style="display:flex;gap:8px;margin-top:18px">'

function labDraftVincularOk(clientId,draftId){

  var adId=(document.getElementById('lab-link-ad')||{}).value||'';
  var lab=getLab(c);
  (lab.drafts||[]).forEach(function(d){ if(d.id===draftId){ d.adIdProd=adId; d.estado='produccion'; } });
  save(); closeModal(); renderTab(); toast('Guion vinculado - ahora podes medir si funciono');
}
function labVerDraft(clientId,draftId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var d=null; (getLab(c).drafts||[]).forEach(function(x){ if(x.id===draftId) d=x; });
  if(!d) return;
  document.getElementById('modal-root').innerHTML=''
    +'<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'
    +'<div class="modal" style="max-width:680px;width:94%;max-height:86vh;overflow:auto">'
    +'<div style="font-size:15px;font-weight:600;color:var(--strong);margin-bottom:2px">'+esc(d.angulo)+'</div>'
    +'<div style="font-size:11.5px;color:var(--text3);margin-bottom:16px">Generado el '+new Date(d.ts).toLocaleString('es-AR')+' &middot; base: '+esc(d.baseAdName||'-')+'</div>'
    +'<div style="font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px">'+esc(d.guion)+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:16px">'
    +'<button class="btn btn-primary" onclick="labCopiar(\''+_jsEsc(draftId)+'\','+clientId+')">Copiar guion</button>'
    +'<button class="btn" onclick="closeModal()">Cerrar</button>'

}
function labCopiar(draftId,clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  var d=null; (getLab(c).drafts||[]).forEach(function(x){ if(x.id===draftId) d=x; });
  if(!d) return;
  try{ navigator.clipboard.writeText(d.guion); toast('Guion copiado'); }
  catch(e){ toast('No se pudo copiar','red'); }
}

    h+='<div class="empty"><div class="empty-icon"></div><div>Sincroniza Meta para traer los anuncios y arrancar.</div></div>';

  }

  // Ficha del anuncio base
  var m=base.m||{}, f=labFreq(m);
  var chip=function(l,v,warn){

            +'Corriendo como <strong style="color:var(--text)">'+esc(real.name)+'</strong> &middot; '

    h+='<div style="font-size:11.5px;color:var(--text3);margin-top:12px;line-height:1.6">Cuando un guion en produccion funcione (o fracase), entra al SOP y sumale lo que aprendiste. Ese es el punto: que el SOP mejore con evidencia.</div>';

  el.innerHTML=h;

// Celda de la columna "Guion" en la tabla de Meta. Solo editable en filas de anuncio (ad!=null).
function _guionCell(c,ad,w,isWinner){
  var base='flex-shrink:0;width:'+w+'px;height:52px;display:flex;align-items:center;padding:0 10px;border-left:0.5px solid var(--border);border-bottom:0.5px solid var(--border);font-size:12px'+(isWinner?';background:rgba(29,158,117,0.06)':'');
  if(!ad||!ad.id){ return '<div style="'+base+';color:var(--text3)"></div>'; }
  var g=(c.adScriptsByAd&&c.adScriptsByAd[ad.id]&&c.adScriptsByAd[ad.id].guion)||'';
  if(g){
    var preview=g.length>60?g.slice(0,60)+'...':g;
    return '<div style="'+base+';cursor:pointer;gap:6px" onclick="openGuionModal('+c.id+',\''+_jsEsc(ad.id)+'\')" title="Ver / editar guion">'
      +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)">'+esc(preview)+'</span>'
      +'<span style="font-size:10px;color:var(--accent);flex-shrink:0">editar</span>'
      +'</div>';
  }
  return '<div style="'+base+'">'
    +'<button class="btn btn-sm" style="font-size:11px;padding:3px 10px" onclick="openGuionModal('+c.id+',\''+_jsEsc(ad.id)+'\')">+ Pegar guion</button>'
    +'</div>';
}
function openGuionModal(clientId,adId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  // buscar el nombre del anuncio para mostrarlo
  var adName=adId;
  (c.conversionLines||[]).forEach(function(l){ (l.metaCampaigns||[]).forEach(function(camp){ (camp.adsets||[]).forEach(function(as){ (as.ads||[]).forEach(function(ad){ if(ad.id===adId&&ad.name) adName=ad.name; }); }); }); });
  var data=(c.adScriptsByAd&&c.adScriptsByAd[adId])||{};
  var guion=data.guion||'', notas=data.notas||'';
  document.getElementById('modal-root').innerHTML=''
    +'<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'
    +'<div class="modal" style="max-width:520px;width:92%">'
    +'<div style="font-size:15px;font-weight:600;color:var(--strong);margin-bottom:2px">Guion del anuncio</div>'
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:16px">'+esc(adName)+'</div>'
    +'<label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Guion / copy del anuncio</label>'
    +'<textarea id="guion-modal-text" rows="7" placeholder="Pega aca el texto del anuncio: hook, cuerpo, call to action..." style="width:100%;box-sizing:border-box;padding:10px 12px;font-size:13px;line-height:1.6;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:var(--font);resize:vertical;outline:none">'+esc(guion)+'</textarea>'
    +'<label style="font-size:11px;color:var(--text3);display:block;margin:12px 0 4px">Notas (opcional)</label>'
    +'<textarea id="guion-modal-notas" rows="2" placeholder="Ej: el hook funciona muy bien. Probar cambiar el CTA." style="width:100%;box-sizing:border-box;padding:10px 12px;font-size:13px;line-height:1.6;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-family:var(--font);resize:vertical;outline:none">'+esc(notas)+'</textarea>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-top:16px">'
    +(guion||notas?'<button class="btn btn-sm" style="color:var(--redx);margin-right:auto" onclick="deleteGuionAd('+clientId+',\''+_jsEsc(adId)+'\')">Borrar</button>':'<span style="margin-right:auto"></span>')
    +'<button class="btn btn-sm" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-sm btn-primary" onclick="saveGuionAd('+clientId+',\''+_jsEsc(adId)+'\')">Guardar</button>'
    +'</div></div></div>';
}
function saveGuionAd(clientId,adId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  if(!c.adScriptsByAd) c.adScriptsByAd={};
  var guion=(document.getElementById('guion-modal-text').value||'').trim();
  var notas=(document.getElementById('guion-modal-notas').value||'').trim();
  if(!guion&&!notas){ delete c.adScriptsByAd[adId]; }
  else { c.adScriptsByAd[adId]={guion:guion,notas:notas,updatedAt:new Date().toISOString()}; }
  save(); closeModal(); renderTab();
  if(typeof toast==='function') toast('Guion guardado');
}
function deleteGuionAd(clientId,adId){
  var c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  if(c.adScriptsByAd) delete c.adScriptsByAd[adId];
  save(); closeModal(); renderTab();
  if(typeof toast==='function') toast('Guion borrado');
}

// Modo compacto de la tabla de Meta: dibuja solo las campanas tildadas.
// Es una preferencia de vista, no toca las exclusiones ni las metricas.
function metaSoloIncluidas(){
  if(S._metaSoloIncl===undefined){
    try{ S._metaSoloIncl=localStorage.getItem('evold-meta-solo-incl')==='1'; }catch(e){ S._metaSoloIncl=false; }
  }
  return !!S._metaSoloIncl;
}
function toggleMetaSoloIncluidas(){
  S._metaSoloIncl=!metaSoloIncluidas();
  try{ localStorage.setItem('evold-meta-solo-incl', S._metaSoloIncl?'1':'0'); }catch(e){}
  renderTab();
}
function metaSoloIncluidasBtn(activeLine){
  var camps=(activeLine&&activeLine.metaCampaigns)||[];
  var excl=(activeLine&&activeLine.excludedCampaigns)||[];
  var fuera=camps.filter(function(x){return excl.indexOf(x.id)!==-1;}).length;
  if(!fuera) return ''; // si no hay ninguna destildada, el boton no aporta nada
  var on=metaSoloIncluidas();
  return '<button class="btn btn-sm" onclick="toggleMetaSoloIncluidas()" '
    +'style="font-weight:400;text-transform:none;margin-left:10px;font-size:10.5px;padding:2px 9px;'
    +(on?'border-color:var(--accent);color:var(--accent)':'color:var(--text3)')+'" '
    +'title="Muestra en la tabla solo las campanas tildadas. No cambia que campanas entran en las metricas.">'
    +(on?'ver las '+fuera+' ocultas':'ocultar '+fuera+' destildadas')+'</button>';
}

function metaRowMetrics(obj, isWinner){
  // _fxC lo setea el render de Ads: si el cliente tiene tasa cargada, las
  // columnas de dinero se muestran en USD igual que las tarjetas de arriba.
  var _c=window._fxC;
  return META_METRIC_COLS.map(function(col){
    var v=obj[col.key];
    if(col.money && _c && typeof fxActiva==='function' && fxActiva(_c)){
      var n=Number(v);
      if(isFinite(n) && n!==0) v=n/Number(getFx(_c).rate);
    }
    var disp=col.fmt(v);
    var style='flex-shrink:0;width:'+col.w+'px;height:52px;display:flex;align-items:center;padding:0 10px;border-left:0.5px solid var(--border);border-bottom:0.5px solid var(--border);font-size:12px';
    if(isWinner) style+=';background:rgba(29,158,117,0.06)';
    if(col.color&&disp!=='-') style+=';color:var(--accent)';
    if(col.bold) style+=';font-weight:500';
    return '<div style="'+style+'">'+disp+'</div>';
  }).join('');
}

// ================= MONEDA Y CONVERSION A USD =================
// La moneda sale de la API de Meta (c.metaCurrency), no se adivina.
// La tasa es MANUAL y a proposito: para ARS el dolar oficial no refleja lo que
// realmente te cuesta la pauta, y no hay una fuente confiable y estable del blue
// que se pueda consumir desde el navegador. Ademas, para cerrar un mes conviene
// fijar la tasa del periodo y que no cambie sola cada vez que abris la app.
function getFx(c){
  c.fx=c.fx||{rate:null,updatedAt:null,label:''};
  return c.fx;
}
function fxActiva(c){
  const f=getFx(c);
  return !!(f.rate && Number(f.rate)>0 && (c.metaCurrency||'')!=='USD');
}
// Convierte un monto de la moneda de la cuenta a USD. Si no hay tasa, no toca nada.
function aUsd(c, monto){
  if(!fxActiva(c)) return monto;
  const n=Number(monto);
  if(!isFinite(n)) return monto;
  return n/Number(getFx(c).rate);
}
function monedaLabel(c){
  const m=c.metaCurrency||'';
  if(!m) return 'moneda sin identificar';
  return m+(fxActiva(c)?(' \u2192 USD @ '+getFx(c).rate):'');
}

function guardarFx(clientId){
  const c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;

  f.label=((document.getElementById('fx-label')||{}).value||'').trim();
  f.updatedAt=new Date().toISOString();

  toast('Conversion activada: 1 USD = '+r+' '+(c.metaCurrency||''));
}
function borrarFx(clientId){
  const c=DB.clients.find(function(x){return x.id===clientId;}); if(!c) return;
  c.fx={rate:null,updatedAt:null,label:''};
  save(); closeModal(); renderTab();
