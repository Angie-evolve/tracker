}

// Meta devuelve un objeto de targeting enorme y anidado. Guardar todo por cada conjunto
// inflaria localStorage sin necesidad, asi que extraemos solo lo que un humano reconoceria
// como "la segmentacion": donde, a quien, en que plataformas y con que exclusiones.
function _resumenSegmentacion(t){
  if(!t||typeof t!=='object') return null;
  var g=t.geo_locations||{};
  var lugares=[]
    .concat(g.countries||[])
    .concat((g.regions||[]).map(function(r){return r.name||r.key;}))
    .concat((g.cities||[]).map(function(x){return x.name||x.key;}));
  var intereses=[];
  var juntar=function(spec){
    (spec||[]).forEach(function(bloque){
      ['interests','behaviors','demographics','industries','work_positions'].forEach(function(k){
        (bloque[k]||[]).forEach(function(x){ if(x&&x.name) intereses.push(x.name); });
      });
    });
  };
  juntar(t.flexible_spec);
  ['interests','behaviors'].forEach(function(k){
    (t[k]||[]).forEach(function(x){ if(x&&x.name) intereses.push(x.name); });
  });
  var gen={1:'hombres',2:'mujeres'};
  return {
    lugares: lugares.sort(),
    edad: (t.age_min||'')+'-'+(t.age_max||''),
    generos: (t.genders&&t.genders.length)?t.genders.map(function(x){return gen[x]||x;}).join(', '):'todos',
    intereses: intereses.sort(),
    publicos: (t.custom_audiences||[]).length,
    excluidos: (t.excluded_custom_audiences||[]).length,
    plataformas: (t.publisher_platforms||[]).slice().sort()
  };
}

// Etiqueta legible de un movimiento de Meta. Vive afuera porque la usan tanto el
// cartel de avisos como la bitacora semanal.
var _NV_META={campana:'Campana',conjunto:'Conjunto',anuncio:'Anuncio'};
function metaEtiqueta(mv){
  var n=_NV_META[mv.nivel||'anuncio']||'Anuncio';
  if(mv.tipo==='alta') return n+' nuevo';
  if(mv.tipo==='pausado') return n+' pausado';
  if(mv.tipo==='pausado_probable') return n+' pausado (probable)';
  if(mv.tipo==='reactivado') return n+' reactivado';
  if(mv.tipo==='baja') return n+' eliminado';
  if(mv.tipo==='subio_presupuesto') return 'Presupuesto aumentado';
  if(mv.tipo==='bajo_presupuesto') return 'Presupuesto reducido';
  if(mv.tipo==='segmentacion') return 'Segmentacion modificada';
  if(mv.tipo==='optimizacion') return 'Objetivo de optimizacion cambiado';
  if(mv.tipo==='creativo') return n+': creativo reemplazado';
  if(mv.tipo==='renombrado') return n+' renombrado';
  if(mv.tipo==='rechazado'||mv.tipo==='rechazado_vigente') return n+' RECHAZADO por Meta';
  if(mv.tipo==='revision') return n+' en revision';
  if(mv.tipo==='aprobado') return n+' aprobado';
  if(mv.tipo==='utms') return 'UTMs modificados \u2014 revisa la atribucion';
  if(mv.tipo==='destino') return 'URL de destino cambiada';
  if(mv.tipo==='sin_entrega') return n+' activo sin entregar';
  if(mv.tipo==='aprendizaje'||mv.tipo==='aprendizaje_vigente') return 'Conjunto en aprendizaje limitado';
  if(mv.tipo==='puja') return 'Estrategia de puja cambiada';
  if(mv.tipo==='objetivo') return 'Objetivo de campana cambiado';
  return 'Cambio en '+n.toLowerCase();
}

// ================= MOVIMIENTOS DE ANUNCIOS =================
// Dos fuentes, porque Meta no informa lo mismo para cada caso:
//  - Alta de un anuncio: viene con created_time, asi que se detecta sola desde el primer sync.
//  - Pausa o reactivacion: Meta no dice cuando cambio el estado, solo cual es hoy. Se detecta
//    comparando cada sincronizacion contra la foto de la anterior, igual que las novedades de GHL.
function computeMetaChanges(c, camps){
  c._metaSnapshot=c._metaSnapshot||null;
  var prev=c._metaSnapshot;
  var ahora=new Date().toISOString();
  var foto={};
  var cambios=[];
  var num=function(v){ var n=parseFloat(v); return isNaN(n)?0:n; };

  // Recorremos los tres niveles con la misma logica: estado y presupuesto.
  // Los anuncios no tienen presupuesto propio, se controlan desde el conjunto.
  var registrar=function(nivel, obj, donde){
    var st=String(obj.status||'').toUpperCase();
    var bud=num(obj.budget);
    foto[nivel+':'+obj.id]={st:st, bud:bud, name:obj.name||'', nivel:nivel, donde:donde,
      seg:obj.seg||null, optGoal:obj.optGoal||'', creativeId:obj.creativeId||'',
      eff:String(obj.effectiveStatus||'').toUpperCase(), urlTags:obj.urlTags||'',
      destLink:obj.destLink||'', bid:obj.bidStrategy||'', objetivo:obj.objective||'',
      learning:String(obj.learning||'').toUpperCase()};
    if(!prev) return; // primer sync: solo tomamos la foto
    var p=prev[nivel+':'+obj.id];
    if(!p){
      if(!obj.createdTime) cambios.push({ts:ahora,tipo:'alta',nivel:nivel,ad:obj.name||nivel,donde:donde});
      return;
    }
    if(p.st!==st){
      if(st==='ACTIVE') cambios.push({ts:ahora,tipo:'reactivado',nivel:nivel,ad:obj.name||nivel,donde:donde});
      else if(p.st==='ACTIVE') cambios.push({ts:ahora,tipo:'pausado',nivel:nivel,ad:obj.name||nivel,donde:donde});
    }
    // Segmentacion: comparamos campo por campo para poder decir QUE cambio,
    // no solo que algo cambio.
    if(p.seg && obj.seg){
      var difs=[];
      var lista=function(a,b,etq){
        var A=(a||[]).join(', '), B=(b||[]).join(', ');
        if(A!==B) difs.push(etq+': '+(A||'ninguno')+' \u2192 '+(B||'ninguno'));
      };
      lista(p.seg.lugares, obj.seg.lugares, 'ubicacion');
      lista(p.seg.plataformas, obj.seg.plataformas, 'plataformas');
      if(p.seg.edad!==obj.seg.edad) difs.push('edad: '+p.seg.edad+' \u2192 '+obj.seg.edad);
      if(p.seg.generos!==obj.seg.generos) difs.push('genero: '+p.seg.generos+' \u2192 '+obj.seg.generos);
      if((p.seg.intereses||[]).join('|')!==(obj.seg.intereses||[]).join('|')){
        var antes=(p.seg.intereses||[]).length, despues=(obj.seg.intereses||[]).length;
        difs.push('intereses: '+antes+' \u2192 '+despues);
      }
      if(p.seg.publicos!==obj.seg.publicos) difs.push('publicos guardados: '+p.seg.publicos+' \u2192 '+obj.seg.publicos);
      if(p.seg.excluidos!==obj.seg.excluidos) difs.push('exclusiones: '+p.seg.excluidos+' \u2192 '+obj.seg.excluidos);
      if(difs.length){
        cambios.push({ts:ahora,tipo:'segmentacion',nivel:nivel,ad:obj.name||nivel,donde:donde,
          detalle:difs.slice(0,3).join(' \u00b7 ')+(difs.length>3?' \u00b7 +'+(difs.length-3):'')});
      }
    }
    if(p.optGoal && obj.optGoal && p.optGoal!==obj.optGoal){
      cambios.push({ts:ahora,tipo:'optimizacion',nivel:nivel,ad:obj.name||nivel,donde:donde,
        detalle:p.optGoal+' \u2192 '+obj.optGoal});
    }
    // Rechazo o revision: el anuncio figura activo en la tabla pero no entrega.
    var eff=String(obj.effectiveStatus||'').toUpperCase();
    if(p.eff!==eff){
      if(eff==='DISAPPROVED'||eff==='WITH_ISSUES'){
        cambios.push({ts:ahora,tipo:'rechazado',nivel:nivel,ad:obj.name||nivel,donde:donde,detalle:''});
      } else if(eff==='PENDING_REVIEW'||eff==='IN_PROCESS'){
        cambios.push({ts:ahora,tipo:'revision',nivel:nivel,ad:obj.name||nivel,donde:donde,detalle:''});
      } else if((p.eff==='DISAPPROVED'||p.eff==='PENDING_REVIEW')&&eff==='ACTIVE'){
        cambios.push({ts:ahora,tipo:'aprobado',nivel:nivel,ad:obj.name||nivel,donde:donde,detalle:''});
      }
    }
    // UTMs: si se rompen, los leads siguen entrando pero dejan de atribuirse al anuncio.
    if(p.urlTags!==(obj.urlTags||'')){
      cambios.push({ts:ahora,tipo:'utms',nivel:nivel,ad:obj.name||nivel,donde:donde,
        detalle:(obj.urlTags?'ahora: '+String(obj.urlTags).slice(0,70):'quedaron vacios')});
    }
    if(p.destLink && obj.destLink && p.destLink!==obj.destLink){
      cambios.push({ts:ahora,tipo:'destino',nivel:nivel,ad:obj.name||nivel,donde:donde,
        detalle:String(obj.destLink).slice(0,70)});
    }
    // Fase de aprendizaje del conjunto
    var lrn=String(obj.learning||'').toUpperCase();
    if(p.learning!==lrn && lrn==='LEARNING_LIMITED'){
      cambios.push({ts:ahora,tipo:'aprendizaje',nivel:nivel,ad:obj.name||nivel,donde:donde,detalle:''});
    }
    if(p.bid && obj.bidStrategy && p.bid!==obj.bidStrategy){
      cambios.push({ts:ahora,tipo:'puja',nivel:nivel,ad:obj.name||nivel,donde:donde,
        detalle:p.bid+' \u2192 '+obj.bidStrategy});
    }
    if(p.objetivo && obj.objective && p.objetivo!==obj.objective){
      cambios.push({ts:ahora,tipo:'objetivo',nivel:nivel,ad:obj.name||nivel,donde:donde,
        detalle:p.objetivo+' \u2192 '+obj.objective});
    }
    if(p.creativeId && obj.creativeId && p.creativeId!==obj.creativeId){
      cambios.push({ts:ahora,tipo:'creativo',nivel:nivel,ad:obj.name||nivel,donde:donde,detalle:''});
    }
    if(p.name && obj.name && p.name!==obj.name){
      cambios.push({ts:ahora,tipo:'renombrado',nivel:nivel,ad:obj.name,donde:donde,
        detalle:'antes: '+p.name});
    }
    // Presupuesto: solo si habia uno antes y hay uno ahora. Pasar de 0 a X suele ser
    // que Meta empezo a reportarlo, no que vos lo hayas cambiado.
    if(p.bud>0 && bud>0 && p.bud!==bud){
      var pct=Math.round((bud-p.bud)/p.bud*100);
      cambios.push({ts:ahora, tipo:bud>p.bud?'subio_presupuesto':'bajo_presupuesto',
        nivel:nivel, ad:obj.name||nivel, donde:donde,
        detalle:'$'+p.bud+' \u2192 $'+bud+(pct?' ('+(pct>0?'+':'')+pct+'%)':'')});
    }
  };

  var excl=(function(){
    var al=(typeof getActiveLine==='function')?getActiveLine(c.conversionLines||[]):null;
    return (al&&al.excludedCampaigns)||[];
  })();
  (camps||[]).forEach(function(cp){
    if(excl.indexOf(cp.id)!==-1) return; // campana destildada: no se vigila
    registrar('campana', cp, '');
    (cp.adsets||[]).forEach(function(as){
      registrar('conjunto', as, cp.name||'');
      (as.ads||[]).forEach(function(ad){
        registrar('anuncio', ad, as.name||'');
      });
    });
  });

  // Lo que estaba en la foto anterior y ya no aparece
  if(prev){
    Object.keys(prev).forEach(function(k){
      if(foto[k]) return;
      var p=prev[k];
      cambios.push({ts:ahora,tipo:'baja',nivel:p.nivel||'anuncio',ad:p.name||'Anuncio',donde:p.donde||''});
    });
  }

  c._metaSnapshot=foto;
  if(cambios.length) c.metaChanges=cambios.concat(c.metaChanges||[]).slice(0,200);
  return cambios.length;
}

// Movimientos de los ultimos N dias, mezclando las altas que reporta Meta
// con los cambios de estado que detectamos nosotros.
function metaMovimientos(c, dias){
  dias=dias||7;
  var desde=Date.now()-dias*86400000;
  var out=[];
  var al=(typeof getActiveLine==='function')?getActiveLine(c.conversionLines||[]):null;
  ((al&&al.metaCampaigns)||[]).forEach(function(cp){
    (cp.adsets||[]).forEach(function(as){
      (as.ads||[]).forEach(function(ad){
        if(!ad.createdTime) return;
        var t=new Date(ad.createdTime).getTime();
        if(isNaN(t)||t<desde) return;
        out.push({ts:t, tipo:'alta', ad:ad.name||'Anuncio', donde:as.name||'', nivel:'anuncio', detalle:''});
      });
    });
  });
  // Pausas anteriores a la primera foto: no las tenemos registradas, pero Meta guarda
  // updated_time. Si un anuncio esta pausado y se toco hace poco, casi seguro fue eso.
  // Es una inferencia, no un hecho: updated_time tambien cambia al editar presupuesto,
  // creativo o segmentacion. Por eso se marca aparte como "probable".
  ((al&&al.metaCampaigns)||[]).forEach(function(cp){
    (cp.adsets||[]).forEach(function(as){
      (as.ads||[]).forEach(function(ad){
        if(String(ad.status||'').toUpperCase()==='ACTIVE') return;
        if(!ad.updatedTime) return;
        var t=new Date(ad.updatedTime).getTime();
        if(isNaN(t)||t<desde) return;
        // si ya lo detectamos con la foto, no lo repetimos
        if((c.metaChanges||[]).some(function(ch){return ch.ad===ad.name&&new Date(ch.ts).getTime()>=desde;})) return;
        out.push({ts:t, tipo:'pausado_probable', ad:ad.name||'Anuncio', donde:as.name||'', nivel:'anuncio', detalle:''});
      });
    });
  });
  // Estados que no son "cambios" sino condiciones vigentes: se evaluan cada vez.
  var _excl=(al&&al.excludedCampaigns)||[];
  ((al&&al.metaCampaigns)||[]).forEach(function(cp){
    // Solo las campanas tildadas en Ads & Guiones: las destildadas son historia que no se mira.
    if(_excl.indexOf(cp.id)!==-1) return;
    var _campActiva=String(cp.status||'').toUpperCase()==='ACTIVE';
    (cp.adsets||[]).forEach(function(as){
      if(String(as.learning||'').toUpperCase()==='LEARNING_LIMITED' && _campActiva){
        out.push({ts:Date.now(),tipo:'aprendizaje_vigente',ad:as.name||'Conjunto',donde:cp.name||'',nivel:'conjunto',detalle:''});
      }
      (as.ads||[]).forEach(function(ad){
        var eff=String(ad.effectiveStatus||'').toUpperCase();
        if(eff==='DISAPPROVED'){
          if(_campActiva) out.push({ts:Date.now(),tipo:'rechazado_vigente',ad:ad.name||'Anuncio',donde:as.name||'',nivel:'anuncio',detalle:''});
          return;
        }
        // Activo, con el conjunto activo, creado hace mas de 2 dias y sin una sola impresion.
        // Un anuncio activo dentro de una campana o conjunto pausado no entrega,
        // y eso no es una anomalia: es lo esperado. No hay nada que avisar.
        if(!_campActiva) return;
        if(String(ad.status||'').toUpperCase()!=='ACTIVE') return;
        if(String(as.status||'').toUpperCase()!=='ACTIVE') return;
        if(Number(ad.impressions)>0) return;
        if(!ad.createdTime) return;
        var edad=Date.now()-new Date(ad.createdTime).getTime();
        if(isNaN(edad)||edad<2*86400000) return;
        out.push({ts:Date.now(),tipo:'sin_entrega',ad:ad.name||'Anuncio',donde:as.name||'',nivel:'anuncio',detalle:'activo y sin impresiones'});
      });
    });
  });
  (c.metaChanges||[]).forEach(function(ch){
    var t=new Date(ch.ts).getTime();
    if(isNaN(t)||t<desde) return;
    if(ch.tipo==='alta' && out.some(function(x){return x.tipo==='alta'&&x.ad===ch.ad;})) return;
    out.push({ts:t, tipo:ch.tipo, ad:ch.ad, donde:ch.donde, nivel:ch.nivel||'anuncio', detalle:ch.detalle||''});
  });
  var peso={rechazado:0,rechazado_vigente:0,utms:1,destino:1,sin_entrega:2,aprendizaje_vigente:3,aprendizaje:3};
  out.sort(function(a,b){
    var pa=(peso[a.tipo]!==undefined)?peso[a.tipo]:9, pb=(peso[b.tipo]!==undefined)?peso[b.tipo]:9;
    if(pa!==pb) return pa-pb;
    return b.ts-a.ts;
  });
  return out;
}

// Normaliza los avisos que devuelve Meta. issues_info trae mensajes tal cual
// los muestra el Ads Manager ("Resultados bajos", "Publico saturado", etc.).
// Junta todos los avisos de la linea activa y arma el cartel de arriba.
function metaAvisos(c){
  var al=(typeof getActiveLine==='function')?getActiveLine(c.conversionLines||[]):null;
  if(!al) return [];
  var out=[], vistos={};
  var push=function(tipo,titulo,detalle,donde){
    var k=tipo+'|'+titulo+'|'+donde;
    if(vistos[k]) return; vistos[k]=true;
    out.push({tipo:tipo,titulo:titulo,detalle:detalle,donde:donde});
  };
  (al.metaCampaigns||[]).forEach(function(cp){
    if((al.excludedCampaigns||[]).indexOf(cp.id)>=0) return;
    (cp.issues||[]).forEach(function(i){ push('issue',i.titulo,i.detalle,cp.name); });
    (cp.adsets||[]).forEach(function(as){
      (as.issues||[]).forEach(function(i){ push('issue',i.titulo,i.detalle,as.name); });
      var lb=_learningLabel(as.learning);
      if(lb) push(as.learning==='LEARNING_LIMITED'?'issue':'info',lb,
        as.learning==='LEARNING_LIMITED'
          ? 'Meta no consigue suficientes conversiones para salir del aprendizaje: el conjunto va a entregar peor y mas caro.'
          : 'El conjunto todavia esta optimizando. Los numeros de estos dias no son representativos.',
        as.name);
      (as.ads||[]).forEach(function(ad){
        (ad.issues||[]).forEach(function(i){ push('issue',i.titulo,i.detalle,ad.name); });
      });
    });
  });
  // Que se movio en la semana: altas, pausas y reactivaciones de anuncios.
  var movs=metaMovimientos(c,7);
  var etiqueta=metaEtiqueta;
  movs.slice(0,8).forEach(function(mv){
    var cuando=Math.max(0,Math.floor((Date.now()-mv.ts)/86400000));
    var det=esc(mv.ad)+(mv.detalle?' \u00b7 '+esc(mv.detalle):'')
      +(cuando===0?' \u00b7 hoy':' \u00b7 hace '+cuando+' dia'+(cuando>1?'s':''));
    push('mov',etiqueta(mv),det,mv.donde);
  });
  // Sync viejo: no viene de Meta pero es igual de importante
  if(al.metaSyncAt){
    var dias=Math.floor((Date.now()-new Date(al.metaSyncAt).getTime())/86400000);
    if(dias>=3) push('info','Datos desactualizados','Ultima sincronizacion hace '+dias+' dias. Sincroniza antes de tomar decisiones.','');
  }
  return out;
}

async function syncMetaAds(clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c||!c.metaToken||!c.metaAccountId) return;
  var btn=document.getElementById('meta-sync-btn');
  if(btn){btn.disabled=true;btn.textContent='Sincronizando...';}

  var token=c.metaToken;
  var actId='act_'+c.metaAccountId;
  var activeLine=c.conversionLines&&getActiveLine(c.conversionLines);
  // If no line exists, create a temporary meta-only line
  if(!activeLine){
    if(!c.conversionLines) c.conversionLines=[];
    activeLine={id:'meta-'+Date.now(),version:'Meta Ads',status:'activa',adsets:[],metaDays:30,metrics:{adSpent:null,pageViews:null,cpm:null,cpc:null,optIn:null,cpl:null,registros:null,sql:null}};
    c.conversionLines.push(activeLine);
    save();
  }

  // Date range from activeLine.metaDays
  var days=activeLine.metaDays||30;
  var now=new Date();
  var since, until;
  if(days==='custom'&&activeLine.metaSince&&activeLine.metaUntil){
    since=activeLine.metaSince;
    until=activeLine.metaUntil;
  } else if(days==='max'){
    // Meta rechaza fechas de inicio de mas de 37 meses (error #3018), asi que se pide
    // el maximo permitido: 36 meses hacia atras, con un dia de margen.
    var _max=new Date(now); _max.setMonth(_max.getMonth()-36); _max.setDate(_max.getDate()+1);
    since=_max.toISOString().slice(0,10);
    until=now.toISOString().slice(0,10);
  } else {
    days=parseInt(days)||30;
    since=new Date(now-days*24*60*60*1000).toISOString().slice(0,10);
    until=now.toISOString().slice(0,10);
  }
  var timeRange='{"since":"'+since+'","until":"'+until+'"}';

  try{
    // Moneda de la cuenta publicitaria. Meta la devuelve en el objeto de la cuenta,
    // asi que no hay que adivinarla mirando la magnitud de los numeros.
    try{
      var accResp=await fetch('https://graph.facebook.com/v19.0/'+actId
        +'?fields=currency,name,timezone_name&access_token='+token);
      var accData=await accResp.json();
      if(accData && accData.currency){
        c.metaCurrency=accData.currency;
        c.metaAccountName=accData.name||'';
        save();
      }
    }catch(e){ /* si falla, seguimos: la moneda es informativa */ }

    // Fetch campaigns with insights
    var insFields='spend,reach,impressions,frequency,clicks,cpc,ctr,cpm,actions,cost_per_action_type'
      +',video_thruplay_watched_actions,cost_per_thruplay,video_play_actions,video_avg_time_watched_actions'
      +',video_p25_watched_actions,video_p50_watched_actions,video_p75_watched_actions,video_p100_watched_actions';
    var fieldsStr='id,name,status,effective_status,issues_info,objective,daily_budget,lifetime_budget,insights.time_range('+timeRange+'){'+insFields+'}';
    var url='https://graph.facebook.com/v19.0/'+actId+'/campaigns'
      +'?fields='+encodeURIComponent(fieldsStr)
      +'&access_token='+token
      +'&limit=50';
    var resp=await fetch(url);
    var data=await resp.json();
    console.log('Meta campaigns response:', JSON.stringify(data).slice(0,500));
    if(data.error) throw new Error(data.error.message);

    var campaigns=data.data||[];
    if(!campaigns.length){toast('Sin campanas en ese periodo');if(btn){btn.disabled=false;btn.textContent='Sincronizar Meta';}return;}

    // Fetch adsets + ads for each campaign
    for(var ci=0;ci<campaigns.length;ci++){
      try{
        var adsetFieldsStr='id,name,status,effective_status,issues_info,learning_stage_info,daily_budget,lifetime_budget,targeting,optimization_goal,bid_strategy,insights.time_range('+timeRange+'){'+insFields+'}';
        var adsetUrl='https://graph.facebook.com/v19.0/'+campaigns[ci].id+'/adsets'
          +'?fields='+encodeURIComponent(adsetFieldsStr)
          +'&access_token='+token
          +'&limit=20';
        var asResp=await fetch(adsetUrl);
        var asData=await asResp.json();
        var adsets=asData.data||[];

        // Fetch ads for each adset
        for(var ai=0;ai<adsets.length;ai++){
          try{
            var adsFieldsStr='id,name,status,effective_status,issues_info,created_time,updated_time,creative{id,name,thumbnail_url,url_tags,object_story_spec{link_data{link}}},insights.time_range('+timeRange+'){'+insFields+'}';
            var adsUrl='https://graph.facebook.com/v19.0/'+adsets[ai].id+'/ads'
              +'?fields='+encodeURIComponent(adsFieldsStr)
              +'&access_token='+token
              +'&limit=20';
            var adsResp=await fetch(adsUrl);
            var adsData=await adsResp.json();
            var adsList=(adsData.data||[]).map(function(ad){
              var ins=ad.insights&&ad.insights.data&&ad.insights.data[0];
              var m=extractIns(ins);
              return {
                id:ad.id,name:ad.name,status:ad.status,previewUrl:'',
                createdTime:ad.created_time||null,updatedTime:ad.updated_time||null,
                effectiveStatus:ad.effective_status||'', issues:_metaIssues(ad),
                thumbnail:ad.creative&&ad.creative.thumbnail_url||'',
                creativeId:(ad.creative&&ad.creative.id)||'',
                urlTags:(ad.creative&&ad.creative.url_tags)||'',
                destLink:(ad.creative&&ad.creative.object_story_spec&&ad.creative.object_story_spec.link_data&&ad.creative.object_story_spec.link_data.link)||'',
                spend:m.spend,impressions:m.impressions,reach:m.reach,frequency:m.frequency,
                clicks:m.clicks,ctr:m.ctr,cpc:m.cpc,cpm:m.cpm,
                leads:m.leads,cpl:m.cpl,
                landingViews:m.landingViews,costPerLanding:m.costPerLanding,
                thruPlays:m.thruPlays,costPerThruPlay:m.costPerThruPlay,videoPlays:m.videoPlays,avgWatch:m.avgWatch,ret25:m.ret25,ret50:m.ret50,ret75:m.ret75,ret100:m.ret100,
                results:m.results,costPerResult:m.costPerResult,
                igFollows:m.igFollows,igProfileVisits:m.igProfileVisits
              };
            });
            // Fetch preview URL for each ad
            for(var di=0;di<adsList.length;di++){
              try{
                var prevUrl='https://graph.facebook.com/v19.0/'+adsList[di].id+'/previews'
                  +'?ad_format=DESKTOP_FEED_STANDARD'
                  +'&access_token='+token;
                var prevResp=await fetch(prevUrl);
                var prevData=await prevResp.json();
                var iframe=(prevData.data&&prevData.data[0]&&prevData.data[0].body)||'';
                var match=iframe.match(/src="([^"]+fb\.me\/adspreview[^"]+)"/);
                if(match) adsList[di].previewUrl=match[1].replace(/&amp;/g,'&');
              }catch(e){}
            }
            adsets[ai].ads=adsList;
          }catch(e){ console.log('ads fetch error:',e.message); adsets[ai].ads=[]; }
        }
        console.log('adsets before map:', JSON.stringify(adsets.map(function(a){return {id:a.id,name:a.name,adsLen:a.ads&&a.ads.length};})));
        campaigns[ci].adsets=adsets.map(function(as){
          var ins=as.insights&&as.insights.data&&as.insights.data[0];
          var m=extractIns(ins);
          var bud=as.daily_budget||as.lifetime_budget||0;
          return {
            id:as.id,name:as.name,status:as.status,
            effectiveStatus:as.effective_status||'', issues:_metaIssues(as),
            learning:(as.learning_stage_info&&as.learning_stage_info.status)||'',
            seg:_resumenSegmentacion(as.targeting),
            optGoal:as.optimization_goal||'', bidStrategy:as.bid_strategy||'',
            endTime:as.end_time||null,
            spend:m.spend,budget:parseFloat(bud/100||0).toFixed(0),
            impressions:m.impressions,reach:m.reach,frequency:m.frequency,
            clicks:m.clicks,ctr:m.ctr,cpc:m.cpc,cpm:m.cpm,
            leads:m.leads,cpl:m.cpl,
            landingViews:m.landingViews,costPerLanding:m.costPerLanding,
            thruPlays:m.thruPlays,costPerThruPlay:m.costPerThruPlay,videoPlays:m.videoPlays,avgWatch:m.avgWatch,ret25:m.ret25,ret50:m.ret50,ret75:m.ret75,ret100:m.ret100,
            results:m.results,costPerResult:m.costPerResult,
            igFollows:m.igFollows,igProfileVisits:m.igProfileVisits,
            ads:(as.ads||[])
          };
        });
        console.log('Adsets saved for camp '+campaigns[ci].id+':', campaigns[ci].adsets.map(function(a){return {id:a.id,name:a.name,ads:a.ads&&a.ads.length};}));
      }catch(e){ campaigns[ci].adsets=[]; }
    }

    // Helper to extract metrics from insights
    function extractIns(ins, budget){
      if(!ins) return {spend:0,impressions:0,reach:0,frequency:0,clicks:0,ctr:'0',cpc:'0',cpm:'0',leads:0,cpl:'',landingViews:0,thruPlays:0,costPerThruPlay:'',videoPlays:0,avgWatch:'',ret25:'',ret50:'',ret75:'',ret100:'',results:0,costPerResult:'',igFollows:0,igProfileVisits:0};
      var actions=ins.actions||[];
      function getAction(type){ var a=actions.find(function(x){return x.action_type===type;}); return a?parseInt(a.value||0):0; }
      function getActionF(type){ var a=actions.find(function(x){return x.action_type===type;}); return a?parseFloat(a.value||0):0; }
      // Meta reporta el MISMO lead bajo varios action_type a la vez ('lead', 'onsite_web_lead',
      // 'offsite_conversion.fb_pixel_lead', 'offsite_lead_add_20_s_calls'...). Sumarlos multiplica
      // el numero por la cantidad de alias. Se toma el maximo, que es el conteo real del evento.
      function maxAction(){
        var m=0;
        for(var i=0;i<arguments.length;i++){ var v=getAction(arguments[i]); if(v>m) m=v; }
        return m;
      }
      var leads=maxAction('lead','onsite_web_lead','onsite_conversion.lead_grouped',
        'offsite_conversion.fb_pixel_lead','offsite_lead_add_20_s_calls','onsite_conversion.messaging_first_reply');
      var landingViews=getAction('landing_page_view');
      // ThruPlays no viene dentro de 'actions': es un campo propio de insights,
      // un array donde el valor util suele estar en el primer elemento.
      var thruPlays=(function(){
        var arr=ins.video_thruplay_watched_actions;
        if(!arr||!arr.length) return 0;
        var vv=arr.find(function(x){return x.action_type==='video_view';});
        return parseInt((vv||arr[0]).value||0)||0;
      })();
      // Metricas de video. Todas vienen como arrays propios de insights, no dentro
      // de 'actions'. Se lee el elemento con action_type 'video_view' y si no, el primero.
      function vidNum(campo){
        var arr=ins[campo];
        if(!arr||!arr.length) return 0;
        var vv=arr.find(function(x){return x.action_type==='video_view';});
        return parseFloat((vv||arr[0]).value||0)||0;
      }
      var videoPlays=vidNum('video_play_actions');
      var avgWatch=vidNum('video_avg_time_watched_actions');
      var p25=vidNum('video_p25_watched_actions');
      var p50=vidNum('video_p50_watched_actions');
      var p75=vidNum('video_p75_watched_actions');
      var p100=vidNum('video_p100_watched_actions');
      // La retencion se mide contra las reproducciones, que es como la muestra Meta.
      var pct=function(n){ return videoPlays>0?(n/videoPlays*100).toFixed(1):''; };
      var igFollows=getAction('follow')+getAction('onsite_conversion.post_save');
      var igProfileVisits=getAction('onsite_conversion.messaging_first_reply');
      var spend=parseFloat(ins.spend||0);
      // "Resultados" = evento de conversion real (como en Ads Manager), NUNCA las visitas.
      // Se prioriza el evento de conversion mas fuerte presente; si no hay ninguno, queda vacio.
      // Mismo criterio que arriba: cada bloque son alias del mismo evento, se toma el maximo.
      // Y 'leads' ya incluye el lead del pixel, asi que no se vuelve a sumar aparte.
      var _reg=maxAction('complete_registration','offsite_conversion.fb_pixel_complete_registration','onsite_conversion.complete_registration');
      var _purch=maxAction('purchase','offsite_conversion.fb_pixel_purchase','onsite_web_purchase');
      var _msgConv=maxAction('onsite_conversion.messaging_conversation_started_7d','onsite_conversion.total_messaging_connection');
      var results=_purch||_reg||leads||_msgConv||0;
      // Cost per result from API
      var cpr='';
      var cprArr=ins.cost_per_action_type||[];
      if(results>0) cpr=(spend/results).toFixed(2);
      else if(cprArr.length) cpr=parseFloat(cprArr[0].value||0).toFixed(2);
      return {
        spend:spend,
        impressions:parseInt(ins.impressions||0),
        reach:parseInt(ins.reach||0),
        frequency:parseFloat(ins.frequency||0).toFixed(2),
        clicks:parseInt(ins.clicks||0),
        ctr:parseFloat(ins.ctr||0).toFixed(2),
        cpc:parseFloat(ins.cpc||0).toFixed(2),
        cpm:parseFloat(ins.cpm||0).toFixed(2),
        leads:leads,
        cpl:leads>0?(spend/leads).toFixed(2):'',
        landingViews:landingViews,
        costPerLanding:landingViews>0?(spend/landingViews).toFixed(2):'',
        thruPlays:thruPlays,
        costPerThruPlay:(function(){
          var arr=ins.cost_per_thruplay;
          if(arr&&arr.length){ var v=parseFloat(arr[0].value||0); if(v>0) return v.toFixed(2); }
          return thruPlays>0?(spend/thruPlays).toFixed(2):'';
        })(),
        videoPlays:videoPlays,
        avgWatch:avgWatch?avgWatch.toFixed(1):'',
        ret25:pct(p25), ret50:pct(p50), ret75:pct(p75), ret100:pct(p100),
        results:results,
        costPerResult:cpr,
        igFollows:igFollows,
        igProfileVisits:igProfileVisits,
        budget:budget||0
      };
    }

    // Store campaigns with adsets included
    console.log('Saving campaigns:', campaigns.map(function(c){return {id:c.id,adsets:c.adsets&&c.adsets.length,ads:c.adsets&&c.adsets[0]&&c.adsets[0].ads&&c.adsets[0].ads.length};}));
    activeLine.metaCampaigns=campaigns.map(function(camp){
      var ins=camp.insights&&camp.insights.data&&camp.insights.data[0];
      var m=extractIns(ins);
      var bud=camp.daily_budget||camp.lifetime_budget||0;
      return {
        id:camp.id,name:camp.name,status:camp.status,
        effectiveStatus:camp.effective_status||'', issues:_metaIssues(camp),
        objective:camp.objective||'',
        spend:m.spend,budget:parseFloat(bud/100||0).toFixed(0),
        impressions:m.impressions,reach:m.reach,frequency:m.frequency,
        clicks:m.clicks,ctr:m.ctr,cpc:m.cpc,cpm:m.cpm,
        leads:m.leads,cpl:m.cpl,
        landingViews:m.landingViews,costPerLanding:m.costPerLanding,
        thruPlays:m.thruPlays,costPerThruPlay:m.costPerThruPlay,videoPlays:m.videoPlays,avgWatch:m.avgWatch,ret25:m.ret25,ret50:m.ret50,ret75:m.ret75,ret100:m.ret100,
        results:m.results,costPerResult:m.costPerResult,
        igFollows:m.igFollows,igProfileVisits:m.igProfileVisits,
        adsets:(camp.adsets||[])
      };
    });
    activeLine.metaSyncAt=new Date().toISOString();
    // Comparar contra la foto del sync anterior para saber que se pauso o se reactivo.
    var _nMov=0;
    try{ _nMov=computeMetaChanges(c, activeLine.metaCampaigns); }catch(e){ console.warn('diff Meta',e); }
    save();
    renderTab();
    toast('Meta sincronizado - '+campaigns.length+' campanas'+(_nMov?' \u00b7 '+_nMov+' movimiento'+(_nMov>1?'s':''):''));
  }catch(e){
    toast('Error Meta: '+e.message,'red');
  }
  if(btn){btn.disabled=false;btn.textContent='Sincronizar Meta';}
}

function scheduleTask(clientId, taskId){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  var t=(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t) return;

  // Build Google Calendar URL for "Estrategia" calendar
  var title='['+c.name+'] '+t.text;
  var details='Tarea: '+t.text+(t.responsible?'\nResponsable: '+t.responsible:'')+(t.source?'\nDe: '+t.source:'');

  var calUrl='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(title)
    +'&details='+encodeURIComponent(details)
    +(t.due?'&dates='+t.due.replace(/-/g,'')+'T120000/'+t.due.replace(/-/g,'')+'T130000':'')
    +'&ctz=America/Argentina/Buenos_Aires';

  // Mark as scheduled
  t.scheduled=true;
  t.scheduledAt=new Date().toISOString();
  save();
  renderTab();

  window.open(calUrl,'_blank');
  toast('Abriendo Calendar...');
}

function updateTaskStatus(clientId, taskId, status){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  var t=(c.tasks||[]).find(function(x){return x.id===taskId;});
  if(!t) return;
  t.delegatedStatus=status;
  if(status==='Finalizada') t.done=true;
  save();
  renderTab();
  toast('Estado actualizado: '+status);
}

function toggleTask(clientId, taskId, checked){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c||!c.tasks) return;
  var t=c.tasks.find(function(x){return x.id===taskId;});
  if(t){
    t.done=checked;
    if(checked) t.doneAt=new Date().toISOString(); else delete t.doneAt;
    save();
    if(S.view==='tickets') showTickets(); else renderTab();
  }
}

function deleteTask(clientId, taskId){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  c.tasks=(c.tasks||[]).filter(function(x){return x.id!==taskId;});
  save();renderTab();
}

// Proximo numero de ticket segun la propia app: max de todos los tickets delegados + 1
function nextTicketFromApp(){
  var max=0;
  DB.clients.forEach(function(c){
    (c.tasks||[]).forEach(function(t){
      if(!t.ticket) return;
      var n=parseInt(String(t.ticket).replace(/[^0-9]/g,''),10);
      if(!isNaN(n)&&n>max) max=n;
    });
  });
  var ls=parseInt(localStorage.getItem('evold-last-ticket')||'0',10);
  if(ls>max) max=ls;
  return max+1;
}

    +'2) IMPLEMENTACION DE CAMPANAS (crear campana/subir anuncios/presupuesto/segmentacion/objetivo):\n'
    +'Checklist de implementacion:\n[ ] Anuncios subidos y programados\n[ ] Pixel de conversion creado e instalado\n[ ] Dominio verificado y confirmado\n[ ] Objetivo de campana definido correctamente\n[ ] Presupuesto configurado segun brief\n[ ] Segmentacion implementada y verificada\n[ ] Campana testeada antes de activar\n'
    +'3) CAMBIOS URGENTES - CAMPANAS (cambio de objetivo/testeo urgente/nueva segmentacion en campana existente):\n'
    +'Checklist de cambios:\n[ ] Nuevo objetivo aplicado (Meta Forms / WhatsApp / otro)\n[ ] Testeo implementado (nueva campana / conjunto de anuncios)\n[ ] Segmentacion actualizada\n[ ] Anuncios ajustados segun cambios\n[ ] Verificacion de funcionamiento completada\n'
    +'4) CAMBIOS URGENTES - EMBUDO (modificar landing/formulario/calendario, urgente en embudo):\n'
    +'Checklist de cambios:\n[ ] Landing: copys actualizados\n[ ] Landing: elementos modificados\n[ ] Landing: diseno ajustado\n[ ] Formulario: preguntas actualizadas\n[ ] Formulario: estructura modificada\n[ ] Calendario: disponibilidad ajustada\n[ ] Calendario: responsable asignado\n[ ] Calendario: notas de la cita configuradas\n[ ] Cambios testeados y verificados\n'
    +'\nTIMELINE: 2 hitos con fecha -> entregable intermedio y final.\n'
    +'CONFIRMACION (obligatoria): "RESPONDE A ESTE EMAIL [timeframe] confirmando: 1. Entendiste el objetivo? 2. Esta claro el deadline ([FECHA])? 3. Leiste los documentos completos?" Timeframe: urgente -> 15-30 min; del dia -> hoy antes de [hora]; no critica -> 24 horas.\n'
    +'REGLA DE SILENCIO (obligatoria): segundo email en [X horas] SOLO SI necesita accesos/bloqueo/recurso; si no llega, se asume que avanza. X: simple 2-3h, media 3-6h, compleja 24h.\n'
    +'CIERRE: "Despues de eso, solo comunicate cuando [condicion]." + "Adelante!" + firma "Angie".\n'
    +'PROHIBIDO: lenguaje vago ("lo antes posible","cuando puedas"), omitir confirmacion o regla de silencio, inventar datos.';

  // Proximo ticket: lo calcula la propia app (tickets ya delegados en todos los clientes).
  // El Sheet se consulta solo como red de seguridad (3s max) por si hay tickets viejos
  // creados fuera de la app con un numero mas alto - se toma el maximo de ambos.
  var nextTicket=nextTicketFromApp();

      fetch(TICKETS_PROXY+'?secret=evolve-tracker&action=last_ticket').then(function(r){return r.json();}),
      new Promise(function(res){setTimeout(function(){res(null);},3000);})
    ]);
    if(ticketData&&ticketData.ok&&ticketData.nextTicket&&ticketData.nextTicket>nextTicket){
      nextTicket=ticketData.nextTicket;
    }
  }catch(e){}

  // Buscar materiales relacionados en Google Drive (silencioso; si falla, se sigue sin materiales)
  var driveMaterials=[];
  try{
    var _kw=String(t.text||'').split(/\s+/).filter(function(w){return w.length>=5;}).slice(0,4).join(' ');
    var _dq=await Promise.race([
      fetch(TICKETS_PROXY+'?secret=evolve-tracker&action=drive_search&client='+encodeURIComponent(c.name)+'&q='+encodeURIComponent(_kw)).then(function(r){return r.json();}),
      new Promise(function(res){setTimeout(function(){res(null);},7000);})
    ]);

  }catch(e){}
  var materialsBlock=driveMaterials.length

    +'1. El numero de ticket a usar es #'+nextTicket+'. Usalo en el asunto y en el cuerpo del mail\n'
    +'2. Infiere el tipo de tarea y agrega el checklist correspondiente si aplica\n'
    +'3. Determina el nivel de autonomia segun la tarea\n'
    +'4. Usa la informacion de la llamada para dar contexto especifico\n'
    +'5. Redacta SOLO el mail completo con asunto y cuerpo, nada mas\n'
    +'6. Si no hay deadline especifico, usa "a confirmar" pero igual redacta el mail completo\n\n'
    +'Formato de respuesta:\n'
    +'ASUNTO: [el asunto completo]\n'
    +'---\n'
    +'[el cuerpo completo del mail]';

  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1500,messages:[{role:'user',content:prompt}]})
    });

    if(data.error) throw new Error(data.error.message);
    var raw=((data.content||[]).filter(function(b){return b&&b.type==='text';}).map(function(b){return b.text||'';}).join('')||'').trim();

      +'</div>'

      +'<button class="btn btn-sm" onclick="closeModal();if(S.view===\'tickets\')showTickets();">Cerrar</button>'
      +'</div></div>';
  }
}

function confirmDelegate(clientId, taskId){
  var subjectEl=document.getElementById('delegate-subject');
  var bodyEl=document.getElementById('delegate-body');
  if(!subjectEl||!bodyEl) return;
  var subjectVal=subjectEl.value.trim();
  var bodyVal=bodyEl.value.trim();
  var t=window._pendingDelegate&&window._pendingDelegate.task;
  var c=DB.clients.find(function(x){return x.id===clientId;});
  var modal=document.getElementById('modal-root');

  // Save ticket number and mark task as delegated
  var usedTicket=window._pendingDelegate&&window._pendingDelegate.ticket||null;
  if(usedTicket) localStorage.setItem('evold-last-ticket',usedTicket);
  if(c){
    var task=(c.tasks||[]).find(function(x){return x.id===taskId;});
    if(task){task.delegated=true;task.delegatedAt=new Date().toISOString();task.ticket='#'+usedTicket;save();}
  }

  // Gmail compose URL
  var gmailUrl='https://mail.google.com/mail/?view=cm&to=ashy%40evolvemindhub.com'
    +'&su='+encodeURIComponent(subjectVal)
    +'&body='+encodeURIComponent(bodyVal);

  // Google Calendar URL
  var calUrl='';
  if(t&&t.due){
    var d=t.due.replace(/-/g,'');
    calUrl='https://calendar.google.com/calendar/render?action=TEMPLATE'
      +'&text='+encodeURIComponent('Deadline: '+t.text)
      +'&dates='+d+'T120000/'+d+'T121000'
      +'&details='+encodeURIComponent('Tarea delegada a Ashy: '+t.text)
      +'&add=ashy%40evolvemindhub.com';
  }

  // Write to Sheet via sheets proxy
  if(t&&c){
    var logUrl=TICKETS_PROXY
      +'?secret=evolve-tracker'
      +'&action=log_task'
      +'&ticket='+encodeURIComponent(usedTicket||'')
      +'&task='+encodeURIComponent(t.text||'')
      +'&client='+encodeURIComponent(c.name||'')
      +'&deadline='+encodeURIComponent(t.due||'')
      +'&responsible='+encodeURIComponent(t.responsible||'Ashy')
      +'&priority='+encodeURIComponent(t.priority||'');
    fetch(logUrl)
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.ok){
          localStorage.setItem('evold-last-ticket', usedTicket||'1');
          toast('Tarea #'+usedTicket+' registrada en el Sheet');
        }
      })
      .catch(function(){});
  }

  // Crear el borrador REAL en Gmail (casilla de Angie) via el script de tickets
  var _setSt=function(id,html){var e=document.getElementById(id);if(e)e.innerHTML=html;};
  var _sendDirect=(function(){
    var cb=document.getElementById('dg-send-direct');
    var v=cb?(cb.checked?'1':'0'):(localStorage.getItem('evold-delegate-send')||'0');
    localStorage.setItem('evold-delegate-send',v);
    return v==='1';
  })();
  fetch(TICKETS_PROXY+'?secret=evolve-tracker&action=create_draft'
      +'&to='+encodeURIComponent('ashy@evolvemindhub.com')
      +'&subject='+encodeURIComponent(subjectVal)
      +'&body='+encodeURIComponent(bodyVal)
      +(_sendDirect?'&send=1':''))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.ok){
        _setSt('dg-draft-st',_sendDirect&&d.sent
          ?'<span style="color:var(--accent)">Mail ENVIADO a ashy@evolvemindhub.com</span>'
          :'<span style="color:var(--accent)">Borrador creado en Gmail (Borradores de Angie) - solo falta apretar Enviar</span>');
        var gb=document.getElementById('dg-gmail-btn'); if(gb) gb.style.display='none';
      } else {
        _setSt('dg-draft-st','<span style="color:var(--amberx)">Borrador automatico no disponible ('+esc((d&&d.error)||'instala el addon en el script de tickets')+') - usa el boton de Gmail</span>');
      }
    })
    .catch(function(){_setSt('dg-draft-st','<span style="color:var(--amberx)">Borrador automatico no disponible - usa el boton de Gmail</span>');});

  // Crear el evento en el calendario "Tasks" (10 min, invita a Ashy)
  if(t&&t.due){
    fetch(TICKETS_PROXY+'?secret=evolve-tracker&action=create_event'
        +'&date='+encodeURIComponent(t.due)
        +'&title='+encodeURIComponent('[#TICKET-'+(usedTicket||'')+'] Deadline: '+(t.text||'').slice(0,80))
        +'&desc='+encodeURIComponent('Deadline para: '+(t.text||'')+'\n\nTicket: #'+(usedTicket||'')+'\nCliente: '+(c?c.name:'')+'\nAsignado a: Ashy'))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){
          _setSt('dg-event-st','<span style="color:var(--accent)">Evento creado en Calendar ('+esc(d.calendar||'Tasks')+') - '+esc(t.due)+' 12:00, 10 min, Ashy invitada</span>');
          var cb=document.getElementById('dg-cal-btn'); if(cb) cb.style.display='none';
        } else {
          _setSt('dg-event-st','<span style="color:var(--amberx)">Evento automatico no disponible ('+esc((d&&d.error)||'instala el addon en el script de tickets')+') - usa el boton de Calendar</span>');
        }
      })
      .catch(function(){_setSt('dg-event-st','<span style="color:var(--amberx)">Evento automatico no disponible - usa el boton de Calendar</span>');});
  }

  if(modal) modal.innerHTML='<div class="modal-overlay"><div class="modal" style="max-width:480px">'
    +'<div class="modal-title" style="color:#1D9E75;margin-bottom:12px">Ticket #'+esc(String(usedTicket||''))+' delegado</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px;font-size:11.5px;margin-bottom:14px">'
    +'<div id="dg-draft-st" style="color:var(--text3)">'+(localStorage.getItem('evold-delegate-send')==='1'?'Enviando mail a Ashy...':'Creando borrador en Gmail...')+'</div>'
    +(t&&t.due?'<div id="dg-event-st" style="color:var(--text3)">Creando evento en Calendar (Tasks)...</div>':'<div style="color:var(--text3)">Sin deadline - no se crea evento de Calendar</div>')
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +'<a id="dg-gmail-btn" href="'+gmailUrl+'" target="_blank" class="btn btn-primary" style="text-align:center;text-decoration:none;padding:10px 16px">'
    +'Abrir en Gmail - ashy@evolvemindhub.com</a>'
    +(calUrl?'<a id="dg-cal-btn" href="'+calUrl+'" target="_blank" class="btn btn-sm" style="text-align:center;text-decoration:none;padding:8px">'
      +'Crear evento en Calendar (deadline '+esc(t.due)+')</a>':'')
    +'</div>'
    +'<div style="margin-top:16px;display:flex;justify-content:flex-end">'
    +'<button class="btn btn-sm" onclick="_delegateClose()">Cerrar</button>'
    +'</div></div></div>';
}


async function extractTasksFromCalls(clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  var apiKey=localStorage.getItem('evold-anthropic-key');
  if(!apiKey){toast('Configura tu API key de Anthropic','red');return;}
  var calls=c.fathomCalls||[];
  if(!calls.length){toast('No hay llamadas de Fathom cargadas','red');return;}
  // Only use the latest call
  var lastCall=calls[0];
  var btn=document.getElementById('extract-tasks-btn');
  if(btn){btn.disabled=true;btn.textContent='Extrayendo...';}
  var callText='Llamada: '+lastCall.date+' - '+lastCall.title+'\n'+(lastCall.summary||'');
  var prompt='De esta llamada con el cliente '+c.name+', extrae TODAS las tareas y proximos pasos mencionados.\n\n'
    +callText+'\n\n'
    +'Responde SOLO con un array JSON valido, sin texto adicional, sin markdown:\n'
    +'[{"text":"descripcion concreta de la tarea","responsible":"nombre del responsable","due":"YYYY-MM-DD o vacio"}]\n'
    +'El responsable puede ser "Angie", el nombre del cliente, u otra persona mencionada.\n'
    +'Solo tareas concretas y accionables.';
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:800,messages:[{role:'user',content:prompt}]})
    });
    var data=await r.json();
    if(data.error) throw new Error(data.error.message);
    var text=data.content[0].text.trim();
    // Strip any markdown fences
    text=text.replace(/^[^\[]*\[/,'[').replace(/\][^\]]*$/,']');
    var extracted=JSON.parse(text);
    c.tasks=c.tasks||[];
    var added=0;
    extracted.forEach(function(t){
      var dup=(c.tasks||[]).some(function(e){return e.text.toLowerCase()===t.text.toLowerCase();});
      if(!dup){
        c.tasks.unshift({id:Date.now()+added,text:t.text,responsible:t.responsible||'',due:t.due||'',done:false,source:lastCall.date+' - '+lastCall.title});
        added++;
      }
    });
    save();renderTab();
    toast(added+' tareas extraidas de la ultima llamada');
  }catch(e){
    toast('Error: '+e.message,'red');
  }
  if(btn){btn.disabled=false;btn.textContent='Extraer de: '+esc(lastCall.date);}
}

async function runSQLAnalysis(clientId){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c) return;
  var apiKey=localStorage.getItem('evold-anthropic-key');
  if(!apiKey){toast('Configura tu API key de Anthropic primero','red');return;}
  var btn=document.getElementById('sql-diag-btn');
  var res=document.getElementById('sql-diag-result');
  if(btn){btn.disabled=true;btn.textContent='Analizando...';}
  if(res) res.innerHTML='<span style="color:var(--text3)">Generando analisis...</span>';

  var sqlLeads=(c.ghl&&c.ghl.opportunities||[]).filter(function(o){return o._sql;});
  var lines=c.conversionLines||[];

  function findLine(opp){
    var d=opp.createdAt?new Date(opp.createdAt):null;
    if(!d) return lines[lines.length-1]||null;
    for(var i=0;i<lines.length;i++){
      var s=lines[i].dateStart?new Date(lines[i].dateStart):null;
      var e=lines[i].dateEnd?new Date(lines[i].dateEnd):new Date();
      if(s&&d>=s&&d<=e) return lines[i];
    }
    return lines[lines.length-1]||null;
  }

  var leadText=sqlLeads.map(function(o,i){
    var l=findLine(o);
    return (i+1)+'. '+(o.contactName||o.name||'Lead')
      +' | Fecha: '+(o.createdAt?new Date(o.createdAt).toLocaleDateString('es-AR'):'-')
      +' | Anuncio: '+(o.source&&(o.source.utmAd||o.source.utmCampaign)||'sin dato')
      +' | Ubicacion: '+(o.geo&&(o.geo.location||o.geo.city)||'sin dato')
      +' | Stage: '+(o.pipelineStage||'sin dato')
      +' | Linea: '+(l?(l.version||l.campaign||'linea'):'sin dato');
  }).join('\n');

  var linesText=lines.map(function(l){
    return '- '+(l.version||'Linea')+': '+l.campaign
      +(l.dateStart?' desde '+l.dateStart:'')
      +(l.dateEnd?' hasta '+l.dateEnd:' (activa)')
      +(l.metrics&&l.metrics.cpl?' CPL $'+l.metrics.cpl:'');
  }).join('\n');

  var calls=c.fathomCalls||[];
  var callsText=calls.length?calls.slice(0,6).map(function(cl){
    return '- '+cl.date+' '+cl.title+(cl.summary?': '+cl.summary.substring(0,250):'');
  }).join('\n'):'Sin llamadas registradas';

  var prompt='Sos analista de performance para una agencia de software B2B.\n\n'
    +'CLIENTE: '+c.name+(c.industry?' ('+c.industry+')':'')+'\n\n'
    +'LEADS SQL ('+sqlLeads.length+'):\n'+leadText+'\n\n'
    +'LINEAS DE CONVERSION:\n'+linesText+'\n\n'
    +'LLAMADAS CON EL CLIENTE (Fathom):\n'+callsText+'\n\n'
    +'Analiza estos SQLs y genera un informe con estas secciones:\n'
    +'1. PATRON DE ANUNCIOS: que anuncios generaron mas SQLs\n'
    +'2. PERFIL GEOGRAFICO: de donde vienen\n'
    +'3. LINEA DE CONVERSION: en que bloque calificaron\n'
    +'4. VOZ DEL CLIENTE: que dijo el cliente sobre estos leads en las llamadas\n'
    +'5. RECOMENDACIONES: 3 acciones concretas para la proxima linea\n\n'
    +'Responde en espanol, conciso y accionable. Usa <strong> para titulos y <br><br> entre secciones.';

  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    var data=await r.json();
    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
    if(!data.content||!data.content[0]) throw new Error('Respuesta vacia: '+JSON.stringify(data));
    var text=data.content[0].text||'Sin respuesta';
    c._sqlAnalysis=text;
    save();
    if(res) res.innerHTML=text;
  }catch(e){
    if(res) res.innerHTML='<span style="color:var(--redx)">Error: '+esc(e.message)+'</span>';
  }
  if(btn){btn.disabled=false;btn.textContent='Regenerar';}
}

function toggleSQL(clientId, oppId, checked){
  var c=DB.clients.find(function(x){return x.id===clientId;});
  if(!c||!c.ghl||!c.ghl.opportunities) return;
  var opp=c.ghl.opportunities.find(function(o){return o.id===oppId;});
  if(!opp) return;
  opp._sql=checked;
  save();
  // Update SQL count in header metrics without full re-render
  var sqlCount=c.ghl.opportunities.filter(function(o){return o._sql;}).length;
  var el=document.getElementById('ghl-sql-count');
  if(el) el.textContent=sqlCount;
}

function saveColSelector(){
  const checks=document.querySelectorAll('#modal-root input[type=checkbox]');
  const selected=[];
  checks.forEach(function(ch){if(ch.checked) selected.push(ch.value);});
  if(!selected.length){toast('Selecciona al menos una columna','red');return;}
  const needsEnrich=['Anuncio','Fuente','Ubicacion','UTM campaign'];
  const wantsEnrich=selected.some(function(col){return needsEnrich.indexOf(col)>=0;});
  _ghlCols=selected;
  closeModal();
  renderTab();
  // If user selected a column that needs enrichment, start background enrichment
  if(wantsEnrich){
    const c=DB.clients.find(function(x){return x.id===S.clientId;});
    const proxy=getGhlProxy();
    if(c&&c.ghl&&c.ghl.opportunities&&proxy.url){
      toast('Cargando datos de contactos...');
      enrichContactsBackground(c, proxy);
    }
  }
}

// Deriva el CONJUNTO DE ANUNCIOS real de un lead. Prioridad:
//  1) parametro explicito de adset en la URL (utm_adset / adset / conjunto)
//  2) match del anuncio contra el arbol Meta por ID (exacto) o por nombre UNICO
//  3) ultimo recurso: utm_medium (suele ser una etiqueta generica, no el adset real)
// Placement del lead (Stories, Reels, Feed, etc.). Sale del parametro {{placement}} de Meta en la URL.
function _prettyPlacement(v){
  if(!v) return '';
  var s=String(v).toLowerCase().trim();
  var map={
    'instagram_stories':'Instagram Stories','ig_stories':'Instagram Stories','instagram_story':'Instagram Stories',
    'facebook_stories':'Facebook Stories','fb_stories':'Facebook Stories',
    'instagram_reels':'Instagram Reels','ig_reels':'Instagram Reels','facebook_reels':'Facebook Reels','fb_reels':'Facebook Reels',
    'instagram_reels_overlay':'IG Reels (overlay)','facebook_reels_overlay':'FB Reels (overlay)',
    'instagram_feed':'Instagram Feed','ig_feed':'Instagram Feed','facebook_feed':'Facebook Feed','fb_feed':'Facebook Feed','feed':'Feed',
    'facebook_mobile_feed':'Facebook Feed (mobile)','facebook_desktop_feed':'Facebook Feed (desktop)',
    'instagram_explore':'Instagram Explore','instagram_explore_home':'IG Explore Home','instagram_explore_grid_home':'IG Explore Home','biz_disco_feed':'IG Explore Home',
    'instagram_profile_feed':'IG Perfil','instagram_search':'IG Búsqueda','search':'Búsqueda',
    'messenger_inbox':'Messenger','messenger_stories':'Messenger Stories',
    'facebook_marketplace':'Marketplace','marketplace':'Marketplace','facebook_instream_video':'In-stream Video','instream_video':'In-stream Video','video_feeds':'Video Feeds',
    'facebook_instant_articles':'Instant Articles','facebook_right_column':'Columna derecha','right_hand_column':'Columna derecha',
    'an_classic':'Audience Network','rewarded_video':'Audience Network (video)','an':'Audience Network'
  };
  if(map[s]) return map[s];
  return s.replace(/[_\-]+/g,' ').replace(/\b\w/g,function(ch){return ch.toUpperCase();});
}
function _derivePlacement(c, opp){
  var fa=opp.formAnswers||{}, s=opp.source||{};
  var faOne=function(key){ for(var k in fa){ if(_n(k).replace(/[_\s-]/g,'')===key){ var v=String(fa[k]||'').trim(); if(v) return v; } } return ''; };
  var _fromUrl=function(u){ var m=String(u||'').match(/[?&](?:utm_)?placement=([^&"'\s\\}]+)/i); return m?decodeURIComponent(m[1].replace(/\+/g,' ')).trim():''; };
  var raw=(s.utmPlacement||'')||faOne('placement')||faOne('utmplacement')||faOne('hsaplacement')
    ||_fromUrl(s.referrer)||_fromUrl(s.url)||_fromUrl(faOne('url'))||_fromUrl(faOne('documenturl'));
  return _prettyPlacement(raw);
}
function _deriveAdset(c, opp){
  var fa=opp.formAnswers||{}, s=opp.source||{};
  var faOne=function(key){ for(var k in fa){ if(_n(k).replace(/[_\s-]/g,'')===key){ var v=String(fa[k]||'').trim(); if(v) return v; } } return ''; };
  var _fromUrl=function(u){ var m=String(u||'').match(/[?&]utm_adset=([^&"'\s\\}]+)/i); return m?decodeURIComponent(m[1].replace(/\+/g,' ')).trim():''; };
  // 0) adset directo de la URL de atribucion (fuente de verdad del click)
  var urlAdset=_fromUrl(s.referrer)||_fromUrl(s.url)||_fromUrl(faOne('url'))||_fromUrl(faOne('documenturl'))||_fromUrl(fa['document URL'])||_fromUrl(fa['URL']);
  if(!urlAdset){ for(var kk in fa){ var vv=String(fa[kk]||''); if(vv.indexOf('utm_adset=')>=0){ urlAdset=_fromUrl(vv); if(urlAdset) break; } } }
  if(urlAdset) return urlAdset;
  // 1) adset explicito
  var explicit=(s.utmAdset||'')||faOne('utmadset')||faOne('adset')||faOne('conjunto');
  if(explicit) return explicit;
  // 2) derivar del arbol Meta
  var al=getActiveLine(c.conversionLines||[]);
  var camps=(al&&al.metaCampaigns)||[];
  if(camps.length){
    var mapId={}, mapName={}; // mapName: nombre -> {adset:1,...} para detectar ambiguedad
    camps.forEach(function(cp){ (cp.adsets||[]).forEach(function(as){
      var asn=as.name||String(as.id||''); if(!asn) return;
      if(as.id) mapId[String(as.id)]=asn;
      (as.ads||[]).forEach(function(ad){
        if(ad.id) mapId[String(ad.id)]=asn;
        if(ad.name){ var kk='n:'+_n(ad.name); (mapName[kk]=mapName[kk]||{})[asn]=1; }
      });
    }); });
    var idCands=[s.adId, s.adsetId, faOne('adsetid'), faOne('utmad'), faOne('utmcontent')];
    for(var i=0;i<idCands.length;i++){ var v=String(idCands[i]||'').trim(); if(v&&mapId[v]) return mapId[v]; }
    var nameCands=[s.utmAd, s.utmContent, faOne('utmad'), faOne('utmcontent')];
    for(var j=0;j<nameCands.length;j++){ var vn=_n(nameCands[j]||''); if(!vn) continue; var set=mapName['n:'+vn]; if(set && Object.keys(set).length===1) return Object.keys(set)[0]; }
  }
  // 3) etiqueta generica como ultimo recurso
  return (s.utmMedium||'')||faOne('utmmedium')||'';
}
async function openOppDetail(oppId){
  const c=DB.clients.find(function(x){return x.id===S.clientId;});
  if(!c) return;
  const opp=(c.ghl&&c.ghl.opportunities||[]).find(function(o){return o.id===oppId;});
  if(!opp) return;
  const _est=deriveEstado(opp);
  const stColor=_est.color;

  function renderModal(notes, loading, err){
    let notesHtml='';
    if(loading){
      notesHtml='<div style="text-align:center;padding:24px;color:var(--text3);font-size:12px">Cargando notas...</div>';
    } else if(err){
      notesHtml='<div style="padding:16px;color:var(--redx);font-size:12px">'+err+'</div>';
    } else if(!notes||!notes.length){
      notesHtml='<div style="text-align:center;padding:24px;color:var(--text3);font-size:12px">Sin notas registradas.</div>';
    } else {
      notesHtml=notes.map(function(n){
        const date=n.createdAt?new Date(n.createdAt).toLocaleDateString('es-AR'):'';
        var esc2=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
        // La nota de GHL puede venir como HTML (Fathom guarda los links con <a>). La limpiamos:
        var _clean=String(n.body||'')
          .replace(/<a\b[^>]*href="([^"]*)"[^>]*>[\s\S]*?<\/a>/gi,' $1 ')
          .replace(/<\s*br\s*\/?>/gi,'\n').replace(/<\/(p|div|li)>/gi,'\n')
          .replace(/<[^>]+>/g,'')
          .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#0?39;/gi,"'")
          .replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
        var bodyHtml=esc2(_clean).replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" style="color:var(--green);text-decoration:none;word-break:break-all">'+u+'</a>';}).replace(/\n/g,'<br>');
        var badge=n.isLink
          ? '<span style="font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;background:rgba(55,138,221,0.15);color:#6aabf0">Llamada grabada</span>'
          : '<span style="font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--bg4);color:var(--text2)">Nota del closer</span>';
        return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px">'
          +'<div style="display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px">'
          +badge
          +(date?'<span style="font-size:10px;color:var(--text3)">'+date+'</span>':'')+'</div>'
          +'<div style="font-size:12px;color:var(--text2);line-height:1.7;word-break:break-word">'+(bodyHtml||'<span style="color:var(--text3)">(nota vacia)</span>')+'</div>'
          +'</div>';
      }).join('');
    }
    const faHide2=['utm_ad','utm ad','timezone','time zone','zona horaria','ip','order id','payment status','email verified','phone verified','submission date','url'];
    const _looksLikeId=function(k){var s=String(k||'');return !/\s/.test(s) && s.length>=15 && /[a-z]/.test(s) && /[A-Z]/.test(s) && !/[?¿()/@.]/.test(s);};
    const faAll=Object.keys(opp.formAnswers||{}).filter(function(k){var kl=k.toLowerCase().trim();return faHide2.indexOf(kl)<0 && !_looksLikeId(k) && String((opp.formAnswers||{})[k]||'').trim()!=='';});
    const faHtml=faAll.length?('<div style="font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Respuestas del formulario</div>'
      +'<div style="margin-bottom:16px">'
      +faAll.map(function(k){return '<div style="display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-top:0.5px solid var(--border);font-size:13px"><span style="color:var(--text3)">'+esc(k)+'</span><span style="color:var(--text2);text-align:right">'+esc((opp.formAnswers||{})[k])+'</span></div>';}).join('')
      +'</div>'):'';
    const tagsAll=opp.tags||[];
    const tagsHtml2=tagsAll.length?('<div style="margin-bottom:16px"><div style="font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Tags</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+tagsAll.map(function(t){return '<span class="pill" style="font-size:10px;padding:3px 9px;background:var(--bg3);border:0.5px solid var(--border);color:var(--text2)">'+esc(t)+'</span>';}).join('')+'</div></div>'):'';
    var _adsetU=_deriveAdset(c,opp);
    var _origenChips=[];
    if(opp.source&&opp.source.utmSource) _origenChips.push(opp.source.utmSource);
    if(_adsetU) _origenChips.push(_adsetU);
    if(opp.source&&opp.source.utmAd) _origenChips.push(opp.source.utmAd);
    var _placeU=_derivePlacement(c,opp);
    if(_placeU) _origenChips.push(_placeU);
    if(opp.source&&opp.source.utmCampaign) _origenChips.push(opp.source.utmCampaign);
    const utmHtml=_origenChips.length?('<div style="font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px">Origen</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">'
      +_origenChips.map(function(t){return '<span style="font-size:11px;padding:4px 10px;border-radius:var(--radius);background:var(--bg3);color:var(--text2)">'+esc(t)+'</span>';}).join('')
      +'</div>'):'';
    document.getElementById('modal-root').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'
      +'<div class="modal" style="max-width:540px">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">'
      +'<div><div class="modal-title">'+esc(opp.contactName||opp.name)+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">'
      +'<span style="font-size:11px;color:'+stColor+'">'+esc(_est.label)+'</span>'
      +(opp.pipelineStage?'<span style="font-size:11px;color:var(--text3)">'+esc(opp.pipelineStage)+'</span>':'')
      +(opp.monetaryValue?'<span style="font-size:11px;color:var(--text2)">'+money(opp.monetaryValue)+'</span>':'')
      +'</div></div>'
      +'<button class="btn btn-sm" onclick="closeModal()">Cerrar</button></div>'
      +utmHtml
      +tagsHtml2
      +faHtml
      +'<div style="font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin:6px 0 10px">Notas</div>'
      +'<div id="notes-content">'+notesHtml+'</div>'
      +'</div></div>';
  }

  renderModal(null, true, null);
  const proxy=getGhlProxy();
  if(!proxy.url||!proxy.secret||!c.ghl||!c.ghl.token){
    renderModal(null,false,'Configura la conexion con GHL primero'); return;
  }
  const base=proxy.url+(proxy.url.indexOf('?')>=0?'&':'?')
    +'secret='+encodeURIComponent(proxy.secret)
    +'&token='+encodeURIComponent(c.ghl.token)
    +'&location='+encodeURIComponent(c.ghl.locationId);
  try{
    // Fetch notes and contact in parallel
    const notesUrl=base+'&action=notes'+(opp.contactId?'&contactId='+encodeURIComponent(opp.contactId):'&opportunityId='+encodeURIComponent(oppId));
    const contactUrl=opp.contactId ? base+'&action=contact&contactId='+encodeURIComponent(opp.contactId) : null;
    const reqs=[fetch(notesUrl)];
    if(contactUrl) reqs.push(fetch(contactUrl));
    const responses=await Promise.all(reqs);
    const notesTxt=((await responses[0].text())||'').trim();
    if(notesTxt.charAt(0)==='<') throw new Error('El Apps Script devolvio una pagina HTML en vez de datos. Suele ser un limite temporal del script o que el deploy quedo viejo/sin permiso. Proba de nuevo en un momento; si sigue, redeploya el script (Nueva version).');
    let notesData;
    try{ notesData=JSON.parse(notesTxt); }catch(_pe){ throw new Error('Respuesta no valida del script al traer notas.'); }
    if(!notesData.ok) throw new Error(notesData.error||'Error al traer notas');
    if(responses[1]){
      try{
        const cTxt=((await responses[1].text())||'').trim();
        if(cTxt.charAt(0)!=='<'){
          const cData=JSON.parse(cTxt);
          if(cData.ok){
            if(cData.utmAd && !opp.source.utmAd) opp.source.utmAd=cData.utmAd;
            if(cData.location && !opp.geo.location) opp.geo.location=cData.location;
            if(cData.utmCampaign && !opp.source.utmCampaign) opp.source.utmCampaign=cData.utmCampaign;
            if(cData.utmSource && !opp.source.utmSource) opp.source.utmSource=cData.utmSource;
            const cTags=cData.tags||cData.contactTags||null;
            if(cTags && Array.isArray(cTags) && cTags.length) opp.tags=cTags;
            save();
          }
        }
      }catch(_ce){}
    }
    renderModal(notesData.notes,false,null);
  }catch(e){
    renderModal(null,false,e.message);
  }
}

function applyTheme(t){
  document.body.classList.toggle('light', t==='light');
  var b=document.getElementById('theme-toggle-btn');
  if(b){ b.innerHTML=(t==='light'?'&#9789;':'&#9788;'); b.title=(t==='light'?'Cambiar a modo oscuro':'Cambiar a modo claro'); }
}
function toggleTheme(){
  var t=document.body.classList.contains('light')?'dark':'light';
  localStorage.setItem('evold-theme',t);
  applyTheme(t);
}
