<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal EVOLVE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Los mismos tokens del tracker, copiados y no importados: este archivo no
     comparte CSS con index.html a proposito, porque son dos publicaciones
     distintas y el portal no tiene que arrastrar nada de la agencia. */
  :root{
    --bg:#0d0d0d; --bg2:#141414;
    --text:#f0f0f0; --text2:#999; --text3:#555;
    --strong:#fff; --accent:#4ecfa0;
    --border:rgba(255,255,255,0.08);
    --font:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    min-height:100%; background:var(--bg); color:var(--text);
    font-family:var(--font); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  /* El alto de la ventana y no 100vh: en los telefonos el vh no descuenta la
     barra del navegador y la pantalla queda mas alta que lo que se ve. */
  .todo{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; gap:18px;
  }
  .marca{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--text3); font-weight:500;
  }
  h1{
    font-size:clamp(24px, 7vw, 34px); font-weight:500;
    color:var(--strong); line-height:1.25; max-width:16ch;
  }
  .punto{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); margin-right:8px; vertical-align:middle;
  }
  .estado{
    font-size:14px; color:var(--text2); max-width:34ch;
    border-top:1px solid var(--border); padding-top:18px; margin-top:4px;
  }
  .pie{ font-size:12px; color:var(--text3); }
</style>
</head>
<body>
  <main class="todo">
    <div class="marca">EVOLVE</div>
    <h1>Portal <span style="color:var(--accent)">EVOLVE</span></h1>
    <p class="estado"><span class="punto"></span>En construcción. Muy pronto vas a poder ver acá el estado de tu proyecto.</p>
    <p class="pie">Si necesitás algo mientras tanto, escribinos como siempre.</p>
  </main>
</body>
</html>
