<script>
'use strict';

const $ = id => document.getElementById(id);

const ICONO_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.7-1.5-3.8-3.4-.3-.5.3-.5.8-1.5.1-.2 0-.3 0-.5s-.6-1.6-.9-2.2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.5.7.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3.1.8.8-3-.2-.3c-.8-1.3-1.3-2.9-1.3-4.4C3.7 7.4 7.4 3.7 12 3.7S20.3 7.4 20.3 12 16.6 20.2 12 20.2z"/></svg>';

/* ══════════════════════════════════════════════════════════════
   SESIÓN
   Guardamos el token en localStorage igual que hace la librería
   oficial de Supabase. Es el token del cliente, en su propio
   teléfono, y vence solo. Acá no hay ninguna clave de servicio.
   ══════════════════════════════════════════════════════════════ */
const LLAVE = 'portal-evolve-sesion';
let sesion = null;

function cargarSesion(){
  try { sesion = JSON.parse(localStorage.getItem(LLAVE) || 'null'); }
  catch(_){ sesion = null; }
}
function guardarSesion(s){
  sesion = s;
  try { s ? localStorage.setItem(LLAVE, JSON.stringify(s)) : localStorage.removeItem(LLAVE); }
  catch(_){ /* modo incógnito: la sesión dura lo que dure la pestaña */ }
}

async function entrar(mail, clave){
  const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ apikey:SB_KEY, 'content-type':'application/json' },
    body: JSON.stringify({ email:mail, password:clave })
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error_description || d.msg || d.message || 'No pudimos entrar');
  guardarSesion(d);
  return d;
}

async function refrescar(){
  if(!sesion || !sesion.refresh_token) return false;
  const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{ apikey:SB_KEY, 'content-type':'application/json' },
    body: JSON.stringify({ refresh_token: sesion.refresh_token })
  });
  if(!r.ok){ guardarSesion(null); return false; }
  guardarSesion(await r.json());
  return true;
}

/* Pedir el mail para cambiar la contraseña.

   ⚠️  SIEMPRE contesta lo mismo, exista o no la cuenta, y por eso ni mira la
       respuesta. Si dijera "ese mail no tiene cuenta", cualquiera podría
       averiguar quiénes son nuestros clientes probando direcciones de a una.
       El error de red tampoco se muestra: distinguirlo también sería una
       pista. Si algo falla de verdad, la persona no recibe el mail y vuelve
       a pedirlo.

   ⚠️  `redirect_to` es lo que hace que el link del mail vuelva ACÁ. Sin esto
       Supabase usa el Site URL del proyecto, que hoy apunta al tracker, y el
       cliente termina en la app interna de la agencia. No es un redirect
       abierto: Supabase sólo acepta destinos que estén en su lista de
       Redirect URLs. */
async function recuperar(mail){
  const destino = encodeURIComponent(location.origin + location.pathname);
  try{
    await fetch(SB_URL + '/auth/v1/recover?redirect_to=' + destino, {
      method:'POST',
      headers:{ apikey:SB_KEY, 'content-type':'application/json' },
      body: JSON.stringify({ email:mail, gotrue_meta_security:{} })
    });
  }catch(_){ /* a propósito: la respuesta no cambia lo que mostramos */ }
}

/* Lo que vuelve en el link del mail viaja en el fragmento de la URL
   (#access_token=...&type=recovery), que no se manda al servidor.

   Devuelve {token, refresh, expira} si el link es bueno, {error} si venció,
   o null si esta carga no viene de ningún mail. */
function _delMail(){
  const h = String(location.hash || '').replace(/^#/, '');
  if(!h) return null;
  const p = {};
  for(const par of h.split('&')){
    const i = par.indexOf('=');
    if(i > 0){
      try { p[decodeURIComponent(par.slice(0,i))] = decodeURIComponent(par.slice(i+1)); }
      catch(_){ /* fragmento mal armado */ }
    }
  }
  // Leído, el token no tiene por qué quedar en la barra ni en el historial.
  const limpiar = () => {
    try { history.replaceState(null, '', location.pathname + location.search); }
    catch(_){}
  };
  // Un link vencido no vuelve con token: vuelve con un error acá adentro.
  // Sin esto la persona cae en el formulario de entrar sin entender por qué.
  if(p.error || p.error_code){
    limpiar();
    return { error: /expired/i.test(p.error_code || p.error_description || '')
      ? 'Ese link ya venció. Pedí uno nuevo desde "Olvidé mi contraseña".'
      : 'Ese link no sirve. Pedí uno nuevo desde "Olvidé mi contraseña".' };
  }
  if(!p.access_token) return null;
  if(p.type !== 'recovery' && p.type !== 'invite') return null;
  limpiar();
  return { token:p.access_token, refresh:p.refresh_token || '',
           expira:parseInt(p.expires_in || '3600', 10) };
}

/* ── Las reglas de la contraseña ──────────────────────────────────────
   Tienen que ser LAS MISMAS que las del proyecto en Supabase. Si acá
   pedimos menos, la persona pasa este chequeo y la frena el servidor con
   un mensaje en inglés; si pedimos más, la frenamos nosotros sin motivo.

   ⚠️  Estos dos valores son la copia de lo que dice
       Supabase -> Authentication -> Providers -> Email:
         · "Minimum password length"
         · "Password Requirements"
       Si allá se cambian, acá también. No hay forma de leerlos desde el
       navegador: la API valida el carnet antes que la contraseña, así que
       nunca contesta cuáles son sus reglas.

   El conjunto de símbolos NO es "todo lo que no sea letra ni número": es
   esta lista, la que usa Supabase. Un caracter de afuera (una ñ, un
   acento, un espacio) no cuenta como símbolo para el servidor, y si acá
   lo contáramos volveríamos a tener el error que esto viene a evitar. */
const CLAVE_LARGO   = 12;
const CLAVE_SIMBOLOS = '!@#$%^&*()_+-=[]{};\'\\:"|<>?,./`~';

const CLAVE_REGLAS = [
  { falta:'largo',     ok: p => p.length >= CLAVE_LARGO,
    texto:'al menos ' + CLAVE_LARGO + ' caracteres' },
  { falta:'mayuscula', ok: p => /[A-Z]/.test(p),        texto:'una mayúscula' },
  { falta:'minuscula', ok: p => /[a-z]/.test(p),        texto:'una minúscula' },
  { falta:'numero',    ok: p => /[0-9]/.test(p),        texto:'un número' },
  { falta:'simbolo',   ok: p => [...p].some(c => CLAVE_SIMBOLOS.includes(c)),
    texto:'un símbolo' },
];

const _lista = xs => xs.length < 2 ? (xs[0] || '')
  : xs.slice(0,-1).join(', ') + ' y ' + xs[xs.length-1];

/* La pista de abajo del campo se arma con LAS MISMAS reglas que validan.
   Escrita a mano se separaban: eso fue exactamente el bug: el texto decía
   8 y el servidor pedía 12. */
const CLAVE_PISTA = (t => t[0].toUpperCase() + t.slice(1))(CLAVE_REGLAS[0].texto)
  + ', con ' + _lista(CLAVE_REGLAS.slice(1).map(r => r.texto)) + '.';

/* Devuelve el mensaje de lo que falta, o '' si está bien. Se nombra todo
   lo que falta junto: decirlo de a uno obliga a probar cinco veces. */
function revisarClave(p){
  const faltan = CLAVE_REGLAS.filter(r => !r.ok(p)).map(r => r.texto);
  if(!faltan.length) return '';
  if(faltan.length === 1) return 'A la contraseña le falta ' + faltan[0] + '.';
  return 'A la contraseña le falta: ' + _lista(faltan) + '.';
}

/* Guarda la contraseña nueva usando el token del mail y deja la sesión
   armada, para que la persona entre sin tener que loguearse otra vez. */
async function guardarClave(delMail, clave){
  const r = await fetch(SB_URL + '/auth/v1/user', {
    method:'PUT',
    headers:{ apikey:SB_KEY, authorization:'Bearer ' + delMail.token,
              'content-type':'application/json' },
    body: JSON.stringify({ password: clave })
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok){
    const crudo = d.msg || d.message || d.error_description || ('Error ' + r.status);
    // El mensaje de Supabase para un token vencido habla de firmas y segmentos,
    // que no le dice nada a nadie y encima apunta al lado equivocado: no hay
    // nada que corregir en la contraseña.
    if(/jwt|token|expired|invalid/i.test(crudo) && !/password|contrase/i.test(crudo)){
      throw new Error('Ese link ya venció. Pedí uno nuevo desde "Olvidé mi contraseña".');
    }
    // Si el servidor igual la rechaza, es que sus reglas y las de arriba se
    // separaron. El mensaje crudo viene en inglés y enumera los alfabetos
    // permitidos, asi que se muestra el nuestro. Que llegue acá es un aviso
    // de que hay que revisar CLAVE_LARGO y CLAVE_REGLAS contra el panel.
    if(d.error_code === 'weak_password' || d.weak_password
       || /password/i.test(crudo)){
      throw new Error('Esa contraseña no la acepta el sistema. ' + CLAVE_PISTA);
    }
    throw new Error(crudo);
  }
  guardarSesion({ access_token:delMail.token, refresh_token:delMail.refresh,
                  expires_in:delMail.expira, token_type:'bearer', user:d });
}

/* Un solo lugar por donde pasan todos los pedidos. Si el token venció,
   lo renueva una vez y reintenta; si tampoco, cierra la sesión. */
async function api(ruta, opciones = {}, reintento = true){
  const r = await fetch(SB_URL + ruta, {
    ...opciones,
    headers: {
      apikey: SB_KEY,
      authorization: 'Bearer ' + (sesion ? sesion.access_token : ''),
      'content-type': 'application/json',
      ...(opciones.headers || {})
    }
  });
  if(r.status === 401 && reintento){
    if(await refrescar()) return api(ruta, opciones, false);
    salir();
    throw new Error('Se cerró la sesión. Entrá de nuevo.');
  }
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : null;
  if(!r.ok) throw new Error((d && (d.message || d.error || d.hint)) || ('Error ' + r.status));
  return d;
}

/* ══════════════════════════════════════════════════════════════
   DATOS
   ══════════════════════════════════════════════════════════════ */
let ETAPAS = [];   // vienen de la base, no están escritas acá
let LEADS  = [];
let filtro = 'todos';
let abierto = null;
let busca = '';

const etapaDe = v => ETAPAS.find(e => e.slug === v) || null;

/* Las columnas de `leads` pueden llamarse distinto según de dónde vino el
   dato. Buscamos el primer nombre que exista en vez de asumir uno. */
function campo(o, nombres){
  for(const n of nombres){
    if(o && o[n] !== undefined && o[n] !== null && o[n] !== '') return o[n];
  }
  return null;
}
const telDe    = l => campo(l, ['telefono','phone','celular','tel','contact_phone']);
const nombreDe = l => campo(l, ['nombre','name','contact_name','contactName']) || 'Sin nombre';
const origenDe = l => campo(l, ['origen','source','fuente','utm_source']);
const fechaDe  = l => campo(l, ['creado_at','created_at','fecha','createdAt']);

async function traerEtapas(){
  // La función ignora el cliente que le mandemos y usa el del token.
  ETAPAS = await api('/rest/v1/rpc/etapas_de', {
    method:'POST', body: JSON.stringify({ p_cliente: null })
  }) || [];
  ETAPAS = ETAPAS.filter(e => e.activa);
}

async function traerLeads(){
  // La RLS ya filtra por cliente: no hace falta (ni sirve) filtrar acá.
  LEADS = await api('/rest/v1/leads?select=*&order=creado_at.desc.nullslast') || [];
}

/* Se escribe por lead_datos, que toca la nota y el monto y NADA mas: el
   nombre, el telefono, la etapa y el estado ni aparecen en su update. */
async function guardarDatos(lead, nota, monto, borrarNota, borrarMonto){
  await api('/rest/v1/rpc/lead_datos', {
    method:'POST',
    body: JSON.stringify({ p_lead_id: lead.id, p_nota: nota, p_monto: monto,
                           p_borrar_nota: !!borrarNota, p_borrar_monto: !!borrarMonto })
  });
}

async function guardarEtapa(lead, slug, monto){
  await api('/rest/v1/rpc/lead_etapa', {
    method:'POST',
    body: JSON.stringify({ p_lead_id: lead.id, p_etapa: slug, p_monto: monto })
  });
}

/* ══════════════════════════════════════════════════════════════
   PINTAR
   ══════════════════════════════════════════════════════════════ */
const fmtMonto = n => '$' + Number(n).toLocaleString('es-AR');
const soloDigitos = t => String(t).replace(/[^\d]/g,'');

/* El numero para wa.me. GHL guarda el telefono crudo, y en Argentina lo manda
   como +54 <area> <numero>, SIN el 9. WhatsApp necesita 54 9 <area> <numero>:
   sin el 9 abre un chat que no existe y el boton no hace nada.

   Se agrega SOLO si falta y SOLO si el numero es argentino: hay leads que ya
   vienen con el 9 (y agregarselo de nuevo lo rompe al reves) y hay leads de
   Bolivia, Ecuador, Paraguay, Peru, Colombia, Uruguay, Chile y España, donde
   el 9 no va. Por eso se mira el numero, no el pais del cliente.

   No se toca la columna `telefono`: ahi vive el numero como lo dio GHL. Esto
   es solo para armar el link. */
function waNumero(tel){
  const d = soloDigitos(tel);
  if(d.startsWith('54') && d[2] !== '9') return '549' + d.slice(2);
  return d;
}

function diasDesde(iso){
  if(!iso) return null;
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return Number.isFinite(d) ? d : null;
}
function hace(iso){
  const d = diasDesde(iso);
  if(d === null) return '';
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días';
}

const grupoDe = l => { const e = etapaDe(l.etapa_portal); return e ? e.grupo : 'nuevo'; };
const equivaleDe = l => { const e = etapaDe(l.etapa_portal); return e ? e.equivale : 'open'; };

const FILTROS = [
  {v:'todos',     l:'Todos',      f:() => true},
  {v:'avanzando', l:'En proceso', f:l => ['nuevo','avanzando'].includes(grupoDe(l))},
  {v:'frenado',   l:'Sin avance', f:l => grupoDe(l) === 'frenado'},
  {v:'compro',    l:'Compraron',  f:l => equivaleDe(l) === 'won'},
  {v:'no_compro', l:'No compró',  f:l => grupoDe(l) === 'cerrado' && equivaleDe(l) === 'lost'},
];

/* El aviso que evita que una pantalla vacía mienta.
   "No hay leads" y "hace días que no entra nada" son cosas distintas. */
function pintarAviso(){
  const a = $('aviso');
  if(!LEADS.length){ a.hidden = true; return; }
  const masNuevo = LEADS.map(l => fechaDe(l)).filter(Boolean).sort().pop();
  const d = diasDesde(masNuevo);
  if(d !== null && d >= 3){
    a.hidden = false;
    a.innerHTML = '<div>⚠️</div><div><b>Hace ' + d + ' días que no entra un lead nuevo.</b> '
                + 'Si esperabas que entraran, avisanos: puede ser un problema de la conexión, no de tus campañas.</div>';
  } else {
    a.hidden = true;
  }
}

function pintarNumeros(){
  $('n-total').textContent   = LEADS.length;
  $('n-proceso').textContent = LEADS.filter(FILTROS[1].f).length;
  $('n-compro').textContent  = LEADS.filter(FILTROS[3].f).length;
}

/* Busca en todo lo que el cliente puede tener en la cabeza: el nombre, el
   telefono -con o sin espacios ni guiones-, el mail, la campania y el anuncio. */
const _sinAcento = t => String(t||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function coincide(l){
  if(!busca) return true;
  const q = _sinAcento(busca).trim();
  if(!q) return true;
  const enTexto = [nombreDe(l), l.email, origenDe(l), l.campania, l.anuncio, l.nota]
                    .filter(Boolean).map(_sinAcento).join(' ');
  if(enTexto.includes(q)) return true;
  // El telefono aparte: se comparan solo los digitos, asi "11 2345" encuentra
  // a +5491123456789.
  const qd = soloDigitos(q);
  return qd.length >= 3 && soloDigitos(telDe(l) || '').includes(qd);
}

function pintarChips(){
  // Los contadores cuentan lo que se ve: con una busqueda puesta, decir el
  // total de todos seria decir un numero que no lleva a ninguna lista.
  const base = LEADS.filter(coincide);
  $('chips').innerHTML = FILTROS.map(d =>
    '<button class="chip" data-f="' + d.v + '" aria-pressed="' + (filtro === d.v) + '">'
    + d.l + '<span class="c">' + base.filter(d.f).length + '</span></button>'
  ).join('');
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pintarLista(){
  const def = FILTROS.find(f => f.v === filtro);
  const visibles = LEADS.filter(coincide).filter(def.f);
  const cont = $('lista');

  if(!visibles.length){
    cont.innerHTML = !LEADS.length
      ? '<div class="vacio"><b>Todavía no hay leads</b>Cuando entre el primero, lo vas a ver acá.</div>'
      : busca
      ? '<div class="vacio"><b>Nadie con “' + esc(busca) + '”</b>Probá con parte del nombre o del teléfono.</div>'
      : '<div class="vacio"><b>Nada en este filtro</b>Probá con “Todos”.</div>';
    return;
  }

  cont.innerHTML = visibles.map(l => {
    const e   = etapaDe(l.etapa_portal);
    const tel = telDe(l);
    const org = origenDe(l);
    const col = e && e.color ? e.color : '#999';
    const fondo = 'background:' + col + '1f;color:' + col;
    const metas = [org, hace(fechaDe(l))].filter(Boolean)
                    .map(esc).join('<span class="sep">·</span>');

    return '<div class="lead" data-id="' + esc(l.id) + '">'
      + '<div class="top"><div>'
      +   '<div class="nom">' + esc(nombreDe(l)) + '</div>'
      +   (metas ? '<div class="meta">' + metas + '</div>' : '')
      + '</div>'
      + (tel ? '<a class="wa" href="https://wa.me/' + waNumero(tel) + '" target="_blank" rel="noopener">'
             + ICONO_WA + 'WhatsApp</a>' : '')
      + '</div>'
      + '<div class="fila">'
      +   '<button class="etapa" style="' + fondo + '">'
      +     esc(e ? e.nombre : l.etapa_portal) + '<span class="fl">▾</span></button>'
      +   '<button class="mini' + (l.monto ? ' hay' : '') + '" data-a="monto">'
      +     (l.monto ? fmtMonto(l.monto) : '$ monto') + '</button>'
      +   '<button class="mini' + (l.nota ? ' hay' : '') + '" data-a="nota">'
      +     (l.nota ? 'Ver nota' : '+ nota') + '</button>'
      + '</div>'
      + (l.nota ? '<div class="nota">' + esc(l.nota) + '</div>' : '')
      + '</div>';
  }).join('');
}

function pintar(){ pintarAviso(); pintarNumeros(); pintarChips(); pintarLista(); }

/* ══════════════════════════════════════════════════════════════
   HOJA DE ETAPAS
   ══════════════════════════════════════════════════════════════ */
const TITULOS = [
  {g:'nuevo',     t:'Recién entró'},
  {g:'avanzando', t:'Avanzando'},
  {g:'frenado',   t:'Sin avance'},
  {g:'cerrado',   t:'Cerrado'},
];

function abrirHoja(lead){
  abierto = lead;
  $('hoja-nom').textContent = nombreDe(lead);
  $('hoja-ops').innerHTML = TITULOS.map(gr => {
    const ops = ETAPAS.filter(e => e.grupo === gr.g);
    if(!ops.length) return '';
    return '<div class="grupo">' + gr.t + '</div>'
      + ops.map(e =>
          '<button class="op" data-v="' + esc(e.slug) + '" aria-current="'
          + (lead.etapa_portal === e.slug) + '">'
          + '<span class="pt" style="background:' + (e.color || '#5c5c5c') + '"></span>'
          + esc(e.nombre) + '</button>').join('');
  }).join('');
  $('velo').classList.add('ver');
  $('hoja').classList.add('ver');
}
function cerrarHoja(){
  abierto = null;
  $('velo').classList.remove('ver');
  $('hoja').classList.remove('ver');
}

let tToast;
function avisar(txt, mal){
  const t = $('toast');
  t.textContent = txt;
  t.classList.toggle('mal', !!mal);
  t.classList.add('ver');
  clearTimeout(tToast);
  tToast = setTimeout(() => t.classList.remove('ver'), mal ? 4200 : 2000);
}

/* ══════════════════════════════════════════════════════════════
   CAMBIAR LA ETAPA
   Se pinta enseguida para que se sienta instantáneo, pero si la base
   rechaza el cambio se vuelve atrás y se avisa. Nunca queda mostrando
   algo que no se guardó.
   ══════════════════════════════════════════════════════════════ */
async function cambiarEtapa(lead, slug){
  const e = etapaDe(slug);
  if(!e || lead.etapa_portal === slug) return;

  let monto = null;
  if(e.pide_monto){
    const m = prompt('¿Por cuánto cerró ' + nombreDe(lead) + '?', lead.monto || '');
    if(m === null) return;                       // canceló: no se cambia nada
    monto = Number(soloDigitos(m)) || null;
  }

  const antesEtapa = lead.etapa_portal;
  const antesMonto = lead.monto;
  lead.etapa_portal = slug;
  if(monto !== null) lead.monto = monto;
  pintar();

  const tarjeta = document.querySelector('.lead[data-id="' + CSS.escape(String(lead.id)) + '"]');
  if(tarjeta) tarjeta.classList.add('guardando');

  try{
    await guardarEtapa(lead, slug, monto);
    avisar('Guardado: ' + e.nombre);
  }catch(err){
    lead.etapa_portal = antesEtapa;
    lead.monto = antesMonto;
    avisar('No se guardó: ' + err.message, true);
  }finally{
    pintar();
  }
}

/* Nota y monto. Se pinta primero y si la base lo rechaza se vuelve atras,
   igual que al cambiar de etapa: nunca queda mostrando algo que no se guardo. */
async function editarDato(lead, cual){
  const esMonto = cual === 'monto';
  const actual = esMonto ? (lead.monto == null ? '' : lead.monto) : (lead.nota || '');
  const pedido = prompt(
    esMonto ? '¿Por cuánto es la oportunidad de ' + nombreDe(lead) + '?\n(vacío para borrarlo)'
            : 'Nota sobre ' + nombreDe(lead) + '\n(vacío para borrarla)',
    actual);
  if(pedido === null) return;                       // cancelo

  const vacio = String(pedido).trim() === '';
  const valor = vacio ? null : (esMonto ? (Number(soloDigitos(pedido)) || null) : String(pedido).trim());
  if(esMonto && !vacio && valor === null){ avisar('Ese monto no se entiende', true); return; }

  const antes = { nota: lead.nota, monto: lead.monto };
  if(esMonto) lead.monto = valor; else lead.nota = valor;
  pintar();

  try{
    await guardarDatos(lead,
      esMonto ? null : valor,
      esMonto ? valor : null,
      !esMonto && vacio,
      esMonto && vacio);
    avisar(vacio ? 'Borrado' : 'Guardado');
  }catch(err){
    lead.nota = antes.nota; lead.monto = antes.monto;
    avisar('No se guardó: ' + err.message, true);
    pintar();
  }
}

/* ══════════════════════════════════════════════════════════════
   ARRANQUE
   ══════════════════════════════════════════════════════════════ */
function salir(){
  guardarSesion(null);
  LEADS = []; ETAPAS = [];
  $('p-portal').hidden = true;
  $('p-entrar').hidden = false;
  cerrarHoja();
}

async function mostrarPortal(){
  $('p-entrar').hidden = true;
  $('p-portal').hidden = false;
  $('quien').textContent = (sesion && sesion.user && sesion.user.email) || '';
  try{
    await traerEtapas();
    await traerLeads();
    pintar();
  }catch(err){
    $('lista').innerHTML = '<div class="vacio"><b>No pudimos cargar tus leads</b>'
      + esc(err.message) + '</div>';
  }
}

$('f-entrar').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('b-entrar'), e = $('e-entrar');
  // El mismo cartel puede venir de "te mandamos el mail", que se pinta gris.
  // Si ahora es un error, tiene que volver a rojo.
  b.disabled = true; b.textContent = 'Entrando…'; e.hidden = true; e.classList.remove('ok');
  try{
    await entrar($('i-mail').value.trim(), $('i-clave').value);
    await mostrarPortal();
  }catch(err){
    e.textContent = /invalid/i.test(err.message)
      ? 'El correo o la contraseña no coinciden.'
      : err.message;
    e.hidden = false;
  }finally{
    b.disabled = false; b.textContent = 'Entrar';
  }
});

$('b-olvide').addEventListener('click', async ev => {
  ev.preventDefault();
  const e = $('e-entrar');
  // Si ya escribió el correo arriba, no se lo pedimos de nuevo.
  let mail = $('i-mail').value.trim();
  if(!mail) mail = String(window.prompt('¿Cuál es tu correo?') || '').trim();
  if(!mail) return;
  await recuperar(mail);
  // El mismo texto siempre. Ver el comentario de `recuperar`.
  e.textContent = 'Si esa dirección tiene una cuenta, te mandamos un mail con '
                + 'un link para elegir una contraseña nueva.';
  e.classList.add('ok');
  e.hidden = false;
});

$('f-clave').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('b-clave'), e = $('e-clave');
  const p1 = $('i-nueva').value, p2 = $('i-nueva2').value;
  e.hidden = true;
  if(p1 !== p2){ e.textContent = 'Las dos no coinciden.'; e.hidden = false; return; }
  const falta = revisarClave(p1);
  if(falta){ e.textContent = falta; e.hidden = false; return; }
  b.disabled = true; b.textContent = 'Guardando…';
  try{
    await guardarClave(DEL_MAIL, p1);
    $('p-clave').hidden = true;
    await mostrarPortal();
  }catch(err){
    e.textContent = err.message;
    e.hidden = false;
    b.disabled = false; b.textContent = 'Guardar y entrar';
  }
});

// Se repinta mientras se escribe: con 267 tarjetas alcanza y sobra, y esperar
// a que aprete Enter en un telefono es una friccion que no hace falta.
$('q').addEventListener('input', ev => { busca = ev.target.value; pintar(); });

$('b-salir').addEventListener('click', salir);
$('velo').addEventListener('click', cerrarHoja);
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && abierto) cerrarHoja(); });

document.addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if(chip){ filtro = chip.dataset.f; pintar(); return; }

  const mini = ev.target.closest('.mini');
  if(mini){
    const id = mini.closest('.lead').dataset.id;
    const lead = LEADS.find(l => String(l.id) === id);
    if(lead) editarDato(lead, mini.dataset.a);
    return;
  }

  const et = ev.target.closest('.etapa');
  if(et){
    const id = et.closest('.lead').dataset.id;
    const lead = LEADS.find(l => String(l.id) === id);
    if(lead) abrirHoja(lead);
    return;
  }

  const op = ev.target.closest('.op');
  if(op && abierto){
    const lead = abierto, slug = op.dataset.v;
    cerrarHoja();
    cambiarEtapa(lead, slug);
  }
});

/* El link del mail se mira ANTES que la sesión guardada: si alguien pidió una
   contraseña nueva, eso es lo que vino a hacer, aunque el teléfono todavía
   tenga una sesión vieja abierta. */
const DEL_MAIL = _delMail();

// Una sola fuente: si cambian las reglas, cambia la pista.
$('a-clave').textContent = CLAVE_PISTA;

cargarSesion();
if(DEL_MAIL && DEL_MAIL.token){
  $('p-entrar').hidden = true;
  $('p-clave').hidden = false;
  $('i-nueva').focus();
}else if(DEL_MAIL && DEL_MAIL.error){
  const e = $('e-entrar');
  e.textContent = DEL_MAIL.error;
  e.hidden = false;
}else if(sesion && sesion.access_token){
  mostrarPortal();
}
</script>
</html>
