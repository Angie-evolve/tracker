name: Tests

# Corre los tests en cada push a main para que un rojo se vea en GitHub
# (y llegue por mail) sin depender de acordarse de correrlos a mano.
# Todavia NO bloquea: main no exige este chequeo para aceptar un push. Eso se
# decide aparte, cuando haya PRs; hoy frenaria el trabajo diario.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Dos push seguidos: solo importa el resultado del ultimo.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `ci` y no `install`: respeta el package-lock tal cual, asi lo que pasa
      # aca es lo mismo que paso en la maquina donde se escribio el test.
      - run: npm ci
      - run: npm test
