name: Tests y publicación

# Corre los tests en cada push a main y RECIÉN SI PASAN publica la app en
# GitHub Pages (Angie, 17/10/2026). Antes Pages publicaba sola desde la rama y
# los tests solo avisaban: un cambio con un test rojo llegaba igual a la app.
# Ahora lo roto se queda en el repo y la app sigue en la última versión buena.
#
# Pages está en modo "GitHub Actions" (no "desde la rama"): si alguna vez hay
# que volver atrás, en Settings -> Pages se elige "Deploy from a branch",
# main, / (root).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Dos push seguidos: solo importa el resultado del último.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `ci` y no `install`: respeta el package-lock tal cual, así lo que pasa
      # acá es lo mismo que pasó en la máquina donde se escribió el test.
      - run: npm ci
      - run: npm test

  publicar:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Los <script src="js/...?v=DEV"> pasan a llevar el commit: asi el
      # navegador nunca junta un index.html nuevo con un js/ viejo de su cache.
      - run: sed -i "s/?v=DEV\"/?v=${GITHUB_SHA::7}\"/g" index.html
      # Se publica la raíz del repo, igual que antes: el tracker (index.html),
      # el portal (portal/) y el resto queda en las mismas direcciones.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
